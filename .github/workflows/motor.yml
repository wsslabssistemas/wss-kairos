name: Motor proativo

# ⚠ POR QUE GITHUB ACTIONS, E NÃO VERCEL CRON.
#
# O CLAUDE.md fixou Inngest para jobs de fundo, com o argumento "motor proativo
# não roda em serverless". Isso vale para milhares de disparos com repetição
# automática — não para ~30 mensagens por empresa por dia.
#
# O Vercel Cron seria o caminho natural, mas no plano Hobby ele é limitado a
# UMA execução por dia. O Actions é gratuito e ilimitado em repositório
# público (este é), o agendamento fica versionado junto do código, e desligar é
# apagar um arquivo.
#
# A ressalva honesta: o agendador do GitHub atrasa alguns minutos em horário de
# pico. Para uma janela de operação de 9h às 19h isso é irrelevante.
#
# ⚠ NADA DE LÓGICA AQUI. Este arquivo só bate numa porta. Quem decide quem
# recebe é `lib/motor.ts`, quem monta a lista é `lib/fila-db.ts`, quem manda é
# `lib/despacho.ts` — as MESMAS peças que a tela usa. Um agendador que
# começasse a decidir viraria uma segunda versão da regra.

on:
  schedule:
    # ⚠ NUNCA NO MINUTO :00, E DE 15 EM 15 MINUTOS. Isto é a correção de
    # 27/ago, e o motivo está medido, não suposto.
    #
    # O `schedule` do GitHub é best-effort. A documentação dele diz, com todas
    # as letras, que sob carga *"some queued jobs may be dropped"* — e nomeia
    # **o começo de cada hora** como o pior momento. O cron daqui era
    # `0 12` e `0 20`: o minuto exato que a documentação manda evitar.
    #
    # A prova está no histórico deste repositório. Em 8 execuções agendadas o
    # tique NUNCA foi pontual: 22, 25, 26, 49, 50, 52, 54 e 162 minutos de
    # atraso. E `created_at` era igual a `run_started_at` em todas — não havia
    # fila nem falta de runner; o atraso inteiro era o GitHub decidindo criar a
    # execução. Estávamos sempre no balde de alta carga. Em 27/ago ele passou
    # de "atrasa" para "descarta" e as DUAS execuções do dia sumiram: 15
    # mensagens não saíram de manhã, 15 não saíram à tarde.
    #
    # ⚠ A CAUSA RAIZ NÃO ERA O GITHUB, ERA O DESENHO: 15 mensagens penduradas
    # em UM tique, duas vezes ao dia. Perder um tique custava meio dia de
    # campanha. Agora são 40 batidas por dia — perder uma custa 15 minutos.
    #
    # ⚠ E QUASE TODA BATIDA VAI SER RECUSADA. Quem decide a cadência é o motor
    # (`min_minutos_entre_rodadas`, em `lib/espacamento.ts`), não este arquivo
    # — a regra de "nada de lógica aqui" continua valendo, e é justamente por
    # ela que dá para bater sempre sem mudar o que sai.
    #
    # Horas 12–21 UTC = 9h–18h de Brasília, dentro da janela padrão (9h–19h).
    # O motor confere o horário de novo com o fuso da EMPRESA (`lib/fuso.ts`):
    # confiar no relógio do agendador foi o defeito que fez a simulação voltar
    # vazia às 18h.
    - cron: "7,22,37,52 12-21 * * 1-5"
  # Permite rodar à mão pelo site do GitHub — com a opção de simular.
  workflow_dispatch:
    inputs:
      simular:
        description: "Rodar sem enviar nada (simulação)"
        type: boolean
        default: true

jobs:
  rodar:
    name: Rodar o motor
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o gatilho
        env:
          SEGREDO: ${{ secrets.MOTOR_CRON_SECRET }}
          BASE: ${{ vars.KAIROS_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SEGREDO:-}" ]; then
            echo "::error::Falta o segredo MOTOR_CRON_SECRET nas configuracoes do repositorio."
            exit 1
          fi

          BASE="${BASE:-https://kairos.wsslabs.com.br}"
          SIMULAR="${{ github.event.inputs.simular || 'false' }}"
          URL="$BASE/api/motor/rodar"
          if [ "$SIMULAR" = "true" ]; then URL="$URL?simular=1"; fi

          echo "Chamando $URL"

          # `-w` guarda o codigo HTTP: sem isso um 401 devolveria corpo de erro
          # com exit 0, e o job ficaria VERDE com a automacao sem rodar — que e
          # a forma de falha que ninguem procura.
          CODIGO=$(curl -sS -o resposta.json -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer $SEGREDO" \
            --max-time 300)

          echo "HTTP $CODIGO"
          cat resposta.json
          echo

          if [ "$CODIGO" != "200" ]; then
            echo "::error::O motor respondeu $CODIGO."
            exit 1
          fi

          # ⚠ FALHA DE ENVIO NAO PODE PASSAR EM VERDE. O relatorio volta 200
          # mesmo quando a Meta recusou mensagens — e "rodou" nao e o mesmo que
          # "entregou". Sem esta linha, o unico lugar onde a falha apareceria
          # seria o log da Vercel, que ninguem abre.
          FALHAS=$(grep -o '"falhas":[0-9]*' resposta.json | head -1 | cut -d: -f2 || echo 0)
          if [ "${FALHAS:-0}" != "0" ]; then
            echo "::warning::O motor rodou, mas houve $FALHAS falha(s) de envio. Veja a aba Canal oficial."
          fi
