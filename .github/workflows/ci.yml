name: CI

# Falha o build quando um manifesto de Skill nasce inválido — a Lei 2
# ("Skill é dado, nunca código") virando barreira automática, não revisão.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-validator:
    name: Validador de Skill (RF-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install
      - name: Validar manifestos
        run: npm run -w @cos/skill-loader validate
      - name: Testes do validador
        run: npm run -w @cos/skill-loader test
      # O validador acima olha o MANIFESTO. Este olha a BIBLIOTECA — foi por
      # essa fresta que a barbearia ganhou 2 entradas numa categoria que não
      # existe e sobreviveu do 0017 até ago/2026.
      - name: Validar bibliotecas (categoria, escola e fatos)
        run: node packages/db/tests/library_check.mjs
      # DNA de demonstração com chave errada falha na direção que PARECE segura:
      # a entrada escala para sempre e ninguém entende por quê.
      - name: Validar DNA de demonstração
        run: node packages/db/tests/demo_dna_check.mjs
      # Espaçamento quebrado se parece com "ainda não chegou a hora": a tela
      # continua funcionando e a prática distribuída simplesmente não acontece.
      # Roda no CI porque é lógica pura — sem banco e sem chave.
      - name: Regra da repescagem espaçada
        run: node packages/db/tests/repescagem_test.mjs
      # A conta que COBRA dinheiro de alguem: piso, sugestao e, principalmente,
      # a recusa quando a amostra nao sustenta.
      - name: Preço sugerido
        run: node packages/db/tests/precificacao_test.mjs
      # As quatro chaves de qualificação existem em dois arquivos (o validador e
      # o app). Este teste confere que não divergiram.
      - name: Qualificação de compra
        run: node packages/db/tests/qualificacao_test.mjs
      # A montagem do exercício de fim de módulo: determinismo, pontuação não
      # inventada e nenhuma chave de máquina vazando para a tela.
      - name: Exercício do curso
        run: node packages/db/tests/exercicio_test.mjs
      # `technique`, `strategy` e `trigger_questions` são LIDOS pelo vendedor e
      # pelo aluno. Palavra sem acento não quebra nada e não aparece em revisão
      # — só chega ao cliente pagante. Roda no CI porque é texto puro.
      - name: Acento na biblioteca e nos manifestos
        run: node packages/db/tests/acentuacao_check.mjs
      # A COTA DE IA. E a unica peca cujo defeito aparece como CONTA no fim do
      # mes, nao como tela quebrada: cota que nao bloqueia se parece exatamente
      # com cota que bloqueia. Roda no CI porque e funcao pura.
      - name: Cota de IA e teto de gasto
        run: node packages/db/tests/cota_test.mjs
      # Importar contato com a coluna errada NAO da erro: a tela diz "3.000
      # importados", o numero esta certo e o conteudo esta todo trocado.
      - name: Reconhecimento de coluna na importacao
        run: node packages/db/tests/importacao_test.mjs
      # CNAE errado nao da erro: a busca volta vazia, e "nao achei empresa
      # nenhuma" e indistinguivel de "o codigo esta errado".
      - name: Catalogo de alvos da prospeccao
        run: node packages/db/tests/cnae_test.mjs
      # Renovacao errada nao quebra tela: o contato acontece, o cliente
      # responde, e o defeito so aparece na taxa de renovacao tres meses depois.
      - name: Janelas de renovacao
        run: node packages/db/tests/renovacao_test.mjs
      # O placar mostra o desempenho de UMA PESSOA para os colegas dela. Errar
      # aqui nao quebra tela: desmotiva gente, e ela nao tem como contestar um
      # numero que o sistema afirma.
      - name: Placar da equipe (o piso de amostra)
        run: node packages/db/tests/placar_test.mjs
      # Cor vai para `style` inline e logo para `src`: campo livre nos dois e
      # injecao. E nao da erro na tela de quem configurou — da na de quem usa.
      - name: Aparencia por empresa (o que e aceito)
        run: node packages/db/tests/aparencia_test.mjs
      # Aqui a tentacao e prometer precisao que o dado nao tem: a fonte publica
      # nao devolve coordenada, entao "raio de 3 km" seria invencao.
      - name: Proximidade na prospeccao
        run: node packages/db/tests/proximidade_test.mjs
      # O UNICO teste cujo defeito sai da empresa e chega em quem nao pediu
      # nada: E.164 errado manda mensagem PARA OUTRA PESSOA. Guarda o caso do
      # DDD 55 (Santa Maria/RS), que a regra antiga corrompia em silencio.
      - name: E.164 brasileiro (o numero que a mensagem procura)
        run: node packages/db/tests/telefone_test.mjs
      # Oferecer horario nao levanta excecao quando esta errado: "06:30, 06:30,
      # 06:30" e uma resposta perfeitamente valida e completamente inutil.
      - name: Turno em vez de hora
        run: node packages/db/tests/turno_test.mjs
      # O webhook e o UNICO endereco do produto que qualquer um na internet
      # pode chamar, e ele ESCREVE no historico de um cliente pagante. Guarda
      # a assinatura (inclusive: sem segredo configurado, RECUSA em vez de
      # liberar) e a janela de 24h, que decide o que pode ser dito.
      - name: Webhook do WhatsApp (assinatura e janela de 24h)
        run: node packages/db/tests/webhook_test.mjs
      # Aviso que nao aparece se parece com aviso que ainda nao chegou a hora:
      # a tela funciona, ninguem ve erro, e a pessoa so descobre que o teste
      # acabou quando a IA para. Ai ela nao negocia — some.
      - name: Teste gratis (avisos 7/3/1 e a trava no fim)
        run: node packages/db/tests/teste_gratis_test.mjs
      # Coluna de tabela do DNA chegava CRUA na tela: o cliente novo via
      # "o_que_faz" acima da caixa de texto. Mesma classe do next_objective —
      # campo que PARECE chave de maquina e nao e, porque alguem le. O teste
      # guarda a COBERTURA: segmento novo com coluna nova falha aqui, nao na
      # tela de quem esta avaliando o produto.
      - name: Rotulo das colunas do DNA
        run: node packages/db/tests/rotulos_test.mjs
      # A policy `skills_read_installed` so mostra a Skill JA INSTALADA. Com o
      # cliente do usuario, perguntar sobre segmento nao instalado volta VAZIO
      # — sem erro, sem aviso — e a tela decide errado em cima disso. Derrubou
      # o produto TRES VEZES em 9/ago, sempre com sintoma diferente e sempre
      # com a mesma causa. Este teste mantem o inventario: ponto novo lendo
      # `skills` falha ate ser classificado.
      - name: Quem le `skills`, e com qual cliente
        run: node packages/db/tests/skills_client_check.mjs
      # Caixa de texto vazia nao e so trabalho: e uma decisao em branco. Vinte
      # decisoes em branco seguidas, sem saber se acertou, e o que faz alguem
      # fechar a aba no meio do cadastro — e o DNA e o gargalo declarado do
      # produto. Segmento novo nao pode nascer sendo caixa vazia.
      - name: Sugestao em todo campo aberto do DNA
        run: node packages/db/tests/sugestoes_dna_check.mjs
      # ⚠ O CORTE SILENCIOSO DO POSTGREST — 1.000 LINHAS, SEM AVISO.
      #
      # `.limit(5000)` NAO protege: o teto e do servidor. Em 14/ago/2026 o
      # Analista de Gestao respondeu ao fundador que o ultimo movimento fora
      # 20 dias antes; havia 32 interacoes no dia anterior. Existiam 1.955
      # linhas no periodo e chegaram 1.000, ARBITRARIAS (sem ORDER BY a ordem
      # nem e estavel entre chamadas). A IA raciocinou com honestidade sobre
      # um recorte que ninguem sabia que existia.
      #
      # Ninguem tem como desconfiar de um dado que nao apareceu — este e o
      # unico defeito daqui que nao da sinal nenhum. So apareceu porque o dono
      # conhece a operacao de cor.
      #
      # A trava tambem cobre o caso mais perigoso: consulta SEM `.limit()`
      # nenhum, que parece inocente e e a mais exposta.
      - name: Nenhuma leitura grande sem paginacao
        run: node packages/db/tests/paginacao_check.mjs
      # Cadencia e escada, nao eco: os passos precisam dizer coisas
      # DIFERENTES, e toda etapa viva precisa saber o que dizer.
      - name: Nenhuma etapa viva muda
        run: node packages/db/tests/cadencia_check.mjs
      # A fila: quitacao do toque, um motivo por pessoa, e a regra do pretexto
      # (uma DATA nao e um MOTIVO).
      - name: Fila — quitacao, motivo unico e pretexto
        run: node packages/db/tests/fila_test.mjs
      # Por qual numero cada motivo sai. Guarda tres coisas faceis de desfazer:
      # o padrao quase todo no link humano (separacao por PUBLICO, nao por
      # ferramenta), credencial nao ligar canal, e "bloqueado" nao cair de
      # volta no wa.me — que despejaria mil reativacoes no celular pessoal de
      # um vendedor, em silencio.
      - name: Roteamento — por onde cada motivo sai
        run: node packages/db/tests/roteamento_test.mjs
      # O custo das mensagens da Meta. Guarda o arredondamento (utilidade custa
      # 3,4 centavos, e arredondar por linha erra de 12% a 100% para MENOS,
      # sempre) e a data de 1/out/2026, em que ate a resposta passa a ser
      # cobrada — escrita como data no codigo, para a estimativa parar de estar
      # errada sozinha.
      - name: Custo de mensagem — tarifa, arredondamento e o prazo de outubro
        run: node packages/db/tests/custo_mensagem_test.mjs
      # As variaveis de um modelo aprovado. A Meta recusa a mensagem INTEIRA se
      # o valor tiver quebra de linha, tabulacao ou mais de 4 espacos seguidos
      # — e os nomes vieram da planilha da academia, com espaco duplo e caixa
      # alta. Derivar o primeiro nome nunca grava, como o paraE164BR.
      - name: Modelo — higiene das variaveis e o primeiro nome
        run: node packages/db/tests/modelo_test.mjs
      # O motor proativo. As seis regras anti-bloqueio da tela de Automacao
      # eram gravadas desde que ela nasceu e NENHUMA linha do sistema as lia —
      # um formulario que salva e ninguem cumpre promete um freio que nao
      # existe. Guarda tambem a janela que vira a meia-noite (22->6), onde uma
      # comparacao ingenua devolve SEMPRE falso e a automacao nunca roda.
      # O preco da IA. O fundador pos teto de R$ 100, o teto bateu, e a
      # Anthropic tinha cobrado US$ 13,41 — o sistema contava 1,5 vez a mais,
      # porque usava a tabela cheia do Sonnet 5 e o modelo esta em promocao de
      # lancamento ate 31/08/2026. Teto que erra por 50% nao protege ninguem, e
      # depois da virada ele erraria para BAIXO, que e o lado pior.
      - name: Preco da IA — a virada da promocao, nos dois lados
        run: node packages/db/tests/preco_ia_test.mjs
      # O "👍" que nao pede resposta. Assunto pequeno, erro caro: fechar por
      # engano deixa alguem esperando PARA SEMPRE, porque sai da lista e
      # ninguem descobre. Este teste guarda a regra de so fechar sozinho o que
      # nao tem UMA LETRA — e existe para que ninguem "melhore" a regra
      # incluindo palavras.
      - name: Mensagem que nao pede resposta (emoji x cortesia)
        run: node packages/db/tests/fecho_test.mjs
      # "Mes que vem" nao e data, e alguem precisa escolher uma. A regra e do
      # fundador: primeira segunda-feira. Guarda o caso que quebra conta
      # ingenua — quando o dia 1o JA E segunda, a resposta e o proprio dia 1o,
      # e a versao sem `% 7` marcaria a pessoa uma semana tarde.
      - name: A data do retorno (primeira segunda do mes)
        run: node packages/db/tests/retorno_test.mjs
      - name: Motor — as regras anti-bloqueio sendo obedecidas
        run: node packages/db/tests/motor_test.mjs
      # Quem pediu para nao receber mais. Honrar descadastro e exigencia da
      # LGPD e da politica do WhatsApp, e a marcacao e automatica porque a
      # janela entre "ele pediu" e "alguem viu" e onde a denuncia acontece.
      # Metade do teste guarda os FALSOS POSITIVOS: uma lista de palavras
      # soltas silenciaria gente interessada por dizer "quero sair do plano".
      - name: Descadastro — o que e pedido e o que nao pode ser confundido
        run: node packages/db/tests/optout_test.mjs
      # O gemeo ativo: quem ja e cliente e tem um cadastro velho solto. A
      # Lilian renovou, alguem cadastrou um contato NOVO com o telefone
      # digitado com um digito a menos, e a reativacao mirou a linha velha.
      # ⚠ O sinal e o TELEFONE, nunca o nome — a base tem um contato chamado
      # so "Leticia" que casaria com quatro Leticias diferentes.
      - name: Gemeo ativo — nao oferecer retorno a quem ja e cliente
        run: node packages/db/tests/gemeo_test.mjs
      # A hora local da EMPRESA. O servidor da Vercel roda em UTC e o Brasil e
      # UTC-3: as 18h de Porto Alegre o processo lia 21h, se considerava fora
      # da janela de 9h-19h e nao rodava. O sintoma foi "nao gera lista
      # nenhuma" — nada quebrou, a lista voltava vazia com motivo plausivel.
      - name: Fuso — a hora da empresa, nao a do servidor
        run: node packages/db/tests/fuso_test.mjs
      # O que cada nome de plano SIGNIFICA. A coluna `Plano` da exportacao era
      # ignorada: das 393 linhas da Be Fitness, 46 sao "Treino Avulso" (gente
      # de passagem) e 16 sao "Semana FREE". Tratar os tres como contrato faz o
      # avulso virar ex-aluno e receber oferta de RETORNO sem nunca ter sido
      # cliente. ⚠ Metade do teste guarda o padrao: plano desconhecido cai em
      # `contrato`, porque excluir alguem da renovacao e silencioso.
      - name: Tipo de plano — contrato, avulso ou cortesia
        run: node packages/db/tests/planos_test.mjs
      # A regua de follow-up no ACERVO. Ela escolhia o ULTIMO passo vencido, e
      # com isso uma mensagem quitava a sequencia inteira de quem estava parado
      # ha meses: a regua de tres toques virava um toque so, exatamente na base
      # onde ela mais vale. Fila menor do que devia parece trabalho em dia.
      - name: Cadencia — qual passo vem agora, e quando
        run: node packages/db/tests/cadencia_test.mjs
      # A racao do dia. Guarda o caso que apaga a fila em silencio: valor
      # invalido nao pode virar zero, senao a tela abre vazia e a pessoa
      # conclui que esta tudo em dia.
      - name: Racao — o teto do que o sistema pede por dia
        run: node packages/db/tests/racao_test.mjs
      # Contato sem responsavel nao aparece na fila de NINGUEM. O webhook do
      # WhatsApp criava lead orfao exatamente assim — sem erro e sem aviso.
      # O que o sistema AFIRMA e a fonte nao confirma. Guarda a regra que mais
      # importa ali: nao acusar sobre AUSENCIA de dado — "nunca pagou" so pode
      # ser dito se os recebimentos foram conferidos.
      - name: Contradicoes — o que o sistema afirma sem base
        run: node packages/db/tests/contradicoes_test.mjs
      - name: Carteira — quem recebe o contato que chega sozinho
        run: node packages/db/tests/carteira_test.mjs
      # A medicao que fecha o ciclo tecnica -> desfecho, e que existe para
      # dizer "ainda nao sei" na maior parte das vezes.
      - name: Aprendizado — o piso de amostra e o silencio
        run: node packages/db/tests/aprendizado_test.mjs
      # Sincronizacao com a planilha: ausencia vira historico, e a trava da
      # planilha parcial impede baixa em massa.
      - name: Sincronizacao — foto x historico
        run: node packages/db/tests/sincronizacao_test.mjs
      # O leitor de planilha: recusa adivinhar a chave, e a planilha e um LOG.
      - name: Leitor de planilha
        run: node packages/db/tests/planilha_test.mjs
