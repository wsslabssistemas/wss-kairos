# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     consultiva_spin
  availability:        consultiva_spin
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       challenger
  objections:          negociacao_voss
  commitment_offer:    cadencia_blount
  reciprocity:         consultiva_spin
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica - a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # REGUA LONGA, DE PROPÓSITO. Rackham mediu: em ticket alto, pressão DERRUBA
  # conversão. Cada toque precisa trazer informação nova, e o intervalo
  # respeita que do outro lado existe processo interno, não humor.
  # Deste ramo: quem pede e o técnico e quem assina e outro;
  # a venda morre quando para no técnico.
  # -------------------------------------------------------------------
  - key: descoberta_parada
    applies_to: qualification
    steps:
      - { offset_days: 3, intent: "Confirmar o problema operacional em uma pergunta e descobrir quem mais participa da decisão. Proposta que não chega a quem assina não e avaliada." }
      - { offset_days: 8, intent: "Trazer um caso parecido de operação semelhante, sem pedir nada - prova antes de pergunta funciona melhor em B2B técnico." }
      - { offset_days: 18, intent: "Perguntar se o projeto segue em pe neste orçamento ou mudou de ano, e aceitar a resposta." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: visita_pendente
    applies_to: service
    steps:
      - { offset_days: 3, intent: "Confirmar a visita técnica e o que precisa estar disponível no local. Visita que volta sem dado e escopo errado depois." }
      - { offset_days: 10, intent: "Se a visita não aconteceu, remarcar oferecendo duas janelas concretas em vez de perguntar quando da." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 2

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 3, intent: "Nomear a objeção e responder com o fato que falta - prazo de obra, garantia, suporte depois da entrega." }
      - { offset_days: 8, intent: "Checar se o que trava e técnico ou orcamentario: uma se resolve com engenheiro, a outra com quem assina." }
      - { offset_days: 18, intent: "Perguntar em que etapa interna esta e o que falta para destravar - em B2B a resposta costuma ser um documento, não uma decisão." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: pos_proposta
    applies_to: proposal_followup
    steps:
      - { offset_days: 2,  intent: "Confirmar que recebeu e tirar dúvida técnica" }
      - { offset_days: 7,  intent: "Cobrar posição sem pressionar" }
      - { offset_days: 15, intent: "Última chamada com condição de fechamento" }
    stop_on: [replied, converted, opted_out, lost]

  - key: prospeccao_fria
    applies_to: cold_outreach
    steps:
      - { offset_days: 3, intent: "Retomada com novo ângulo de valor" }
      - { offset_days: 8, intent: "Última tentativa, porta aberta" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

  - key: reativacao
    applies_to: reactivation
    steps:
      - { offset_days: 0,  intent: "Retomar contato com gancho de manutenção" }
      - { offset_days: 30, intent: "Oferecer revisão preventiva" }
    stop_on: [replied, converted, opted_out]

hard_rules:
  - "Nunca prometer prazo de entrega ou garantia que não esteja no DNA."
  - "Não passar preço fechado antes da visita técnica quando o escopo depende de levantamento."
  - "Em edital, nunca afirmar atendimento a especificação sem conferir o item."

kpis:
  - taxa_conversao
  - ticket_medio
  - tempo_resposta_mediana
  - propostas_enviadas
  - taxa_vitoria_licitacao
