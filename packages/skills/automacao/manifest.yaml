key: automacao
name: Automação e Sistemas Prediais
version: 1.0.0

# =====================================================================
# Segmento B2B/B2G: vende para EMPRESAS e para o PODER PÚBLICO.
# Nenhuma linha do sistema muda entre esta Skill e a de academia — a
# diferença toda está neste arquivo. É a prova da Lei 1.
# =====================================================================

# Módulos que este segmento usa. O núcleo mostra a aba só se o segmento
# oferece E a empresa tem (teste ou compra). B2C não recebe prospecção.
capabilities:
  - prospeccao
  - licitacoes

vocabulary:
  lead: "empresa prospectada"
  conversion: "contrato fechado"
  churn: "perda de contrato"
  catalog_item: "solução"

discovery_axis: "dor operacional (custo de energia, falha de equipamento, conformidade, obra nova)"

# ---------------------------------------------------------------------
# JORNADA — venda técnica consultiva. Ciclo longo, com visita técnica e
# proposta orçada. Nada a ver com a jornada de academia.
# ---------------------------------------------------------------------
journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: prospeccao
      label: "Prospecção"
      cadence: prospeccao_fria
      goal: "Identificar a empresa certa e chegar em quem decide. Nunca abrir com preço."
      phases:
        - { key: abordagem,  label: "Primeira abordagem", offset_days: 0 }
        - { key: followup_1, label: "Retomada",           offset_days: 3 }
        - { key: followup_2, label: "Última tentativa",   offset_days: 8 }
    - key: qualificacao
      label: "Qualificação"
      cadence: descoberta_parada
      goal: "Entender a operação, o problema real e quem assina."
    - key: levantamento
      label: "Visita técnica"
      cadence: visita_pendente
      goal: "Levantar em campo o escopo e as condições da instalação."
      phases:
        - { key: agendamento, label: "Agendar visita",  offset_days: 0 }
        - { key: realizacao,  label: "Realizar visita", offset_days: 3 }
    - key: proposta
      label: "Proposta técnica"
      cadence: pos_proposta
      goal: "Entregar escopo, prazo e investimento. Defender valor, não preço."
      phases:
        - { key: envio,      label: "Enviar proposta",     offset_days: 0 }
        - { key: retorno,    label: "Confirmar recebimento", offset_days: 2 }
        - { key: cobranca,   label: "Cobrar posição",      offset_days: 7 }
    - key: negociacao
      label: "Negociação"
      cadence: negociacao_travada
      goal: "Isolar a objeção real (preço, prazo, concorrente) e fechar."
    - key: fechado
      label: "Contrato fechado"
      terminal: true
      won: true
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisão.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

contact_fields:
  - key: porte
    label: "Porte da empresa"
    type: enum
    options: [mei, micro, pequena, media, grande, orgao_publico]
  - key: setor
    label: "Setor"
    type: enum
    options: [industria, comercio, saude, educacao, predial, agro, alimenticio, publico, outro]
  - key: necessidade
    label: "Necessidade principal"
    type: enum
    options: [climatizacao, refrigeracao, energia, automacao_predial, monitoramento, manutencao, retrofit, outro]
  - key: decisor
    label: "Papel do contato"
    type: enum
    options: [dono, diretor, gerente, engenharia, compras, manutencao, indefinido]

  # ---------------------------------------------------------------------
  # QUALIFICACAO DE COMPRA (MEDDIC-lite) - item 3 do M3.
  # As quatro perguntas que dizem se o negocio existe de verdade. O campo
  # `decisor` diz QUEM e o contato; estes dizem como a compra anda.
  # Chaves e opcoes sao CANONICAS (validadas pelo skill-loader): sem isso a
  # dimensao não se compara entre segmentos, que e a unica razao de existir.
  # Só o label e do ramo.
  # ---------------------------------------------------------------------
  - key: verba
    label: "Verba do projeto"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Como aprovam o investimento"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem defende por dentro"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
services:
  enabled: false

lead_sources:
  - prospeccao
  - licitacao
  - indicacao
  - site
  - feira
  - representante
  - cliente_antigo
  - instagram
  - facebook
  - whatsapp
  - campanha
  - outro

# ---------------------------------------------------------------------
# SEÇÕES DE DNA — os fatos que o motor pode afirmar sobre a empresa.
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# POR QUE O CLIENTE NÃO FECHOU (OU NÃO RENOVOU)
#
# Lista fechada, do MANIFESTO — é o que permite SOMAR. `fora_da_campanha` tira
# da reativação automática, e `abordagem` é o texto que chega em quem redige.
#
# ⚠ AQUI EXISTEM DOIS NEGÓCIOS DENTRO DE UM: a INSTALAÇÃO, que acontece uma vez
# e segue o calendário da obra, e a MANUTENÇÃO, que é receita recorrente e é a
# que quase sempre se perde em silêncio. Sistema instalado e sem contrato de
# manutenção não avisa que parou de ser cliente — ele só liga no dia em que
# quebra, e aí a conversa é urgência, não venda.
churn_reasons:
  - key: obra_parada
    label: "A obra parou ou atrasou"
    o_que_fazer: "Não é perda, é calendário. Pergunte para quando ficou e REGISTRE a data — insistir com obra parada é ruído, e quem some por isso costuma voltar quando o prédio anda."
    pausa_dias: 60
    abordagem: "Na data que ele indicou, retome pelo ponto da obra, não pela proposta: 'você tinha comentado que a parte elétrica ficaria pronta por volta de [mês] — como está?'."
  - key: instalou_com_outro
    label: "Instalou com outra empresa"
    o_que_fazer: "O sistema já é de outro, mas a MANUTENÇÃO não tem dono. Ofereça assistência, ampliação e adequação — e anote a marca instalada, porque é ela que diz o que vai falhar primeiro."
    pausa_dias: 180
    abordagem: "Depois de seis meses, ofereça manutenção sem criticar quem instalou: 'faço manutenção nesse tipo de sistema — se precisar de alguém por perto, é só chamar'."
  - key: orcamento
    label: "Orçamento acima do previsto"
    o_que_fazer: "É o único motivo em que condição resolve, e o caminho é ESCOPO por etapas — começar pelo que dá segurança ou pelo que a obra exige agora, deixando o resto para a fase seguinte."
  - key: sem_manutencao
    label: "Não renovou o contrato de manutenção"
    o_que_fazer: "Este é o churn silencioso do ramo: ninguém cancela manutenção, só deixa vencer. Pergunte se houve problema no atendimento ou se foi custo — e ofereça um plano menor antes de perder a conta inteira. Sistema sem manutenção volta como emergência, e emergência é a conversa mais cara para os dois lados."
  - key: falha_no_servico
    label: "Problema no serviço ou no atendimento"
    o_que_fazer: "NÃO ofereça desconto. Diga o que aconteceu, o que mudou, e proponha uma visita técnica de reteste. Em serviço predial a confiança é sobre o prédio funcionar — quem falhou uma vez precisa provar duas."
    pausa_dias: 20
    abordagem: "Depois de 20 dias, procure com o que MUDOU, não com desculpa."
  - key: trocou_de_responsavel
    label: "Mudou o síndico, o gestor ou o responsável"
    o_que_fazer: "O contrato não caiu por mérito: caiu porque quem defendia saiu. Descubra quem entrou e ofereça uma apresentação do zero — para a pessoa nova, o contrato é herança de outro, não escolha dela."
  - key: imovel_vendido
    label: "Vendeu o imóvel ou saiu da administração"
    o_que_fazer: "Fora do alcance neste endereço. Pergunte quem assumiu — o novo responsável é um lead, e ninguém mais tem essa informação."
    fora_da_campanha: true
  - key: nao_disse
    label: "Não quis dizer"
    o_que_fazer: "Registre assim mesmo: quem não contou é diferente de quem nunca foi perguntado."

dna_sections:
  - key: solucoes
    label: "Soluções e produtos"
    required: true
    fields:
      - { key: linhas, type: list, required: true, label: "Linhas de produto", help: "As linhas de produto que você trabalha" }
      - { key: marcas_representadas, type: list, label: "Marcas representadas", help: "Marcas que você representa ou revende" }
      - { key: diferencial_tecnico, type: text, required: true, label: "Diferencial técnico", help: "Por que escolher você e não o concorrente. Seja concreto", options: ["Equipe própria, sem terceirizar a instalação", "Projeto e execução na mesma casa", "Atendimento de manutenção com prazo acordado", "Especialização numa marca ou tecnologia específica"] }
  - key: atuacao
    label: "Área de atuação"
    required: true
    fields:
      - { key: regiao, type: text, required: true, label: "Região atendida", help: "Onde você atende. Ex.: Porto Alegre e região metropolitana", options: ["A capital e a região metropolitana", "Todo o estado", "Só a minha cidade", "Atendo fora da região com custo de deslocamento"] }
      - { key: atende_obra_nova, type: boolean, label: "Atende obra nova?", help: "Marque se você atende obra nova" }
      - { key: atende_retrofit, type: boolean, label: "Atende retrofit?", help: "Marque se você faz reforma e troca de sistema existente" }
  - key: comercial
    label: "Condições comerciais"
    required: true
    fields:
      - { key: ticket_medio, type: money_range, label: "Ticket médio", help: "O valor médio dos seus contratos. Ex.: de R$ 8 mil a R$ 40 mil" }
      - { key: prazo_pagamento, type: text, label: "Prazo de pagamento", help: "Condições de pagamento. Ex.: 30/60 dias para cliente cadastrado", options: ["À vista", "28 dias", "30/60 dias", "30/60/90 dias", "Boleto na entrega", "Antecipado para cliente novo"] }
      - { key: prazo_entrega, type: text, required: true, label: "Prazo de entrega", help: "Quanto tempo até entregar. Ex.: 15 dias úteis após aprovação", options: ["No mesmo dia", "Em até 3 dias úteis", "Em até 1 semana", "15 dias úteis após aprovação", "Varia por item"] }
      - { key: garantia, type: text, required: true, label: "Garantia", help: "O que você garante depois do serviço. Ex.: Retoque grátis em até 7 dias", options: ["1 ano no serviço e a do fabricante nas peças", "90 dias no serviço, como manda a lei", "1 ano no serviço e nas peças", "Garantia estendida mediante contrato de manutenção"] }
  - key: capacidade
    label: "Capacidade e credenciais"
    fields:
      - { key: equipe_tecnica, type: text, label: "Equipe técnica", help: "Quantas pessoas e com que formação. Ex.: 4 técnicos e 1 engenheiro", options: ["Equipe própria com técnicos e um responsável técnico", "Equipe própria pequena, com apoio de parceiros no pico", "Trabalho com equipe terceirizada que coordeno", "Sou eu e um ajudante"] }
      - { key: certificacoes, type: list, label: "Certificações", help: "Certificações e licenças que você possui" }
      - { key: obras_referencia, type: list, label: "Obras de referência", help: "Trabalhos importantes que já fez e pode citar" }
  - key: pos_venda
    label: "Pós-venda"
    fields:
      - { key: manutencao_contrato, type: boolean, label: "Contrato de manutenção", help: "Marque se você oferece contrato de manutenção" }
      - { key: suporte, type: text, label: "Suporte", help: "Como funciona o atendimento depois da venda", options: ["Atendimento por WhatsApp em horário comercial", "Atendimento por WhatsApp e telefone, com técnico responsável", "Suporte com prazo de resposta acordado em contrato", "Atendimento sob demanda, sem contrato de suporte"] }
  - key: publico
    label: "Venda ao poder público"
    fields:
      - { key: cadastro_sicaf, type: boolean, label: "Cadastro no SICAF", help: "Marque se você já está cadastrado no SICAF (para vender ao governo)" }
      - { key: porte_declarado, type: text, label: "Porte declarado", help: "Seu porte. Ex.: EPP — dá direito a vantagens em licitação", options: ["MEI", "ME — microempresa", "EPP — empresa de pequeno porte", "Média empresa"] }
      - { key: atestados_capacidade, type: list, label: "Atestados de capacidade", help: "Atestados que comprovam que você já fez trabalho parecido" }

  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text
    # Entra no contexto marcado como não estruturado.
    # Nunca pode ser fonte de preço, prazo ou política.

categories:
