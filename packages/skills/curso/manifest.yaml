  - key: estrutura
    label: "Professores e metodologia"
    fields:
      - { key: professores, type: text, label: "Professores", help: "Quem dá aula e a formação de cada um", options: ["Equipe formada na área, com registro no conselho", "Equipe própria, com formação e experiência no ramo", "Professores contratados por especialidade", "Sou eu quem dá as aulas"] }
      - { key: metodologia, type: text, label: "Metodologia", help: "Como a aula acontece na prática. O que o aluno faz na primeira aula", options: ["Aula prática desde o primeiro dia", "Teoria curta e prática guiada", "Aula expositiva com exercícios", "Projeto do começo ao fim do curso"] }
