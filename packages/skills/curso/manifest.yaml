      - { key: entrada_turma_iniciada, type: text, label: "Entrar em turma já começada", help: "Dá para entrar depois que a turma começou? Até quando", options: ["Pode entrar nas primeiras semanas", "Pode entrar a qualquer momento, com nivelamento", "Só na abertura da turma", "Avalio caso a caso"] }
  - key: corporativo
