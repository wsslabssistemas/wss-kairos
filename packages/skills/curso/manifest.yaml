      - { key: pre_requisito, type: text, label: "Pré-requisito", help: "Precisa saber algo antes de entrar? O quê", options: ["Não há pré-requisito", "Precisa de teste de nível", "Precisa de escolaridade mínima", "Precisa de conhecimento prévio na área"] }
