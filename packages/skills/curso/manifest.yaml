      - { key: local, type: text, label: "Onde acontece", help: "Na empresa, na escola ou online", options: ["Na empresa do cliente", "Na escola", "Online", "Na empresa, na escola ou online"] }
      - { key: faturamento, type: text, label: "Como fatura", help: "Nota para a empresa, contrato, prazo de pagamento", options: ["Nota para a empresa, com prazo combinado", "Nota para a empresa, pagamento antecipado", "Contrato com pagamento parcelado", "Depende do porte do contrato"] }

  - key: free_notes
