      - { key: plataforma, type: text, label: "Plataforma ou laboratório", help: "Que ferramenta, sistema ou laboratório o aluno usa", options: ["Plataforma própria de estudo", "Plataforma do material didático", "Laboratório presencial equipado", "Sem plataforma — material impresso"] }
      - { key: reposicao, type: text, label: "Reposição de aula", help: "O aluno que faltou repõe? Como", options: ["O aluno repõe em outra turma, se houver vaga", "Aula gravada disponível para quem faltou", "Reposição agendada com o professor", "Não há reposição"] }
  - key: resultados
