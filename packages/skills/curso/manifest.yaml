key: curso
name: Escola de Curso e Formação
version: 1.0.0

# =====================================================================
# Idiomas, profissionalizante, preparatório, técnico livre e corporativo.
#
# POR QUE ESTE SEGMENTO EXISTE, se `escola_esportiva` já tem turma,
# matrícula, horário e professor: porque o que ela cobre é a camada
# OPERACIONAL, e a venda de curso não trava ali. Conferido contra as 239
# entradas das treze bibliotecas antes de escrever uma linha — nenhuma
# fala de certificação, reconhecimento, empregabilidade, teste de nível,
# carga horária, aproveitamento de estudos, calendário de turmas ou
# in-company. É o que separa "nome de manifesto" de "cobertura".
#
# A DIFERENÇA DE FUNDO: aqui o produto é uma PROMESSA DE TRANSFORMAÇÃO
# FUTURA. A barbearia entrega o corte na hora; o curso entrega em 6, 12 ou
# 24 meses. Isso muda três coisas de uma vez:
#   • a prova não é a estrutura, é o resultado de quem já saiu;
#   • o risco percebido não é o preço, é "e se eu não terminar?";
#   • e a promessa fácil (emprego, aprovação, fluência) é a mais cara do
#     setor — por isso ela é `hard_rule`, não recomendação.
# =====================================================================

capabilities: []   # B2C local: prospecção fria de pessoas é proibida (LGPD)

vocabulary:
  lead: "interessado"
  conversion: "matrícula"
  churn: "evasão"
  catalog_item: "curso"

discovery_axis: "para que serve o curso (trabalho, prova, viagem, exigência da empresa) e de que ponto a pessoa está partindo"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Descobrir para quem é e para quê. O objetivo é que escolhe o curso — preço sem objetivo vende a trilha errada."
    - key: descoberta
      label: "Descoberta"
      cadence: descoberta_parada
      goal: "Nível atual, objetivo, prazo, disponibilidade e quem decide junto."
    - key: teste_de_nivel
      label: "Teste de nível"
      cadence: pos_teste
      goal: "O diagnóstico é o produto de entrada deste ramo. Sem ele a proposta chuta a trilha, e aluno em turma errada desiste no primeiro mês."
      phases:
        - { key: agendado,  label: "Teste agendado",      offset_days: 0 }
        - { key: lembrete,  label: "Lembrete véspera",    offset_days: -1 }
        - { key: resultado, label: "Devolver o resultado", offset_days: 1 }
    - key: proposta
      label: "Proposta"
      goal: "Apresentar a trilha inteira: de onde ele parte, onde chega, quantos meses, quanto custa e o que está incluso."
      cadence: pos_proposta
      phases:
        - { key: envio,    label: "Proposta entregue", offset_days: 0 }
        - { key: retorno,  label: "Confirmar leitura", offset_days: 2 }
        - { key: cobranca, label: "Cobrar posição",    offset_days: 7 }
    - key: negociacao
      label: "Negociação"
      cadence: negociacao_travada
      goal: "Isolar o que trava — valor, tempo, medo de não terminar, outra pessoa na decisão — e viabilizar o pagamento."
    # MATRICULADO É `won` E **NÃO** É TERMINAL, de propósito.
    #
    # A conversão deste ramo é a matrícula: é ali que o dinheiro entra e é
    # ali que a métrica canônica tem que contar. Mas etapa terminal desliga
    # o motor (`computeDueTouches` pula terminal), e foi assim que a
    # barbearia ficou sem recompra da carteira fiel — no segmento cuja tese
    # É a recompra. Aqui o erro seria pior: a evasão acontece DEPOIS da
    # matrícula, e é ela que decide se o contrato de 12 meses vira receita
    # de 12 meses ou de 3.
    - key: matriculado
      label: "Matriculado"
      won: true
      cadence: acompanhamento
      goal: "Matriculado e estudando. A evasão avisa antes — falta, atraso e sumiço vêm antes do cancelamento."
      phases:
        - { key: primeira_aula, label: "Primeira aula",        offset_days: 0 }
        - { key: primeira_semana, label: "Primeira semana",    offset_days: 7 }
        - { key: primeiro_mes,  label: "Primeiro mês",         offset_days: 30 }
        - { key: meio_do_curso, label: "Meio do curso",        offset_days: 120 }
    # TRANCADO TAMBÉM NÃO É TERMINAL. Quem trancou é o lead mais barato que
    # existe: já escolheu a escola, já pagou, já conhece o professor.
    # Marcar como final desligaria o motor exatamente em quem vale a pena
    # chamar de volta.
    - key: trancado
      label: "Trancado"
      cadence: retomada
      goal: "Pausou sem cancelar. Chamar de volta com data de retorno e o que já foi cursado preservado."
    - key: concluido
      label: "Concluiu"
      terminal: true
      won: true
      goal: "Terminou. Daqui em diante o jogo é o próximo nível, o certificado e a indicação — que neste ramo é a captação mais barata."
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisao.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SETOR
# NÃO são fatos da empresa — o motor nunca afirma isto ao cliente; só o
# DNA vale. Servem de parâmetro para quem vende entender o terreno.
# ---------------------------------------------------------------------
benchmarks:
  curso_livre_nao_tem_mec: >-
    A pergunta "é reconhecido pelo MEC?" chega em quase toda conversa, e a
    resposta honesta depende do tipo de curso. O MEC reconhece graduação e
    pós-graduação. Curso TÉCNICO de nível médio é autorizado pelo Conselho
    Estadual de Educação e registrado no SISTEC. CURSO LIVRE — idiomas,
    profissionalizante de curta duração, formação inicial e continuada — é
    amparado pela LDB e emite certificado próprio com carga horária, e **não
    tem nem precisa ter** reconhecimento do MEC. Dizer que tem, para vender,
    é propaganda enganosa; e é a mentira que o aluno descobre no primeiro
    concurso ou na primeira entrevista, quando já pagou o curso inteiro.
  promessa_de_emprego_e_a_mais_cara: >-
    Prometer emprego, salário, aprovação ou fluência é a promessa mais comum
    do setor e a que mais vira processo — o equivalente ao "conta zero" do
    solar. Ninguém controla o resultado de outra pessoa. O que se pode
    afirmar é o que a escola faz: carga horária, metodologia, o que o aluno
    sai sabendo fazer, e o resultado verificável de quem já saiu.
  material_didatico_a_parte: >-
    O custo que mais gera briga não é a mensalidade: é o livro, a plataforma
    ou o kit cobrado fora dela. Quando não é dito na venda, o aluno descobre
    na matrícula e a conversa que já estava ganha volta para o começo — agora
    com a confiança arranhada.
  o_nivel_decide_a_trilha: >-
    Sem teste de nível, a proposta chuta o ponto de partida. Aluno colocado
    acima do nível trava e some; colocado abaixo, se entedia e some do mesmo
    jeito. O teste não é burocracia de matrícula: é o que faz a proposta ser
    sobre a pessoa e não sobre a tabela.
  a_evasao_avisa_antes: >-
    Cancelamento é o último passo, não o primeiro. Antes dele vêm falta
    seguida, atraso de pagamento e o aluno que para de responder. Quem só
    age no pedido de cancelamento está sempre chegando depois — e a essa
    altura a decisão já foi tomada e explicada para a família.
  turma_tem_data_de_inicio: >-
    Diferente de academia, aqui a compra tem calendário: a turma começa num
    dia e não recomeça. "Vou ver no próximo semestre" não é um não — é uma
    DATA, e essa data é o ativo mais valioso da conversa. Sumir e voltar no
    mês do início é chegar junto com todos os concorrentes.
  multa_e_trancamento_sao_do_contrato: >-
    Fidelidade, multa de rescisão e regra de trancamento existem e são
    legítimas — desde que estejam no contrato e sejam proporcionais ao que
    falta cumprir. Cobrar o contrato inteiro de quem desistiu no primeiro mês
    é a cláusula que cai na Justiça e que vira avaliação pública. Vender
    dizendo que "não tem multa" quando tem é pior ainda.

# ---------------------------------------------------------------------
# CAMPOS PRÓPRIOS DO SEGMENTO
# ---------------------------------------------------------------------
contact_fields:
  - key: quem_estuda
    label: "Quem vai estudar"
    type: enum
    options: [o_proprio, filho_menor, conjuge_ou_familiar, equipe_da_empresa]
  - key: objetivo
    label: "Para que serve o curso"
    type: enum
    options: [trabalho_ou_promocao, prova_ou_concurso, viagem_ou_intercambio, exigencia_da_empresa, desenvolvimento_pessoal, indefinido]
  - key: nivel_atual
    label: "Nível atual"
    type: enum
    options: [nunca_estudou, basico, intermediario, avancado, a_testar]
  - key: modalidade_preferida
    label: "Modalidade preferida"
    type: enum
    options: [presencial, online_ao_vivo, gravado, hibrido, indiferente]
  - key: prazo
    label: "Para quando"
    type: enum
    options: [urgente, este_semestre, este_ano, sem_data, indefinido]

  # ---------------------------------------------------------------------
  # QUALIFICAÇÃO DE COMPRA (MEDDIC-lite) — item 3 do M3.
  #
  # O M3 escreveu a regra assim: recebe quem tem PROCESSO de compra; B2C de
  # decisão instantânea não recebe, porque barbearia não tem comitê. Curso
  # entra pelos dois lados da regra, e por isso ganha o bloco:
  #   • no B2C não é decisão instantânea — é contrato de 6 a 24 meses, com
  #     financiamento e quase sempre uma segunda pessoa na conversa;
  #   • no in-company é B2B puro, com RH, gestor e verba de treinamento.
  # Chaves e opções são CANÔNICAS (validadas pelo skill-loader): sem isso a
  # dimensão não se compara entre segmentos, que é a única razão de existir.
  # Só o label é do ramo.
  # ---------------------------------------------------------------------
  - key: verba
    label: "Como pretende pagar"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Quem decide junto"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem puxa a decisão em casa ou na empresa"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

# ---------------------------------------------------------------------
# AGENDAMENTO
# O teste de nível tem hora marcada, como a experimental da escola
# esportiva — mas dura menos e muitas vezes é online.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 45
  slot_step_min: 30
  min_advance_min: 120

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# A receita aqui é mensalidade de contrato, não atendimento avulso
# executado e repetido. Ligar isto encheria a tela de um número que não
# significa nada neste ramo.
# ---------------------------------------------------------------------
services:
  enabled: false

# ---------------------------------------------------------------------
# VIGÊNCIA DE CONTRATO
# Liga início/vencimento no cadastro e as TRÊS janelas de renovação
# (`lib/renovacao.ts`): 60 dias falando do RESULTADO — sem mencionar
# renovação —, 30 abrindo a continuidade e 7 com a condição concreta.
# Contato único no vencimento chega quando a pessoa já decidiu, e vira
# negociação de preço sob pressão de prazo.
# ---------------------------------------------------------------------
contract:
  enabled: true
  label: "Matrícula no módulo"
  # A RENOVAÇÃO, NA VOZ DESTE RAMO (ago/2026)
  #
  # Estes textos moravam no NÚCLEO e nasceram com a academia — "pergunte o que
  # ele já conseguiu que não conseguia" é ótimo para um aluno e constrangedor
  # num contrato de fornecimento. Prosa de venda no núcleo é a Lei 1 vazando,
  # e vazando no lugar mais caro: é o texto que a IA recebe como instrução.
  #
  # A ESTRUTURA continua sendo do núcleo — três janelas com ângulos diferentes
  # e o primeiro toque falando de RESULTADO, nunca de renovação. Isso não é
  # opinião de segmento: é o que separa renovar de cobrar.
  renewal:
    vencido:
      titulo: "Matrícula venceu sem contato"
      intencao: "Retome sem cobrança e sem julgamento sobre não ter terminado. Pergunte se ele quer retomar de onde parou e ofereça o caminho concreto que existir no DNA."
    janelas:
      - key: resultado
        dias_antes: 60
        titulo: "Falar do que ele já domina"
        intencao: "NÃO mencione renovação. Pergunte o que ele já consegue fazer com o que aprendeu — usar, ler, conversar, aplicar no trabalho. O ganho concreto é o que sustenta o próximo módulo."
      - key: continuidade
        dias_antes: 30
        titulo: "Abrir o próximo módulo"
        intencao: "Retome o que ele contou que já consegue e mostre o que o próximo módulo destrava. Progressão é o argumento do ramo: quem parou no meio perde o que já pagou."
      - key: condicao
        dias_antes: 7
        titulo: "Fechar turma e condição"
        intencao: "Turma, horário, valor e forma de pagamento, com o que existir no DNA. Se a turma nova tem data de início, ela é o prazo real — e prazo real não é pressão."

lead_sources:
  - whatsapp
  - instagram
  - indicacao
  - presencial
  - site
  - empresa_parceira
  - campanha
  - facebook
  - outro

# ---------------------------------------------------------------------
# POR QUE O ALUNO PAROU
#
# Lista fechada, do MANIFESTO — é o que permite SOMAR. `fora_da_campanha` tira
# da reativação automática, e `abordagem` é o texto que chega em quem redige.
#
# ⚠ AQUI, COMO NA CLÍNICA, **concluir não é perder.** Quem terminou o curso saiu
# da lista porque deu certo — e é justamente ele o melhor candidato ao curso
# seguinte e a maior fonte de indicação. Tratar conclusão como churn faz a
# escola falar com o formado como se ele tivesse desistido.
churn_reasons:
  - key: concluiu
    label: "Concluiu o curso"
    o_que_fazer: "Não é perda, é resultado. A conversa é sobre o PRÓXIMO passo — curso avançado, especialização, certificação — e sobre indicação. Nunca 'você sumiu'."
  - key: trancou_sem_tempo
    label: "Trancou por falta de tempo"
    o_que_fazer: "O que resolve é REDUZIR O TAMANHO DO PEDIDO, não argumentar. Ofereça turma em outro horário, formato gravado, ou retomar de onde parou sem recomeçar. Quem parou por tempo não precisa de mais motivo, precisa de um compromisso menor."
  - key: preco
    label: "Preço ou aperto financeiro"
    o_que_fazer: "É o único motivo em que condição resolve. O caminho é parcelamento ou módulo avulso — e vale perguntar se a empresa dele paga capacitação, que é a resposta mais comum que ninguém pergunta."
  - key: nao_era_o_esperado
    label: "O conteúdo não era o que ele esperava"
    o_que_fazer: "NÃO venda outro curso na mesma conversa. Descubra o que ele esperava — essa frase é material de produto, não objeção. Se existir turma ou trilha que sirva, apresente depois; se não existir, agradeça e anote."
    pausa_dias: 30
    abordagem: "Depois de 30 dias, volte com o que MUDOU, se mudou: material novo, módulo novo, professor novo. Sem novidade concreta, não volte."
  - key: mudou_de_objetivo
    label: "Mudou de área ou de objetivo"
    o_que_fazer: "Pergunte para onde ele foi. Se a escola tem curso naquela direção, é a conversa; se não tem, três respostas iguais são um pedido de curso novo."
  - key: dificuldade
    label: "Achou difícil demais ou ficou para trás"
    o_que_fazer: "Este é o que mais some calado e o que mais volta com ajuda. Ofereça monitoria, turma de base, ou retomar do ponto em que travou. Nunca sugira que faltou esforço."
    pausa_dias: 30
    abordagem: "Depois de 30 dias, procure oferecendo APOIO, não matrícula: 'lembrei de você — se quiser retomar, dá para começar pelo ponto em que você parou, com acompanhamento'."
  - key: pessoal_ou_saude
    label: "Motivo pessoal ou de saúde"
    o_que_fazer: "Não venda. Pergunte quando ele quer ser procurado e marque a data."
    fora_da_campanha: true
    pausa_dias: 60
    abordagem: "Depois de 60 dias, procure para saber dele, sem detalhar o que ele contou e sem falar de matrícula."
  - key: nao_disse
    label: "Não quis dizer"
    o_que_fazer: "Registre assim mesmo: quem não contou é diferente de quem nunca foi perguntado."

dna_sections:
  - key: cursos
    label: "Cursos e turmas"
    required: true
    fields:
      - { key: lista, type: list, required: true, label: "Cursos oferecidos", help: "Quais cursos você oferece. Escreva o nome exato de cada um" }
      - { key: modalidades, type: list, required: true, label: "Modalidades", help: "Como a aula acontece. Ex.: presencial, online ao vivo, gravado, híbrido" }
      - { key: niveis, type: text, required: true, label: "Níveis", help: "Os níveis ou módulos, do começo ao fim. Ex.: básico 1 a 4, intermediário 1 a 4", options: ["Básico, intermediário e avançado", "Módulos numerados, do 1 ao final", "Nível único, sem divisão", "Trilhas por objetivo, não por nível"] }
      - { key: carga_horaria, type: text, required: true, label: "Carga horária", help: "Quantas horas tem cada curso ou módulo", options: ["Até 40 horas", "De 40 a 100 horas", "De 100 a 200 horas", "Mais de 200 horas"] }
      - { key: duracao, type: text, required: true, label: "Duração", help: "Quantos meses leva do começo ao fim, e quantas aulas por semana", options: ["30 minutos", "45 minutos", "1 hora", "Varia por serviço"] }
      - { key: grade_horarios, type: schedule, required: true, label: "Grade de horários", help: "Os horários de cada turma" }
      - { key: proximas_turmas, type: text, required: true, label: "Próximas turmas", help: "Quando começa a próxima turma de cada curso. A data é o que destrava quem adiou", options: ["Turmas novas todo mês", "Turmas em janeiro, maio e agosto", "Turma nova quando fecha o mínimo de alunos", "Entrada contínua, sem data de turma"] }
      - { key: vagas_por_turma, type: text, label: "Vagas por turma", help: "Quantos alunos cabem por turma", options: ["Até 6 alunos", "Até 10 alunos", "Até 15 alunos", "Até 20 alunos", "Varia por turma e horário"] }
  - key: pricing
    label: "Valores e pagamento"
    required: true
    fields:
      - { key: range, type: money_range, required: true, label: "Faixa de valores", help: "A faixa de mensalidade dos seus cursos. Ex.: de R$ 250 a R$ 480" }
      - { key: matricula, type: text, label: "Taxa de matrícula", help: "Tem taxa de matrícula? Quanto?", options: ["Não cobro taxa de matrícula", "Cobro taxa de matrícula, uma vez por ano", "Cobro taxa de matrícula só para aluno novo", "Isento a taxa em campanha de início de turma"] }
      - { key: material_didatico, type: text, required: true, label: "Material didático", help: "O livro, a plataforma ou o kit estão inclusos? Se não, quanto custam? É o custo que mais gera briga quando não é dito na venda", options: ["Incluso na mensalidade", "Cobrado à parte, uma vez", "Plataforma inclusa, livro à parte", "O aluno usa material próprio"] }
      - { key: formas_pagamento, type: list, required: true, label: "Formas de pagamento", help: "Como o aluno pode pagar. Ex.: Pix, boleto mensal, cartão em 12x" }
      - { key: desconto_a_vista, type: text, label: "Desconto à vista", help: "Existe desconto para pagamento do curso inteiro? Qual?", options: ["Desconto para o pagamento do curso inteiro", "Desconto para a matrícula antecipada", "Sem desconto à vista", "Desconto por indicação, não à vista"] }
      - { key: politica_reajuste, type: text, label: "Reajuste", help: "A mensalidade muda durante o curso? Quando e por quê?", options: ["A mensalidade não muda durante o contrato", "Reajuste anual, pelo índice do contrato", "Reajuste na renovação de matrícula", "Depende do curso"] }
  - key: contrato
    label: "Contrato, trancamento e cancelamento"
    required: true
    fields:
      - { key: fidelidade, type: text, required: true, label: "Fidelidade", help: "O contrato prende por quantos meses? Escreva 'não tem' se não houver", options: ["Não tem fidelidade", "Contrato pelo período do curso", "Contrato de 6 meses", "Contrato de 12 meses"] }
      - { key: multa_rescisao, type: text, required: true, label: "Multa de rescisão", help: "Quanto o aluno paga se desistir no meio. Escreva exatamente como está no contrato", options: ["Não cobro multa", "Multa proporcional ao que falta do contrato", "Aviso prévio de 30 dias, sem multa", "Conforme está escrito no contrato"] }
      - { key: politica_trancamento, type: text, required: true, label: "Trancamento", help: "Pode trancar? Por quanto tempo, quantas vezes e o que acontece com o que já foi cursado", options: ["Permito trancar uma vez, por tempo determinado", "Permito trancar, e o crédito fica guardado", "Permito só por motivo de saúde ou mudança", "Não permito trancamento"] }
      - { key: transferencia_turma, type: text, label: "Troca de turma", help: "O aluno pode trocar de horário ou de turma no meio? Como", options: ["Pode trocar de turma se houver vaga", "Pode trocar uma vez por semestre", "Pode trocar mediante disponibilidade e aviso", "Não permito troca no meio do módulo"] }
      - { key: aproveitamento, type: text, label: "Aproveitamento de estudos", help: "Quem já estudou antes pode pular módulo? Como isso é avaliado", options: ["Faço teste de nível e o aluno entra onde é o lugar dele", "Aceito comprovante de curso anterior", "Avalio caso a caso, com entrevista", "Todo aluno começa do início"] }
  - key: certificacao
    label: "Certificado e reconhecimento"
    required: true
    fields:
