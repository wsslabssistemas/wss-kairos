  risk_free_entry:    "Teste de nível e aula demonstrativa"
  availability:       "Grade, próximas turmas e entrar em turma já começada"
  expertise_proof:    "Professores, metodologia e resultado de quem já saiu"
  catalog:            "Cursos, níveis, carga horária e modalidades"
  goal_matching:      "Objetivo e nível atual → a trilha certa"
  objections:         "Caro, sem tempo, online não funciona, já tentei antes"
  commitment_offer:   "Contrato, fidelidade, multa e desconto à vista"
  reciprocity:        "Material, aula extra ou matrícula cortesia"
  limits_and_ethics:  "Certificação, reconhecimento e o que NÃO se pode prometer"
  retention:          "Aluno faltando, trancamento, evasão e o próximo nível"
  ecosystem:          "Turma in-company, empresas parceiras e intercâmbio"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento.
#
# `pricing` aqui é `consultiva_spin` e NÃO `oferta_valor` como na academia,
# pelo mesmo motivo que separou salão de barbearia: o preço do curso não é
# um número, é uma TRILHA. Depende de quantos módulos faltam para o
# objetivo dele, e isso só se sabe depois do teste de nível. Cotar por
# mensagem é vender a trilha errada e criar o cancelamento do segundo mês.
#
# `commitment_offer` é `indecisao_jolt` e não `fechamento_classico`: quem
# adia matrícula quase nunca discorda do curso — ele tem medo de não
# terminar, e repetir o argumento para quem já concordou é o movimento que
# o JOLT mede como piora do desfecho.
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    indecisao_jolt
  reciprocity:         relacionamento_carnegie
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica — a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # A régua abaixo é deste ramo: o OBJETIVO escolhe a trilha, e o medo real é
  # 'não vou terminar' — não é preço.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 2, intent: "Perguntar para quem é e para quê, uma coisa só. Sem o objetivo, qualquer preço vende a trilha errada." }
      - { offset_days: 6, intent: "Oferecer o teste de nível ou a aula aberta: descobrir onde ele está resolve a qualificação e a objeção juntas." }
      - { offset_days: 12, intent: "Encerrar com porta aberta para a próxima turma." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: descoberta_parada
    applies_to: qualification
    steps:
      - { offset_days: 2, intent: "Confirmar só prazo e disponibilidade semanal — é o que decide formato, e é onde a maioria trava." }
      - { offset_days: 6, intent: "Apresentar duas trilhas concretas para o objetivo dele, em vez de repetir a pergunta." }
      - { offset_days: 12, intent: "Oferecer a aula aberta como caminho de menor esforço e encerrar a qualificação." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 2, intent: "Nomear o que ele levantou e responder com o fato que falta — carga horária, certificado, política de trancamento." }
      - { offset_days: 6, intent: "Tratar o medo que ninguém escreve: começar e não terminar. É a objeção real da maioria dos cursos." }
      - { offset_days: 12, intent: "Oferecer a menor entrada que existir no DNA; se não existir, ESCALAR em vez de inventar desconto." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: pos_teste
    applies_to: trial_followup
    steps:
      - { offset_days: 1, intent: "Devolver o resultado do teste e o que ele significa" }
      - { offset_days: 3, intent: "Apresentar a trilha e a turma que serve ao horário dele" }
      - { offset_days: 7, intent: "Última chamada com a data de início da turma" }
    stop_on: [converted, opted_out, lost]

  - key: pos_proposta
    applies_to: proposal_followup
    steps:
      - { offset_days: 2, intent: "Confirmar que chegou e tirar a dúvida da trilha" }
      - { offset_days: 5, intent: "Tratar a condição de pagamento" }
      - { offset_days: 10, intent: "Perguntar o que falta para começar — e aceitar o não" }
    stop_on: [converted, opted_out, lost]

  # A CADÊNCIA QUE PROTEGE A RECEITA JÁ VENDIDA.
  # Contrato de 12 meses só vale 12 meses se o aluno chegar lá. Os toques
  # são de acompanhamento, nunca de cobrança — cobrar quem está faltando
  # acelera o cancelamento em vez de evitá-lo.
  - key: acompanhamento
    applies_to: onboarding
    steps:
      - { offset_days: 7, intent: "Como foi a primeira semana. Uma pergunta, sobre a aula" }
      - { offset_days: 30, intent: "Primeiro mês: o que já consegue fazer que não conseguia" }
      - { offset_days: 120, intent: "Meio do caminho: reconhecer o avanço e projetar o fim" }
    stop_on: [opted_out, lost]

  - key: retomada
    applies_to: reactivation
    steps:
      - { offset_days: 30, intent: "Chamar de volta com a data da próxima turma e o que já foi cursado" }
      - { offset_days: 90, intent: "Novo ciclo de turmas: oferecer o retorno no nível onde parou" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

hard_rules:
  - "Nunca prometer emprego, salário, aprovação ou fluência. Nem como certeza, nem como quase certeza."
  - "Nunca dizer que o curso é reconhecido pelo MEC sem o campo de certificação afirmar isso. Curso livre não tem nem precisa ter reconhecimento do MEC, e dizer que tem é propaganda enganosa."
  - "Nunca afirmar carga horária, duração, nível ou data de início de turma que não esteja no DNA."
  - "Nunca omitir o custo do material didático quando ele é cobrado à parte."
  - "Nunca afirmar multa, fidelidade ou regra de trancamento diferente do que está no contrato registrado no DNA."
  - "Não prometer vaga em turma cheia nem abertura de turma que não está confirmada."

kpis:
  - taxa_conversao
  - testes_de_nivel_agendados
  - comparecimento_teste
  - tempo_resposta_mediana
  - evasao
