      - { key: casos, type: text, label: "Casos de alunos", help: "O que alunos concretos conseguiram, com autorização deles. Isto substitui a promessa de emprego, que é proibida", options: ["Tenho depoimentos de alunos, com autorização", "Tenho casos de alunos que conseguiram emprego na área", "Tenho aprovações verificáveis", "Ainda não tenho casos documentados"] }
      - { key: aprovacoes, type: text, label: "Aprovações", help: "Se é preparatório: aprovações verificáveis, com prova e ano", options: ["Tenho aprovações verificáveis, com prova e ano", "Tenho, mas não organizadas para mostrar", "Não sou preparatório", "Ainda não tenho aprovações"] }
      - { key: parcerias_empresas, type: list, label: "Empresas parceiras", help: "Empresas que contratam ou enviam alunos" }
