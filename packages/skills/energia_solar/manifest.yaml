key: energia_solar
name: Energia Solar Fotovoltaica
version: 1.0.0

# =====================================================================
# O 9º segmento. Nasceu de uma pergunta do fundador — "o sistema atende
# vendedor de painel solar?" — e da resposta honesta: `sob_medida` dizia
# "solar" no nome e NENHUMA das suas entradas falava de solar.
#
# POR QUE MERECE SKILL PRÓPRIA, e não um remendo em `sob_medida`:
# o DNA é outro. Solar exige conta de luz, payback, financiamento e
# homologação na concessionária — campos que não existem para quem faz
# armário, e que poluiriam aquele manifesto.
#
# O QUE ESTE MERCADO TEM DE ÚNICO (pesquisa ago/2026):
#   • A CONTA DE LUZ É O DADO DE ENTRADA. Sem ela não há dimensionamento,
#     não há geração estimada e não há payback. Cotar sem a conta é chute.
#   • O CLIENTE NUNCA ZERA A CONTA. O custo de disponibilidade continua:
#     30 kWh monofásico, 50 kWh bifásico, 100 kWh trifásico. "Conta zero"
#     é a promessa mais comum e mais perigosa do setor.
#   • ENTRE INSTALAR E ECONOMIZAR EXISTEM 40 A 100 DIAS. Projeto, vistoria,
#     troca do medidor e homologação (REN 1.059/2023: a distribuidora tem
#     30 dias para o projeto e 7 dias úteis para a vistoria). O prazo é da
#     concessionária, não do instalador — e o cliente não sabe disso.
#   • O RELÓGIO REGULATÓRIO CORRE CONTRA A ESPERA. O Fio B é progressivo:
#     45% em 2025, 60% em 2026, 75% em 2027, 90% em 2028. Quem tem sistema
#     homologado até 06/01/2023 tem direito adquirido até 2045 — para todo
#     o resto, adiar custa mais caro a cada ano. É urgência REAL, não
#     inventada: por isso pode ser usada.
#   • O INVERSOR NÃO DURA O QUE O PAINEL DURA. Módulo tem garantia de
#     desempenho de ~25 anos (80% da capacidade); inversor, 5 a 10 anos.
#     Quem esconde isso perde a indicação lá na frente.
#
# Nenhuma linha do núcleo muda por causa deste arquivo. É a Lei 1.
# =====================================================================

capabilities:
  - prospeccao
  - licitacoes

vocabulary:
  lead: "interessado"
  conversion: "projeto fechado"
  churn: "orçamento perdido"
  catalog_item: "sistema"

discovery_axis: "consumo e conta de luz (quanto paga por mês, qual o padrão de ligação, o que quer resolver e para quando)"

# ---------------------------------------------------------------------
# JORNADA — ticket alto, decisão cara e irreversível, ciclo longo.
#
# `em_execucao` existe porque é ali que a reputação se ganha ou se perde:
# o cliente assinou, pagou e vai esperar semanas pela homologação sem
# entender por quê. Etapa não-terminal de propósito — é trabalho em
# aberto, com cadência própria.
# ---------------------------------------------------------------------
journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Entender o que motivou a busca. Nunca dar preço por kWp sem ver a conta."
    - key: qualificacao
      label: "Qualificação"
      cadence: pedir_conta
      goal: "Conseguir a conta de luz e entender padrão de ligação, telhado e prazo. Sem a conta não há proposta."
      phases:
        - { key: pedido,   label: "Pedir a conta de luz", offset_days: 0 }
        - { key: cobranca, label: "Cobrar a conta",       offset_days: 2 }
    - key: visita_tecnica
      label: "Visita técnica"
      cadence: pre_visita
      goal: "Conferir telhado, padrão de entrada e sombreamento. É na visita que o orçamento vira projeto."
      phases:
        - { key: agendada,  label: "Visita agendada",   offset_days: 0 }
        - { key: confirmar, label: "Confirmar véspera",  offset_days: -1 }
        - { key: realizada, label: "Visita realizada",   offset_days: 1 }
    - key: proposta
      label: "Proposta e simulação"
      cadence: pos_proposta
      goal: "Apresentar dimensionamento, geração estimada, economia e payback. Apresentar, não só enviar."
      phases:
        - { key: envio,    label: "Proposta entregue", offset_days: 0 }
        - { key: retorno,  label: "Confirmar leitura", offset_days: 2 }
        - { key: cobranca, label: "Cobrar posição",    offset_days: 7 }
    - key: negociacao
      label: "Negociação e pagamento"
      cadence: negociacao_travada
      goal: "Isolar o que trava (valor, financiamento, telhado, cônjuge) e viabilizar o pagamento."
    # A ORDEM MUDOU POR CORREÇÃO DE ESPECIALISTA (ago/2026, integrador do RS).
    # Antes: fecha → compra o kit → instala → homologa. O especialista
    # inverteu na prática dele e explicou por quê: a concessionária pode
    # LIMITAR a potência ou exigir subestação por causa do fluxo de inversão
    # na rede. Quem comprou antes fica com material errado e dinheiro parado.
    # "Hoje eu sempre homologo o projeto primeiro, e depois o cliente compra
    # os materiais." Isso protege o cliente e protege o integrador.
    - key: homologacao
      label: "Projeto em homologação"
      cadence: pos_venda
      goal: "Aprovar o projeto na concessionária ANTES de o cliente comprar o kit. É aqui que aparece limitação de potência ou exigência de subestação."
      phases:
        - { key: protocolado, label: "Projeto protocolado",   offset_days: 0 }
        - { key: acompanhar,  label: "Acompanhar a análise",  offset_days: 10 }
        - { key: aprovado,    label: "Parecer de acesso",     offset_days: 30 }
    - key: em_execucao
      label: "Em execução"
      cadence: pos_venda
      goal: "Kit comprado, instalação e vistoria. Manter o cliente informado durante a espera da concessionária."
      phases:
        - { key: kit,        label: "Kit a caminho",            offset_days: 0 }
        - { key: instalado,  label: "Instalado",                offset_days: 14 }
        - { key: vistoria,   label: "Vistoria solicitada",      offset_days: 16 }
        - { key: monitor,    label: "Ativar o monitoramento",   offset_days: 21 }
    - key: fechado
      label: "Gerando"
      terminal: true
      won: true
      goal: "Homologado, gerando e com o monitoramento ativo no app do cliente. Daqui em diante o jogo é manutenção, ampliação e indicação."
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisão.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SETOR (pesquisa ago/2026)
# NÃO são fatos da empresa — o motor nunca afirma isto ao cliente; só o
# DNA vale. Servem de parâmetro para quem vende entender o terreno.
# ---------------------------------------------------------------------
benchmarks:
  custo_de_disponibilidade: >-
    Mesmo gerando tudo o que consome, o cliente continua pagando a taxa mínima
    da distribuidora: 30 kWh (monofásico), 50 kWh (bifásico) ou 100 kWh
    (trifásico). Prometer "conta zero" é criar uma reclamação para daqui a
    dois meses.
  fio_b_progressivo: >-
    Cobrança sobre a energia injetada, subindo por ano: 45% em 2025, 60% em
    2026, 75% em 2027, 90% em 2028. Quem homologou até 06/01/2023 tem direito
    adquirido até 2045. Para os demais, adiar a decisão custa mais caro a cada
    ano — urgência real, que não precisa ser inventada.
  prazo_de_homologacao: >-
    Entre a instalação e a economia existe a concessionária: a REN 1.059/2023
    dá 30 dias para aprovar o projeto e 7 dias úteis para a vistoria. Na
    prática o processo inteiro leva de 40 a 100 dias, conforme a distribuidora.
    O prazo não é do instalador, mas a ansiedade é do cliente.
  creditos_60_meses: >-
    O excedente vira crédito válido por 60 meses. Sistema superdimensionado
    gera crédito que expira sem uso — vender maior do que precisa é prejuízo
    disfarçado de venda maior.
  garantias_desiguais: >-
    Módulo: garantia de desempenho de cerca de 25 anos (aproximadamente 80% da
    capacidade ao fim) e de produto entre 10 e 12 anos. Inversor: 5 a 10 anos,
    com extensão paga. Quem apresenta "25 anos de garantia" sem separar as duas
    coisas está criando o próprio problema.
  onda_do_hibrido: >-
    Retorno de especialista do ramo (ago/2026): o on-grid convencional virou
    commodity — todo mundo conhece, o equipamento é padronizado e a comparação
    é só por preço, o que derreteu a margem do integrador. O híbrido com
    bateria (BESS) é onde poucos têm conhecimento técnico e onde há margem.
    A lógica econômica sustenta: com o Fio B subindo todo ano, a energia
    INJETADA na rede vale menos a cada ano, enquanto a energia ARMAZENADA e
    consumida direto não paga esse pedágio. O mercado está migrando de "gerar
    e injetar" para "gerar, guardar e usar".
  rede_saturada: >-
    Em várias regiões a concessionária limita ou nega a conexão de novos
    sistemas por saturação da rede local. Para esse cliente o híbrido não é
    upgrade: é a única forma de fazer o projeto sair. Perguntar sobre restrição
    de rede na qualificação evita desenhar um projeto que não vai ser aprovado.
  o_que_entra_no_orcamento: >-
    Módulos, inversor, estrutura conforme o telhado, string box e proteções
    (DPS CC e CA, disjuntores, aterramento), cabeamento, projeto elétrico com
    ART, mão de obra e homologação. Orçamento que não diz o que inclui é o que
    perde para o "mais barato" que não inclui nada.

# ---------------------------------------------------------------------
# CAMPOS PRÓPRIOS DO SEGMENTO
# ---------------------------------------------------------------------
contact_fields:
  - key: tipo_imovel
    label: "Tipo de imóvel"
    type: enum
    options: [residencia, comercio, industria, rural, condominio, orgao_publico, outro]
  # Define o custo de disponibilidade que o cliente vai continuar pagando.
  - key: padrao_ligacao
    label: "Padrão de ligação"
    type: enum
    options: [monofasico, bifasico, trifasico, nao_sei]
  - key: faixa_conta
    label: "Conta de luz por mês"
    type: enum
    options: [ate_200, de_200_a_500, de_500_a_1000, de_1000_a_3000, acima_3000, nao_informado]
  # Muda a estrutura de fixação, o prazo e o custo da instalação.
  - key: tipo_telhado
    label: "Telhado"
    type: enum
    options: [ceramico, metalico, fibrocimento, laje, solo, sem_area_disponivel, nao_sei]
  - key: forma_pagamento
    label: "Como pretende pagar"
    type: enum
    options: [a_vista, financiamento, consorcio, cartao, nao_sei]
  - key: gatilho
    label: "O que motivou"
    type: enum
    options:
      [conta_alta, obra_nova, ampliacao, sustentabilidade, valorizacao_imovel,
       queda_de_energia, backup_bateria, indicacao, outro]
  # A rede saturada virou qualificador: em várias regiões a concessionária
  # limita ou nega a conexão de novos sistemas, e aí o híbrido deixa de ser
  # upgrade e passa a ser a única saída.
  - key: situacao_rede
    label: "Situação da rede"
    type: enum
    options: [sem_restricao, limitado_pela_concessionaria, negado, nao_sei]
  # Alimenta o motor de recompra: limpeza e revisão têm data.
  - key: ciclo_manutencao
    label: "Ciclo de manutenção"
    type: enum
    options: [semestral, anual, sem_contrato, indefinido]

  # ---------------------------------------------------------------------
  # QUALIFICACAO DE COMPRA (MEDDIC-lite) - item 3 do M3.
  # As quatro perguntas que dizem se o negocio existe de verdade. O campo
  # `decisor` diz QUEM e o contato; estes dizem como a compra anda.
  # Chaves e opcoes sao CANONICAS (validadas pelo skill-loader): sem isso a
  # dimensao não se compara entre segmentos, que e a unica razao de existir.
  # Só o label e do ramo.
  # ---------------------------------------------------------------------
  - key: verba
    label: "Como pretende pagar"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Quem decide junto"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem puxa a decisão"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

# ---------------------------------------------------------------------
# O sistema instalado não é o fim: limpeza e revisão têm data, e cliente
# com sistema sujo gera menos e reclama do fornecedor, não da poeira.
# ---------------------------------------------------------------------
recurrence:
  # O QUE DIZER NO TOQUE DE RECOMPRA, na voz deste ramo. Estava no núcleo,
  # servindo igual para o corte de 21 dias e para a reposição de estoque —
  # hábito pessoal de um lado, ruptura de prateleira do outro.
  intent: "Está no ponto da limpeza e checagem anual dos módulos. Fale de geração, não de venda: painel sujo perde rendimento e o cliente só descobre pela conta de luz."
  frequency_field: ciclo_manutencao
  remind_before_days: 15
  intervals_days:
    semestral: 180
    anual: 365
  default_days: 365

# ---------------------------------------------------------------------
# A visita técnica tem hora marcada e consome meio período de um técnico.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 90
  slot_step_min: 60
  min_advance_min: 240

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Aqui o dinheiro é acompanhado por proposta e projeto, não por atendimento.
# ---------------------------------------------------------------------
services:
  enabled: false

lead_sources:
  - indicacao
  - site
  - whatsapp
  - instagram
  - prospeccao
  - licitacao
  - feira
  - parceiro_construtor
  - cliente_antigo
  - facebook
  - campanha
  - outro

# ---------------------------------------------------------------------
# SEÇÕES DE DNA — os fatos que o motor pode afirmar sobre a empresa.
# As CHAVES são contrato com `required_facts`. Traduza label e help,
# nunca a chave.
# ---------------------------------------------------------------------
dna_sections:
  - key: oferta
    label: "O que você instala"
    required: true
    fields:
      - { key: tipos_sistema, type: list, required: true, label: "Tipos de sistema", help: "Ex.: conectado à rede (on-grid), híbrido com bateria, bombeamento rural" }
      - { key: marcas_modulo, type: list, label: "Marcas de módulo", help: "As marcas de painel que você trabalha" }
      - { key: marcas_inversor, type: list, label: "Marcas de inversor", help: "As marcas de inversor que você trabalha" }
      # Híbrido com bateria (BESS) — ver benchmark `onda_do_hibrido`.
      - { key: marcas_bateria, type: list, label: "Marcas de bateria", help: "Se você trabalha com sistema híbrido, quais baterias" }
      - { key: autonomia_backup, type: text, label: "Autonomia do backup", help: "Quanto tempo o sistema com bateria sustenta, e o que ele alimenta. Ex.: 6h nas cargas essenciais", options: ["Não trabalho com bateria", "Até 4h nas cargas essenciais", "4 a 8h nas cargas essenciais", "8 a 12h nas cargas essenciais", "Dimensiono caso a caso"] }
      - { key: telhados_atendidos, type: list, required: true, label: "Telhados que atende", help: "Ex.: cerâmico, metálico, fibrocimento, laje, solo" }
  - key: precos
    label: "Preço e pagamento"
    required: true
    fields:
      - { key: como_cobra, type: text, required: true, label: "Como você cobra", help: "Ex.: projeto fechado por kWp instalado, definido após a análise da conta", options: ["Projeto fechado, por kWp instalado", "Projeto fechado, valor único", "Por etapa (projeto, material, instalação)", "Material e mão de obra separados"] }
      - { key: faixa, type: money_range, label: "Faixa de investimento", help: "A faixa dos projetos que você costuma fazer. Ex.: de R$ 15 mil a R$ 90 mil" }
      - { key: formas_pagamento, type: list, required: true, label: "Formas de pagamento", help: "Ex.: Pix, cartão em 12x, financiamento bancário" }
      - { key: financiamento, type: text, label: "Financiamento", help: "Com quais bancos ou linhas você trabalha e como funciona a aprovação", options: ["Não trabalho com financiamento", "Banco parceiro, eu encaminho", "Várias linhas, comparo para o cliente", "O cliente busca por conta", "Cartão ou parcelamento próprio"] }
      - { key: o_que_inclui, type: text, required: true, label: "O que está incluso", help: "Ex.: kit, estrutura, proteções, projeto com ART, mão de obra e homologação", options: ["Kit, estrutura, proteções, projeto com ART, mão de obra e homologação", "Kit e instalação; projeto e homologação cobrados à parte", "Projeto fechado, incluindo tudo até o sistema gerando", "Varia conforme o porte do projeto"] }
  - key: execucao
    label: "Prazos e execução"
    required: true
    fields:
      - { key: prazo_visita, type: text, required: true, label: "Prazo da visita técnica", help: "Em quanto tempo você vai até o local", options: ["No mesmo dia", "Em até 2 dias", "Em até 3 dias", "Em até 1 semana", "Depende da distância"] }
      - { key: prazo_proposta, type: text, required: true, label: "Prazo da proposta", help: "Quanto tempo até entregar a proposta com simulação", options: ["No mesmo dia", "Em até 2 dias", "Em até 3 dias", "Em até 1 semana", "Depende da complexidade"] }
      - { key: prazo_instalacao, type: text, required: true, label: "Prazo da instalação", help: "Da aprovação até o sistema montado. Ex.: 2 a 5 dias no telhado", options: ["1 dia", "2 a 3 dias", "3 a 5 dias", "1 semana", "Mais de 1 semana", "Depende do porte"] }
      - { key: prazo_homologacao, type: text, required: true, label: "Prazo de homologação", help: "Quanto costuma levar na SUA concessionária — é o prazo dela, não o seu", options: ["Até 30 dias", "30 a 60 dias", "60 a 90 dias", "Mais de 90 dias", "Varia muito na minha concessionária"] }
      # Campos abertos por correção de especialista (ago/2026). Ele quebrou o
      # "prazo de homologação" em três relógios que o cliente sente separados,
      # e que o vendedor precisa saber de cor para não prometer errado.
      - { key: prazo_analise_projeto, type: text, required: true, label: "Prazo da análise do projeto", help: "Da protocolação ao parecer de acesso. Costuma ser de 10 a 30 dias", options: ["Até 10 dias", "10 a 20 dias", "20 a 30 dias", "Mais de 30 dias"] }
      - { key: prazo_vistoria, type: text, required: true, label: "Prazo da vistoria", help: "Depois de solicitada. O limite regulatório é de 5 dias úteis", options: ["Até 5 dias úteis", "5 a 10 dias", "10 a 15 dias", "Mais de 15 dias"] }
      - { key: prazo_kit, type: text, required: true, label: "Prazo de entrega do kit", help: "Do pedido ao material na obra. Costuma ser de 10 a 20 dias", options: ["Até 10 dias", "10 a 15 dias", "15 a 20 dias", "20 a 30 dias", "Depende do fornecedor"] }
      - { key: limite_fast_track, type: text, label: "Limite de aprovação simplificada", help: "Até que potência a concessionária aprova sem análise de fluxo. Ex.: até 7,5 kW em consumo local", options: ["Até 7,5 kW em consumo local", "Até 10 kW em consumo local", "Até 15 kW em consumo local", "Depende da concessionária da região"] }
      - { key: homologa_antes, type: boolean, label: "Você homologa antes de o cliente comprar o kit?", help: "Protege o cliente de comprar material que a concessionária pode limitar" }
      - { key: distribuidoras, type: list, label: "Concessionárias que você homologa", help: "Ex.: RGE, CEEE Equatorial, CPFL" }
  - key: garantias
    label: "Garantias"
    required: true
    fields:
      - { key: modulo, type: text, required: true, label: "Garantia do módulo", help: "Separe desempenho e produto. Ex.: 25 anos de desempenho, 12 de produto", options: ["25 anos de desempenho, 12 de produto", "25 anos de desempenho, 10 de produto", "30 anos de desempenho, 15 de produto", "Varia por fabricante"] }
      - { key: inversor, type: text, required: true, label: "Garantia do inversor", help: "Ex.: 10 anos, com extensão opcional", options: ["5 anos", "7 anos", "10 anos", "12 anos", "10 anos com extensão opcional", "Varia por fabricante"] }
      - { key: instalacao, type: text, required: true, label: "Garantia da instalação", help: "A sua garantia de mão de obra e de estanqueidade do telhado", options: ["1 ano de mão de obra e estanqueidade do telhado", "2 anos de mão de obra e estanqueidade", "5 anos de mão de obra e estrutura", "Garantia de mão de obra enquanto durar a do inversor"] }
      - { key: seguro, type: text, label: "Seguro", help: "Se oferece seguro do sistema e o que ele cobre", options: ["Não ofereço seguro", "Ofereço seguro opcional do sistema", "Seguro incluso no primeiro ano", "Indico corretora parceira"] }
  - key: pos_venda
    label: "Depois da instalação"
    fields:
      - { key: monitoramento, type: text, label: "Monitoramento", help: "Qual app, quem configura e quem avisa se a geração cair. Ativar e ensinar o app faz parte da entrega, não é extra", options: ["Aplicativo do inversor, configurado na entrega", "Aplicativo do inversor e acompanhamento no primeiro mês", "Monitoramento contínuo, com aviso se a geração cair", "Sem monitoramento incluso"] }
      - { key: manutencao, type: text, label: "Limpeza e revisão", help: "Frequência, o que inclui e quanto custa. Mínimo de uma limpeza por ano, mais reaperto de estrutura, disjuntores e proteções", options: ["Uma limpeza por ano, cobrada à parte", "Duas limpezas por ano, cobradas à parte", "Primeira limpeza inclusa, as demais à parte", "Contrato anual de limpeza e revisão"] }
      - { key: ampliacao, type: text, label: "Ampliação", help: "Como funciona aumentar o sistema depois", options: ["Projeto o sistema já pensando em ampliação futura", "Ampliação exige novo projeto e nova homologação", "Ampliação possível dentro do limite do inversor", "Avalio caso a caso"] }
  - key: atuacao
    label: "Onde você atende"
    required: true
    fields:
