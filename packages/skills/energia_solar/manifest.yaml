cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica - a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # REGUA LONGA, DE PROPÓSITO. Rackham mediu: em ticket alto, pressão DERRUBA
  # conversão. Cada toque precisa trazer informação nova, e o intervalo
  # respeita que do outro lado existe processo interno, não humor.
  # Deste ramo: a CONTA DE LUZ e o que qualifica; sem ela não
  # existe dimensionamento nem retorno, e número por kWp e chute.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 2, intent: "Pedir a foto da conta de luz - uma coisa só. E o que substitui dez perguntas e o único jeito de o número sair certo." }
      - { offset_days: 6, intent: "Explicar o que a conta revela e por que o preço por kWp da internet não se aplica ao telhado dele." }
      - { offset_days: 14, intent: "Encerrar com porta aberta. Decisão de solar leva meses e quem pressiona sai da lista." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 3, intent: "Nomear o que trava e trazer o fato que falta - payback com a conta dele, garantia, ou o que acontece se ele mudar de casa." }
      - { offset_days: 8, intent: "Checar se e valor ou financiamento. São coisas diferentes: uma se resolve com condição, a outra com banco." }
      - { offset_days: 16, intent: "Perguntar se falta alguém na decisão - cônjuge decide junto em residencial e e a objeção que nunca e dita." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: pedir_conta
    applies_to: qualification
    steps:
      - { offset_days: 2, intent: "Cobrar a conta de luz — sem ela não existe proposta, só chute" }
      - { offset_days: 5, intent: "Oferecer buscar o consumo no aplicativo da concessionária junto com o cliente" }
    stop_on: [replied, converted, opted_out, lost]

  - key: pre_visita
    applies_to: appointment_confirm
    steps:
      - { offset_days: -1, intent: "Confirmar a visita e pedir acesso ao telhado e ao padrão de entrada" }
    stop_on: [converted, opted_out]

  - key: pos_proposta
    applies_to: proposal_followup
    steps:
      - { offset_days: 2, intent: "Confirmar que abriu a proposta e tirar dúvida da simulação" }
      - { offset_days: 7, intent: "Trazer ângulo novo: opção de financiamento ou escopo menor" }
      - { offset_days: 15, intent: "Perguntar o que decidiu — inclusive se foi não" }
    stop_on: [replied, converted, opted_out, lost]

  - key: pos_venda
    applies_to: onboarding
    steps:
      - { offset_days: 3, intent: "Avisar que o projeto entrou na concessionária e explicar o prazo dela" }
      - { offset_days: 20, intent: "Dar posição da homologação antes de o cliente perguntar" }
      - { offset_days: 45, intent: "Confirmar a troca do medidor e ensinar a ler a primeira conta" }
    stop_on: [opted_out]

  - key: reativacao
    applies_to: reactivation
    steps:
      - { offset_days: 0, intent: "Retomar com o que mudou: tarifa, Fio B do ano ou condição de pagamento" }
      - { offset_days: 30, intent: "Última tentativa, com porta aberta e sem cobrança" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

hard_rules:
  - "NUNCA prometer conta zerada: o custo de disponibilidade continua sendo cobrado (30, 50 ou 100 kWh conforme o padrão de ligação)."
  - "Nunca afirmar geração, economia ou payback sem a conta de luz e sem o dimensionamento feito."
  - "O prazo de homologação é da concessionária. Informar como estimativa, nunca como compromisso da empresa."
  - "Separar sempre garantia de desempenho do módulo, garantia de produto e garantia do inversor — nunca dizer '25 anos de garantia' sem qualificar."
  - "Não afirmar marca, certificação, seguro ou financiamento que não esteja no DNA."
  # Regras acrescentadas pela revisão do especialista (ago/2026):
  - "NÃO orientar a compra do kit antes do parecer de acesso. A concessionária pode limitar a potência ou exigir subestação por causa do fluxo de inversão na rede — e o cliente fica com material errado e dinheiro parado."
  - "Dimensionar pela MÉDIA de 12 meses da fatura, nunca por um mês isolado: gera-se mais no verão para abastecer o inverno."
  - "Verificar o padrão de entrada de energia antes de prometer potência. É ele que limita quanto o imóvel suporta gerar."
  - "Não prometer prazo de análise da concessionária como se fosse seu. É de 10 a 30 dias e não depende do integrador."

