key: clinica
name: Clínica, Odontologia e Estética
version: 1.0.0

# =====================================================================
# O segmento de MAIOR TICKET e MAIOR LACUNA comercial do país.
#
# Diagnóstico (pesquisa jul/2026): o profissional de saúde vê "vender" com
# preconceito, então deixa a comercialização de tratamentos de alto valor
# na mão da recepção, sem preparo. A recepção age de forma reativa: informa
# preço por mensagem e agenda, sem qualificar. Resultado: baixa conversão de
# ORÇAMENTO em TRATAMENTO e ausência de plano de manutenção (LTV).
#
# Consequência para este manifesto: a jornada NÃO termina na consulta —
# termina no tratamento aprovado e depois na manutenção. E a etapa crítica
# é a AVALIAÇÃO, onde o plano é apresentado.
#
# ATENÇÃO ÉTICA: saúde tem limite legal de publicidade e é proibido
# prometer resultado. Isso está em hard_rules e é inegociável.
# =====================================================================

capabilities: []   # B2C: prospecção fria de pessoas é proibida (LGPD)

vocabulary:
  lead: "paciente em potencial"
  conversion: "tratamento aprovado"
  churn: "paciente que abandonou o tratamento"
  catalog_item: "procedimento"

discovery_axis: "queixa principal e o que ela impede na vida da pessoa (dor, estética, função, autoestima)"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Acolher a queixa e qualificar antes de falar preço."
    - key: qualificacao
      label: "Qualificação"
      cadence: descoberta_parada
      goal: "Entender a queixa, histórico, urgência e quem decide/paga."
    - key: avaliacao
      label: "Avaliação agendada"
      goal: "Levar a pessoa até a cadeira. É aqui que o tratamento se vende."
      cadence: pre_consulta
      phases:
        - { key: confirmacao, label: "Confirmar presença", offset_days: -1 }
        - { key: comparecimento, label: "Dia da avaliação", offset_days: 0 }
    - key: plano_apresentado
      label: "Plano apresentado"
      goal: "Plano de tratamento entregue com valor e condições. Não deixar esfriar."
      cadence: pos_orcamento
      phases:
        - { key: envio,   label: "Plano entregue",   offset_days: 0 }
        - { key: duvidas, label: "Tirar dúvidas",    offset_days: 2 }
        - { key: decisao, label: "Buscar decisão",   offset_days: 7 }
    - key: negociacao
      label: "Negociação"
      cadence: negociacao_travada
      goal: "Tratar a objeção real (valor, medo, tempo) e viabilizar o pagamento."
    - key: em_tratamento
      label: "Em tratamento"
      cadence: adesao_tratamento
      goal: "Garantir adesão e comparecimento até concluir."
    - key: concluido
      label: "Tratamento aprovado"
      terminal: true
      won: true
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # a de silêncio é `lost` e alcançável; a de recusa é terminal.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

contact_fields:
  - key: queixa
    label: "Queixa principal"
    type: enum
    options:
      [dor, estetica, funcional, prevencao, urgencia, reabilitacao,
       acompanhamento, outro]
  - key: procedimento_interesse
    label: "Procedimento de interesse"
    type: enum
    options:
      [avaliacao, limpeza, restauracao, canal, implante, protese, ortodontia,
       clareamento, harmonizacao, botox, preenchimento, laser, fisioterapia, outro]
  - key: urgencia
    label: "Urgência"
    type: enum
    options: [imediata, semanas, meses, apenas_pesquisando]
  - key: quem_decide
    label: "Quem decide"
    type: enum
    options: [o_proprio, conjuge, familiar_responsavel, empresa_convenio]
  - key: convenio
    label: "Convênio"
    type: enum
    options: [particular, convenio, reembolso, nao_sei]
  - key: profissional_preferido
    label: "Profissional preferido"
    type: enum
    options: [sem_preferencia, definido]

# Recompra: retorno de manutenção é o LTV que estas clínicas perdem.
recurrence:
  # O QUE DIZER NO TOQUE DE RECOMPRA, na voz deste ramo. Estava no núcleo,
  # servindo igual para o corte de 21 dias e para a reposição de estoque —
  # hábito pessoal de um lado, ruptura de prateleira do outro.
  intent: "Está no ponto do retorno preventivo. Ofereça a data da reavaliação sem alarme e sem prometer resultado — prevenção se vende com rotina, não com medo."
  frequency_field: retorno_previsto
  remind_before_days: 7
  intervals_days:
    trimestral: 90
    semestral: 180
    anual: 365
  default_days: 180

# ---------------------------------------------------------------------
# AGENDAMENTO
# A avaliação é onde o tratamento se vende — fechar o horário na conversa
# é o que traz a pessoa até a cadeira.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 60
  slot_step_min: 30
  min_advance_min: 120

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
services:
  enabled: true
  label: "Procedimentos"
  item_label: "Procedimento"

# ---------------------------------------------------------------------
# VIGÊNCIA DE CONTRATO
# Liga início/vencimento no cadastro e as TRÊS janelas de renovação
# (`lib/renovacao.ts`): 60 dias falando do RESULTADO — sem mencionar
# renovação —, 30 abrindo a continuidade e 7 com a condição concreta.
# Contato único no vencimento chega quando a pessoa já decidiu, e vira
# negociação de preço sob pressão de prazo.
# ---------------------------------------------------------------------
contract:
  enabled: true
  label: "Plano de tratamento"
  # A RENOVAÇÃO, NA VOZ DESTE RAMO (ago/2026)
  #
  # Estes textos moravam no NÚCLEO e nasceram com a academia — "pergunte o que
  # ele já conseguiu que não conseguia" é ótimo para um aluno e constrangedor
  # num contrato de fornecimento. Prosa de venda no núcleo é a Lei 1 vazando,
  # e vazando no lugar mais caro: é o texto que a IA recebe como instrução.
  #
  # A ESTRUTURA continua sendo do núcleo — três janelas com ângulos diferentes
  # e o primeiro toque falando de RESULTADO, nunca de renovação. Isso não é
  # opinião de segmento: é o que separa renovar de cobrar.
  renewal:
    vencido:
      titulo: "Plano de tratamento parou sem conclusão"
      intencao: "Retome sem cobrança e sem alarme. Pergunte como ele está e ofereça o retorno para reavaliação — tratamento interrompido se retoma com avaliação, nunca com desconto."
    janelas:
      - key: resultado
        dias_antes: 60
        titulo: "Perguntar como ele está"
        intencao: "NÃO mencione continuidade comercial. Pergunte como está a queixa que o trouxe e registre a resposta. Em saúde, o resultado percebido é o que sustenta qualquer conversa seguinte."
      - key: continuidade
        dias_antes: 30
        titulo: "Abrir a próxima etapa clínica"
        intencao: "Retome o que ele relatou e apresente a próxima etapa do plano, com o que ela resolve. Nunca prometa resultado clínico — descreva a etapa, não o desfecho."
      - key: condicao
        dias_antes: 7
        titulo: "Fechar retorno e condição"
        intencao: "Data do retorno, valor e forma de pagamento, com o que existir no DNA. Sem data marcada, plano de tratamento vira abandono — e abandono em saúde custa mais que dinheiro."

lead_sources:
  - instagram
  - google
  - whatsapp
  - indicacao
  - convenio
  - site
  - presencial
  - campanha
  - facebook
  - outro

dna_sections:
  - key: pricing
    label: "Valores e formas de pagamento"
    required: true
    fields:
      - { key: avaliacao_valor, type: text, required: true, label: "Valor da avaliação", help: "Quanto custa a primeira avaliação. Ex.: R$ 150, abatido no tratamento", options: ["A avaliação é gratuita", "Cobro a avaliação e abato no tratamento", "Cobro a avaliação, sem abatimento", "Depende do procedimento"] }
      - { key: range, type: money_range, label: "Faixa de valores", help: "A faixa de preço dos seus serviços. Ex.: de R$ 40 a R$ 90" }
      - { key: parcelamento, type: text, required: true, label: "Parcelamento", help: "Em quantas vezes dá para pagar. Ex.: Até 10x sem juros no cartão", options: ["PIX, débito e crédito em até 6x sem juros", "PIX, débito e crédito em até 10x sem juros", "PIX e crédito, com desconto à vista", "PIX, cartão e boleto parcelado"] }
      - { key: formas_pagamento, type: list, label: "Formas de pagamento", help: "Como o cliente pode pagar. Ex.: Pix, débito, crédito em 2x" }
  - key: catalog
    label: "Procedimentos oferecidos"
    required: true
    fields:
      - { key: items, type: table, columns: [procedimento, profissional, duracao, observacao], label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: availability
    label: "Agenda e horários"
    required: true
    fields:
      - { key: weekly_hours, type: schedule, required: true, label: "Horário de funcionamento", help: "Os dias e horários que você atende. Ex.: Seg a Sex 9h-19h; Sáb 8h-14h" }
      - { key: prazo_agendamento, type: text, label: "Prazo para agendar", help: "Quanto tempo demora até conseguir um horário. Ex.: Costuma ter vaga em 2 dias", options: ["Costuma ter horário na mesma semana", "Costuma ter horário em 2 semanas", "Costuma ter horário no mês", "Depende do profissional escolhido"] }
  - key: expertise_proof
    label: "Equipe e credenciais"
    required: true
    fields:
      - { key: profissionais, type: table, columns: [nome, especialidade, registro], label: "Profissionais", help: "Quem atende, a especialidade e o registro profissional" }
      - { key: tempo_de_casa, type: text, label: "Tempo de mercado", help: "Há quanto tempo você atua. Ex.: 12 anos no mercado", options: ["Menos de 2 anos", "2 a 5 anos", "5 a 10 anos", "10 a 20 anos", "Mais de 20 anos"] }
      - { key: tecnologia, type: list, label: "Tecnologia e equipamentos", help: "Equipamentos e tecnologia que você usa e que são diferencial" }
  - key: convenios
    label: "Convênios e reembolso"
    required: true
    fields:
      - { key: aceita_convenio, type: boolean, required: true, label: "Aceita convênio?", help: "Marque se você atende por convênio" }
      - { key: lista, type: list, label: "Lista", help: "Quais convênios você aceita. Escreva o nome exato" }
      - { key: reembolso, type: text, label: "Reembolso", help: "Como funciona o reembolso. Ex.: Emitimos nota para o cliente pedir ao plano", options: ["Emito nota para o paciente pedir reembolso ao convênio", "Não trabalho com convênio nem reembolso", "Atendo por convênio direto, sem reembolso", "Depende do convênio"] }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address, type: text, required: true, label: "Endereço", help: "Endereço completo com ponto de referência. Ex.: Rua X, 100 - ao lado do mercado" }
      - { key: whatsapp, type: text, label: "WhatsApp", help: "O número que o cliente usa para falar com você" }
      - { key: estacionamento, type: text, label: "Estacionamento", help: "Tem estacionamento? Onde o cliente deixa o carro?", options: ["Estacionamento próprio, gratuito", "Convênio com estacionamento ao lado", "Sem estacionamento, mas com vaga na rua", "Sem estacionamento próprio"] }
  - key: policies
    label: "Políticas"
    fields:
      - { key: no_show, type: text, label: "Política de falta", help: "O que acontece quando o cliente falta sem avisar. Ex.: Cobramos 50% na próxima", options: ["Cobro parte do valor quando falta sem avisar", "Não cobro, mas o horário seguinte fica sujeito a disponibilidade", "Cobro a consulta inteira na falta sem aviso", "Não tenho política formal de falta"] }
      - { key: cancelamento, type: text, label: "Política de cancelamento", help: "Até quando dá para desmarcar sem custo. Ex.: Até 2h antes, sem cobrança", options: ["Até 2 horas antes, sem cobrança", "Até 24 horas antes, sem cobrança", "Até 48 horas antes, sem cobrança", "Remarcando na hora, sem cobrança"] }
      - { key: garantia, type: text, label: "Garantia", help: "O que você garante depois do serviço. Ex.: Retoque grátis em até 7 dias", options: ["Retoque grátis em até 7 dias", "Retoque grátis em até 15 dias", "90 dias, como manda a lei", "1 ano no serviço executado"] }
  - key: differentials
    label: "Diferenciais"
    fields:
      - { key: items, type: list, label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

categories:
  pricing:            "Valor da avaliação, do tratamento e parcelamento"
  risk_free_entry:    "Avaliação inicial como porta de entrada"
  availability:       "Agenda, horários e prazo para atendimento"
  expertise_proof:    "Formação, registro, tempo de casa e tecnologia"
  catalog:            "Procedimentos oferecidos"
  goal_matching:      "Queixa do paciente → procedimento indicado"
  objections:         "Caro, medo, vou pensar, vou ver com meu marido, convênio"
  commitment_offer:   "Plano de tratamento completo e parcelamento"
  reciprocity:        "Avaliação sem compromisso, documentação, retorno incluso"
  limits_and_ethics:  "Não prometer resultado, não diagnosticar por mensagem"
  retention:          "Paciente que sumiu no meio do tratamento e manutenção"
  ecosystem:          "Convênios, parceiros e encaminhamentos"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     relacionamento_carnegie
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       relacionamento_carnegie
  objections:          negociacao_voss
  commitment_offer:    cadencia_blount
  reciprocity:         relacionamento_carnegie
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica — a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # A régua abaixo é deste ramo: o que trava é MEDO tanto quanto valor, e
  # cobrança acelera a desistência. Nunca prometer resultado clínico.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 2, intent: "Acolher a queixa em uma frase e oferecer a avaliação — sem preço de procedimento, que sem exame é chute." }
      - { offset_days: 5, intent: "Responder a dúvida que quase ninguém escreve: se dói, quanto tempo leva e se dá para parcelar." }
      - { offset_days: 11, intent: "Encerrar com porta aberta e sem urgência fabricada. Urgência inventada em saúde é o que faz o paciente não voltar nunca." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: descoberta_parada
    applies_to: qualification
    steps:
      - { offset_days: 2, intent: "Confirmar só o que falta para montar o plano — histórico ou urgência —, devolvendo o que ele já contou." }
      - { offset_days: 6, intent: "Oferecer a avaliação como o passo que responde tudo de uma vez, em vez de continuar perguntando por mensagem." }
      - { offset_days: 12, intent: "Encerrar deixando claro que a porta segue aberta quando ele decidir cuidar disso." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 2, intent: "Nomear o que ele levantou e trazer o fato que falta — condição de pagamento, tempo de tratamento ou o que está incluso." }
      - { offset_days: 6, intent: "Checar se é valor mesmo ou medo do procedimento. São objeções diferentes e o remédio de uma piora a outra." }
      - { offset_days: 12, intent: "Oferecer o menor primeiro passo clínico que exista no DNA; se não existir, ESCALAR em vez de inventar condição." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: adesao_tratamento
    applies_to: onboarding
    steps:
      - { offset_days: 7, intent: "Confirmar que a primeira etapa foi feita e perguntar como ele está — abandono de tratamento começa no silêncio, não na recusa." }
      - { offset_days: 21, intent: "Retomar quem não voltou para a sessão seguinte, sem cobrança: remarcar é mais fácil que recomeçar." }
      - { offset_days: 45, intent: "Último toque de adesão antes de considerar o tratamento interrompido — e registrar isso, que é fato clínico e comercial." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  # A conversão acontece na cadeira: confirmar presença é dinheiro.
  - key: pre_consulta
    applies_to: trial_followup
    steps:
      - { offset_days: -1, intent: "Confirmar a avaliação e reduzir a falta" }
      - { offset_days: 1,  intent: "Reagendar quem não compareceu, sem cobrança" }
    stop_on: [converted, opted_out]

  # O buraco do segmento: plano entregue e ninguém volta a falar.
  - key: pos_orcamento
    applies_to: proposal_followup
    steps:
      - { offset_days: 2,  intent: "Tirar dúvida sobre o plano, sem cobrar decisão" }
      - { offset_days: 7,  intent: "Apresentar a condição de pagamento que viabiliza" }
      - { offset_days: 15, intent: "Última retomada, com porta aberta" }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: manutencao
    applies_to: reactivation
    steps:
      - { offset_days: 0, intent: "Chamar para o retorno de manutenção previsto" }
    stop_on: [converted, opted_out]

hard_rules:
  - "NUNCA prometer resultado de tratamento — é vedado e gera responsabilidade."
  - "NUNCA dar diagnóstico, indicar procedimento ou receitar por mensagem: só o profissional, presencialmente, após avaliação."
  - "Não afirmar valor de tratamento antes da avaliação quando o preço depende do caso — informe o valor da avaliação."
  - "Não citar caso, foto ou nome de outro paciente. Sigilo é obrigatório."
  - "Só afirmar convênio, garantia ou parcelamento que esteja no DNA."

kpis:
  - taxa_conversao
  - comparecimento_avaliacao
  - planos_apresentados
  - taxa_aprovacao_plano
  - ticket_medio
  - tempo_resposta_mediana
