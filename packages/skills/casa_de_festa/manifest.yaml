key: casa_de_festa
name: Casa de Festas e Buffet (infantil, formatura, casamento, corporativo)
version: 1.0.0

# =====================================================================
# POR QUE ESTE SEGMENTO EXISTE — e por que ele não é "eventos" genérico.
#
# A ideia veio do fundador e a pesquisa confirmou, com um detalhe a mais
# que ele não tinha: aqui **a DATA é o estoque**, e é o estoque mais
# perecível que já modelamos.
#
# 1. DUAS FESTAS NÃO CABEM NO MESMO SÁBADO. Na barbearia, cadeira vazia
#    é prejuízo de uma hora; aqui, um sábado não vendido é perda total e
#    irreversível — e sábado e domingo são a maior parte da receita do
#    ano. As melhores datas esgotam com 30 a 60 dias de antecedência em
#    festa infantil, e com muito mais em casamento.
#    Consequência: o SINAL não é política de no-show, é o que transfere a
#    posse da data. Segurar data sem sinal é a forma mais comum de
#    perder duas vendas de uma vez.
#
# 2. A RECORRÊNCIA É ANUAL E QUASE NINGUÉM TRABALHA — a jogada que o
#    fundador identificou. Aniversário se repete todo ano, a família
#    costuma trocar de casa de festa, e "clientes recorrentes são o melhor
#    negócio" do setor. O motor de recompra do COS resolve isso com um
#    intervalo de 365 dias.
#    O DETALHE QUE A PESQUISA ACRESCENTOU: a festa raramente acontece no
#    dia do aniversário. O costume é o primeiro ou o segundo fim de semana
#    DEPOIS. Então o alerta não pode ser "aniversário em X" — tem que ser
#    "reservar o fim de semana próximo a X", disparado com meses de
#    antecedência, porque quem chega em cima não acha data.
#    Por isso existem DOIS campos de data neste manifesto: a do
#    aniversariante (que se repete) e a do evento (que é a vendida).
#
# 3. O MODELO DE FORNECIMENTO MUDA A CONVERSA INTEIRA. Existem casas que
#    entregam pacote fechado (espaço + comida + bebida + equipe, cobrado
#    por convidado) e casas que alugam só o espaço, com buffet de fora e
#    TAXA DE ROLHA por garrafa aberta. São dois negócios diferentes
#    vendidos com o mesmo nome, e comparar preço entre eles sem separar é
#    a origem do "achei mais barato" que não é mais barato.
#
# 4. O QUE ESTOURA O ORÇAMENTO NÃO É O PREÇO, É O QUE NÃO FOI DITO:
#    hora extra, taxa de rolha, convidado além do contratado, taxa de
#    serviço. Dizer isso ANTES é o principal diferencial de confiança —
#    e é o que vira reclamação quando fica para depois.
#
# NÚMEROS DE REFERÊNCIA (2026): casamento de 100 pessoas custa de R$ 40 a
# R$ 120 mil, com espaço e buffet levando 45% a 50%; buffet por convidado
# em capital fica entre R$ 120 e R$ 350; o aluguel do espaço representa
# 15% a 25% do orçamento. Servem de régua, nunca de preço — o preço é o
# do DNA da casa.
# =====================================================================

capabilities: []

vocabulary:
  lead: "cliente"
  conversion: "data reservada"
  churn: "data perdida"
  catalog_item: "pacote"

discovery_axis: "que evento é, para quantas pessoas, em que data, e se a pessoa quer pacote fechado ou só o espaço"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Descobrir data, número de convidados e tipo de evento. Sem isso não existe orçamento."
    - key: orcamento
      label: "Orçamento enviado"
      goal: "Orçamento com TUDO que entra e o que não entra. O que não foi dito vira reclamação."
      cadence: pos_orcamento
      phases:
        - { key: envio,   label: "Orçamento enviado",  offset_days: 0 }
        - { key: duvidas, label: "Tirar dúvidas",      offset_days: 3 }
        - { key: data,    label: "Alertar sobre a data", offset_days: 7 }
    - key: visita
      label: "Visita ao espaço"
      goal: "Quem visita fecha muito mais. O espaço se vende sozinho quando a pessoa entra."
      cadence: pre_visita
      phases:
        - { key: agendada,  label: "Visita agendada",   offset_days: 0 }
        - { key: confirmar, label: "Confirmar véspera", offset_days: -1 }
    - key: reservado
      label: "Data reservada"
      goal: "Sinal pago e contrato assinado. A data só é dela depois disso."
      cadence: pre_evento
    - key: realizado
      label: "Evento realizado"
      # Terminal E `won`: é o cliente conquistado, e é de onde sai a
      # recompra do ano que vem. O núcleo mantém a recorrência em etapa
      # `won` — que aqui é a razão de existir do segmento.
      terminal: true
      won: true
      goal: "Festa entregue. A próxima venda é a do ano que vem, e ela começa agora."
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # a de silêncio é `lost` e alcançável; a de recusa é terminal.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Não fechou"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

contact_fields:
  - key: tipo_evento
    label: "Tipo de evento"
    type: enum
    options:
      [aniversario_infantil, aniversario_adulto, casamento, formatura, cha_revelacao,
       batizado, bodas, confraternizacao_empresa, outro]
  # A DATA DO EVENTO é a que se vende. Ela é única e não se repete.
  - key: data_evento
    label: "Data pretendida do evento"
    type: date
  # A DATA DO ANIVERSARIANTE é a que se REPETE — e é dela que sai o alerta
  # do ano seguinte. São coisas diferentes de propósito: a festa costuma
  # cair no fim de semana seguinte ao aniversário, não no dia.
  - key: data_aniversario
    label: "Data de nascimento do aniversariante"
    type: date
  - key: nome_aniversariante
    label: "Nome do aniversariante"
    type: text
  - key: convidados
    label: "Número de convidados"
    type: number
  - key: regime
    label: "O que ela quer contratar"
    type: enum
    options: [pacote_fechado, espaco_com_buffet_proprio, espaco_puro, ainda_nao_sabe]
  - key: bebida
    label: "Bebida"
    type: enum
    options: [inclusa_no_pacote, contratada_a_parte, cliente_leva_com_rolha, sem_bebida, indefinido]
  - key: flexibilidade_data
    label: "A data é fechada?"
    type: enum
    options: [data_unica, aceita_fim_de_semana_proximo, aceita_outro_mes, so_pesquisando]

  # QUALIFICAÇÃO DE COMPRA (MEDDIC-lite). Chaves e opções canônicas.
  # Faz sentido aqui porque formatura e evento de empresa têm comissão,
  # verba aprovada e mais de uma pessoa assinando.
  - key: verba
    label: "Verba do evento"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Quem decide junto"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem puxa a decisão do outro lado"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

# A visita ao espaço é o que mais converte, e ela tem hora marcada.
scheduling:
  enabled: true
  default_duration_min: 45
  slot_step_min: 30
  min_advance_min: 240

services:
  enabled: true
  label: "Eventos realizados"
  item_label: "evento"

# A RECOMPRA ANUAL — o motivo comercial de este segmento existir.
# 365 dias, e o alerta precisa sair com MESES de antecedência, porque data
# boa esgota. O campo do contato manda; isto é o padrão.
recurrence:
  # O QUE DIZER NO TOQUE DE RECOMPRA, na voz deste ramo. Estava no núcleo,
  # servindo igual para o corte de 21 dias e para a reposição de estoque —
  # hábito pessoal de um lado, ruptura de prateleira do outro.
  intent: "Está chegando a data que ele comemora todo ano. Ofereça a reserva antes de a agenda fechar — data de aniversário e formatura é escassez real, e lembrar dela primeiro é o diferencial."
  enabled: true
  default_interval_days: 365
  field: data_aniversario

lead_sources:
  - whatsapp
  - instagram
  - google
  - indicacao
  - passou_na_frente
  - festa_anterior
  - cerimonialista
  - fornecedor_parceiro
  - site
  - facebook
  - campanha
  - outro

# ---------------------------------------------------------------------
# POR QUE O CLIENTE NÃO FECHOU (OU NÃO VOLTOU)
#
# Lista fechada, do MANIFESTO — é o que permite SOMAR. `fora_da_campanha` tira
# da reativação automática, e `abordagem` é o texto que chega em quem redige.
#
# ⚠ AQUI A COMPRA É DE UMA VEZ SÓ, E A DATA É O PRODUTO. Ninguém faz aniversário
# de novo no mês seguinte — o ciclo é anual, e o motivo mais caro de perder é a
# AGENDA: quem procurou e não tinha a data disponível não é objeção, é receita
# que a casa recusou. Somar esses é o que decide abrir turno, sala ou horário.
churn_reasons:
  - key: data_indisponivel
    label: "A data que ele queria não estava livre"
    o_que_fazer: "Não é perda comercial, é falta de capacidade — e é o número mais importante desta lista. Ofereça as datas próximas ANTES de encerrar, e registre a data pedida: dez registros no mesmo fim de semana são a decisão de abrir outro turno."
  - key: escolheu_outro_local
    label: "Fechou em outro lugar"
    o_que_fazer: "Descubra o que pesou: preço, tamanho, estacionamento, o que estava incluso. Em festa a decisão quase nunca é só preço — é o que o cliente imaginou e não conseguiu ver aqui."
  - key: orcamento
    label: "Orçamento acima do que podia"
    o_que_fazer: "É o único motivo em que condição resolve. O caminho é reduzir ESCOPO com honestidade — menos horas, menos convidados, pacote enxuto — nunca cortar preço mantendo tudo, que desvaloriza o pacote cheio para o próximo cliente."
  - key: adiou_o_evento
    label: "Adiou o evento"
    o_que_fazer: "Não é perda, é data movida. Pergunte para quando adiou e REGISTRE essa data — ela é o próximo contato, e ninguém mais vai lembrar dela por ele."
    pausa_dias: 60
    abordagem: "Perto da data nova, retome citando o que já tinha sido conversado: 'você tinha me falado de [mês] — a agenda daquele período está abrindo agora'."
  - key: evento_cancelado
    label: "O evento foi cancelado"
    o_que_fazer: "Pergunte com cuidado antes de qualquer oferta: cancelamento de festa às vezes é notícia ruim de família. Se for logística, ofereça remarcar; se for pessoal, encerre bem e não insista."
    fora_da_campanha: true
    pausa_dias: 90
    abordagem: "Depois de 90 dias, uma mensagem curta e sem oferta, só se ninguém tiver dito para não procurar mais."
  - key: evento_realizado
    label: "Já fez o evento aqui"
    o_que_fazer: "Não é perda: é cliente satisfeito fora de ciclo. O contato certo é ANUAL, perto da data do ano anterior, e o assunto mais forte não é a festa dele — é INDICAÇÃO: quem fez uma festa boa conhece quem vai fazer a próxima."
  - key: nao_disse
    label: "Não quis dizer"
    o_que_fazer: "Registre assim mesmo: quem não contou é diferente de quem nunca foi perguntado."

dna_sections:
  - key: catalog
    label: "Pacotes e espaço"
    required: true
    fields:
      - { key: items, type: table, columns: [pacote, o_que_inclui, capacidade], required: true, label: "Pacotes que você vende", help: "O sistema só fala do que estiver aqui. Seja explícito no que inclui" }
      - { key: capacidade, type: text, required: true, label: "Capacidade do espaço", help: "Mínimo e máximo de convidados. Ex.: de 40 a 150 pessoas", options: ["De 30 a 80 convidados", "De 40 a 150 convidados", "De 80 a 250 convidados", "Mais de 250 convidados"] }
      - { key: nao_faz, type: list, label: "O que você NÃO faz", help: "Serviços que pedem e você não atende. Evita promessa errada" }
      - { key: estrutura, type: list, label: "O que o espaço tem", help: "Brinquedoteca, estacionamento, ar-condicionado, acessibilidade, área externa" }
  - key: pricing
    label: "Valores e regras de cobrança"
    required: true
    fields:
      - { key: regime, type: text, required: true, label: "Como você trabalha", help: "Pacote fechado por convidado, espaço puro, ou os dois? É a primeira coisa que muda o preço", options: ["Pacote fechado por convidado", "Aluguel do espaço puro", "Os dois: pacote ou espaço puro", "Pacote fechado, com itens opcionais à parte"] }
      - { key: valor_por_convidado, type: text, label: "Valor por convidado", help: "Se o pacote é por pessoa. Diga o mínimo de convidados cobrado", options: ["Por pessoa, com mínimo de convidados cobrado", "Por pessoa, sem mínimo", "Faixas por quantidade de convidados", "Não trabalho por convidado"] }
      - { key: valor_espaco, type: text, label: "Valor do espaço", help: "Se aluga o espaço puro, quanto e por quantas horas", options: ["Valor fechado por período de horas", "Valor por hora", "Valor diferente para sábado e meio de semana", "Não alugo o espaço puro"] }
      # OS EXTRAS SÃO O QUE ESTOURA O ORÇAMENTO — e o que vira reclamação
      # quando não foi dito antes. Por isso são campos separados e obrigatórios.
      - { key: taxa_rolha, type: text, required: true, label: "Taxa de rolha", help: "Se o cliente pode levar bebida e quanto custa por garrafa. Se não permite, escreva isso", options: ["Não permito bebida de fora", "Permito, com taxa por garrafa", "Permito sem taxa", "Permito só para bebida que não vendo"] }
      - { key: hora_extra, type: text, required: true, label: "Hora extra", help: "Quanto custa passar do horário e como é cobrada", options: ["Valor fechado por hora extra", "Valor por hora, cobrado no dia", "Fração de 30 minutos", "Não permito hora extra"] }
      - { key: convidado_extra, type: text, required: true, label: "Convidado além do contratado", help: "Como cobra quem chega a mais no dia", options: ["Cobro o valor por pessoa no acerto final", "Cobro com acréscimo quem não foi contratado", "Tolero uma margem e cobro acima dela", "Faço a contagem na entrada"] }
      - { key: parcelamento, type: text, required: true, label: "Formas de pagamento", help: "Ex.: sinal de 30%, restante em até 4x até 7 dias antes do evento", options: ["PIX, débito e crédito à vista", "PIX, débito e crédito em até 3x sem juros", "PIX, débito e crédito em até 6x sem juros", "PIX e dinheiro, com desconto à vista"] }
  - key: availability
    label: "Datas e agenda"
    required: true
    fields:
      - { key: sinal, type: text, required: true, label: "Sinal que reserva a data", help: "Quanto e em quanto tempo. A data só sai do mercado depois disso", options: ["30% para reservar a data", "50% para reservar a data", "Valor fixo de sinal, independente do pacote", "A data só é reservada com o contrato assinado e o sinal pago"] }
      - { key: antecedencia, type: text, required: true, label: "Com quanta antecedência lota", help: "Ex.: sábado à tarde fecha com 3 meses; meio de semana tem data no mês", options: ["Sábado à tarde fecha com 3 meses", "Datas de fim de semana fecham com 2 meses", "Meio de semana costuma ter data no mês", "Depende muito da época do ano"] }
      - { key: horarios, type: text, required: true, label: "Horários disponíveis", help: "Ex.: sábado 12h-17h ou 18h-23h; domingo 12h-17h", options: ["Sábado 12h-17h ou 18h-23h", "Sábado e domingo, um evento por período", "Um evento por dia", "Horário combinado por evento"] }
      - { key: espera, type: text, label: "Lista de espera", help: "Como funciona quando a data pedida já está reservada", options: ["Anoto e aviso se a data liberar", "Ofereço a data mais próxima disponível", "Não trabalho com lista de espera", "Anoto e ofereço uma segunda opção de data"] }
  - key: policies
    label: "Regras do contrato"
    required: true
    fields:
      - { key: cancelamento, type: text, required: true, label: "Cancelamento e devolução do sinal", help: "Seja claro. É a pergunta que mais gera desconfiança", options: ["Até 2 horas antes, sem cobrança", "Até 24 horas antes, sem cobrança", "Até 48 horas antes, sem cobrança", "Remarcando na hora, sem cobrança"] }
      - { key: remarcacao, type: text, label: "Troca de data", help: "Se permite, com quanta antecedência e se o sinal acompanha", options: ["Permito uma vez, com antecedência, e o sinal acompanha", "Permito com antecedência mínima, mediante taxa", "Permito só por motivo de força maior", "Não permito troca de data"] }
      - { key: chuva, type: text, label: "Se o espaço tem área externa", help: "O que acontece se chover. Plano B declarado tira medo", options: ["Todo o espaço é coberto", "Área externa com cobertura alternativa", "Área externa descoberta, com plano B interno", "Área externa descoberta, sem plano B"] }
      - { key: fornecedor_externo, type: text, label: "Fornecedor de fora", help: "Pode entrar decoradora, fotógrafo e buffet de fora? Tem taxa ou credenciamento?", options: ["Pode entrar qualquer fornecedor, sem taxa", "Pode entrar, com credenciamento prévio", "Pode entrar, com taxa", "Só fornecedores da nossa lista"] }
  - key: expertise_proof
    label: "Experiência e prova"
    required: true
    fields:
      - { key: tempo_de_casa, type: text, required: true, label: "Tempo de casa", help: "Ex.: 11 anos e mais de 900 festas", options: ["Menos de 2 anos", "2 a 5 anos", "5 a 10 anos", "10 a 20 anos", "Mais de 20 anos"] }
      - { key: eventos_por_mes, type: text, label: "Quantos eventos por mês", help: "Volume é prova concreta de operação", options: ["Até 4 eventos por mês", "De 5 a 10 por mês", "De 10 a 20 por mês", "Mais de 20 por mês"] }
      - { key: depoimentos, type: list, label: "Clientes que aceitam conversar", help: "Vale mais que qualquer depoimento escrito" }
      - { key: alvara, type: text, label: "Alvará e segurança", help: "Alvará, AVCB, seguro. Em espaço com criança isso pesa", options: ["Alvará e AVCB em dia", "Alvará, AVCB e seguro de responsabilidade civil", "Alvará em dia, AVCB em renovação", "Posso apresentar a documentação na visita"] }
  - key: retention
    label: "O ano que vem"
    required: true
    fields:
      - { key: antecedencia_contato, type: text, required: true, label: "Com quanta antecedência você chama de volta", help: "Data boa esgota. Ex.: 4 meses antes do aniversário, oferecendo o fim de semana mais próximo", options: ["4 meses antes da data do aniversário", "3 meses antes", "2 meses antes", "Não faço isso de forma organizada"] }
      - { key: condicao_retorno, type: text, label: "Condição para quem já fez festa aqui", help: "O que a família ganha por voltar. É a venda mais barata que existe", options: ["Desconto para quem já fez festa aqui", "Cortesia de um item do pacote", "Prioridade na escolha da data", "Não tenho condição especial de retorno"] }
  - key: ecosystem
    label: "Fornecedores e parcerias"
    fields:
      - { key: parceiros, type: list, label: "Parceiros que você indica", help: "Decoração, fotografia, animação, bolo, cerimonial" }
      - { key: indicacao, type: text, label: "Programa de indicação", help: "O que a família ganha por indicar. Festa gera festa: os convidados são o público", options: ["Quem indica ganha desconto no próximo atendimento", "Quem indica e quem é indicado ganham desconto", "Quem indica ganha um serviço de cortesia", "Não tenho programa de indicação"] }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address, type: text, label: "Endereço", help: "Onde fica o espaço" }
      - { key: whatsapp, type: text, label: "WhatsApp", help: "O número que o cliente usa" }
      - { key: instagram, type: text, label: "Instagram", help: "Onde ele vê as festas. Ex.: @suacasadefestas" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

categories:
  pricing:            "Pacote por convidado, espaço puro, rolha, hora extra e convidado a mais"
  risk_free_entry:    "Visita ao espaço e a experiência de entrar no lugar"
  availability:       "Data disponível, antecedência e lista de espera"
  expertise_proof:    "Tempo de casa, volume de festas, alvará e segurança"
  catalog:            "Pacotes, capacidade e estrutura do espaço"
  goal_matching:      "Que evento é, para quem, e qual pacote resolve"
  objections:         "Achei mais barato, é caro, vou pesquisar outros espaços"
  commitment_offer:   "Sinal que reserva a data e contrato"
  reciprocity:        "Visita guiada, degustação e orçamento aberto"
  limits_and_ethics:  "Não segurar data sem sinal, não esconder extra"
  retention:          "O aniversário do ano que vem e a família que volta"
  ecosystem:          "Decoração, foto, animação e os convidados como público"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA.
#
# A escolha central: ticket alto e decisão emocional, mas com ESTOQUE
# ESCASSO e verificável. Isso cria a única urgência honesta do catálogo do
# COS — a data existe ou não existe, e dá para provar na agenda. Por isso
# `availability` e `commitment_offer` vão para `fechamento_classico`: aqui
# pedir a decisão é serviço prestado, porque hesitar custa a data.
# Já `objections` continua em Voss: quando o assunto é preço, comparar
# pacote fechado com espaço puro é o que resolve, não pressão.
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    fechamento_classico
  reciprocity:         persuasao_cialdini
  limits_and_ethics:   relacionamento_carnegie
