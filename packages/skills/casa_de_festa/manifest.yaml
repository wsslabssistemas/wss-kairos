cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica — a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # A régua abaixo é deste ramo: a DATA é escassez real, não argumento de
  # vendedor — e dizer isso com fato é legítimo; sem fato, é pressão.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 2, intent: "Perguntar data e número de convidados, só isso. Sem os dois não existe orçamento — e é a pergunta que o cliente entende por que precisa responder." }
      - { offset_days: 5, intent: "Informar a situação REAL da data que ele citou, se ela estiver no sistema. Escassez verdadeira move; escassez inventada queima." }
      - { offset_days: 10, intent: "Encerrar com porta aberta — e registrar a data pretendida, que é o gancho da retomada." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  # O orçamento de festa some rápido porque a pessoa pede em cinco lugares
  # no mesmo dia. O terceiro toque usa a única urgência honesta que existe
  # aqui: a data que ela quer ainda está livre — e pode não estar amanhã.
  - key: pos_orcamento
    applies_to: proposal_followup
    steps:
      - { offset_days: 3, intent: "Tirar dúvida sobre o que está incluso, sem cobrar decisão" }
      - { offset_days: 7, intent: "Convidar para conhecer o espaço — quem visita fecha muito mais" }
      - { offset_days: 12, intent: "Avisar com honestidade a situação real da data pretendida" }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: pre_visita
    applies_to: trial_followup
    steps:
      - { offset_days: -1, intent: "Confirmar a visita na véspera" }
      - { offset_days: 1,  intent: "Retomar quem visitou e não fechou, com o que ficou pendente" }
    stop_on: [converted, opted_out]

  - key: pre_evento
    applies_to: trial_followup
    steps:
      - { offset_days: -30, intent: "Fechar o número de convidados e o cardápio" }
      - { offset_days: -7,  intent: "Confirmar detalhes finais, horário e fornecedores externos" }
      - { offset_days: 2,   intent: "Agradecer, pedir a foto e o depoimento no pico da satisfação" }
    stop_on: [opted_out]

  # A CADÊNCIA QUE JUSTIFICA O SEGMENTO. Dispara meses antes do próximo
  # aniversário, porque data boa esgota — chegar no mês da festa é chegar
  # tarde. E a oferta é do FIM DE SEMANA próximo, não do dia exato.
  - key: aniversario_do_ano_que_vem
    applies_to: reactivation
    steps:
      - { offset_days: -120, intent: "Lembrar que o aniversário está chegando e oferecer o fim de semana mais próximo, antes de a agenda fechar" }
      - { offset_days: -75,  intent: "Retomar com as datas que ainda restam no período" }
      - { offset_days: -45,  intent: "Último aviso honesto sobre a disponibilidade do mês" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

hard_rules:
  - "NUNCA segurar data sem sinal. Data prometida na palavra é a forma mais comum de perder duas vendas: a que não pagou e a que foi recusada."
  - "Todo orçamento diz o que ESTÁ e o que NÃO está incluso. Taxa de rolha, hora extra, convidado além do contratado e taxa de serviço são ditos antes, sempre."
  - "Não afirmar disponibilidade de data sem conferir a agenda."
  - "Não comparar preço com outra casa sem separar o regime: pacote fechado e espaço puro não são a mesma coisa."
  - "Não prometer estrutura, capacidade ou fornecedor que não esteja no DNA."

