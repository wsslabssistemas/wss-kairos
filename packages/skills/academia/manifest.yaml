key: academia
name: Academia
version: 1.0.0

# Modulos do segmento. B2C local nao faz prospeccao fria de pessoas (LGPD).
capabilities: []

# =====================================================================
# Uma Skill é DADO, nunca código. Nenhuma linha do sistema muda
# entre esta Skill e a de barbearia.
# =====================================================================

vocabulary:
  lead: "aluno em potencial"
  conversion: "matrícula"
  churn: "cancelamento"
  catalog_item: "modalidade"

discovery_axis: "objetivo físico (emagrecer, ganhar massa, saúde)"

# ---------------------------------------------------------------------
# JORNADA
# É um grafo, não uma linha: pode avançar, pular e RETROCEDER.
# Um lead que recebeu proposta e levanta objeção nova volta à descoberta.
# ---------------------------------------------------------------------
journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Quebrar o gelo e descobrir o objetivo. Nunca abrir com preço."
    - key: descoberta
      label: "Descoberta"
      cadence: descoberta_parada
      goal: "Qualificar objetivo, experiência e rotina."
    - key: proposta
      label: "Proposta"
      cadence: proposta_sem_resposta
      goal: "Apresentar a opção adequada e conduzir à experiência."
    - key: experimentacao
      label: "Semana experimental"
      cadence: trial_followup
      goal: "Conduzir a experiência e preparar o fechamento."
      # Fases dentro do estágio: dia 2 e dia 8 pedem tratamento oposto,
      # mas não são etapas diferentes da jornada.
      phases:
        - { key: inicio,        label: "Início",        offset_days: 0 }
        - { key: acompanhamento,label: "Acompanhamento",offset_days: 2 }
        - { key: pre_fechamento,label: "Pré-fechamento",offset_days: 6 }
        - { key: conversao,     label: "Conversão",     offset_days: 8 }
    - key: negociacao
      label: "Negociação"
      cadence: negociacao_travada
      goal: "Isolar a objeção real e fechar."
    # MATRICULADO É `won` E DEIXOU DE SER TERMINAL (ago/2026).
    #
    # Era terminal, e etapa terminal DESLIGA O MOTOR: `computeDueTouches` pula
    # terminal, então ninguém nunca recebia um toque depois de matricular. É a
    # mesma armadilha que já custou a recompra da carteira fiel na barbearia —
    # no segmento cuja tese é recompra.
    #
    # Aqui o efeito é pior: a evasão de academia acontece nos primeiros meses,
    # e é exatamente nessa janela que o sistema estava calado. A conversão
    # continua sendo contada aqui (`won`), que é o que a métrica canônica pede;
    # o que muda é que o motor continua alcançando quem já é aluno.
    - key: convertido
      label: "Matriculado"
      won: true
      cadence: pos_matricula
      goal: "Matriculou. Os primeiros 90 dias decidem se ele fica — e é aqui que a academia costuma sumir."
      phases:
        - { key: primeira_semana, label: "Primeira semana",  offset_days: 7 }
        - { key: primeiro_mes,    label: "Primeiro mês",     offset_days: 30 }
        - { key: dois_meses,      label: "Dois meses",       offset_days: 60 }
        - { key: tres_meses,      label: "Três meses",       offset_days: 90 }
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisao.
    # ⚠ EX-ALUNO É ESTADO PRÓPRIO, e a falta dele era um buraco na jornada.
    #
    # A jornada ia de lead a matriculado e saía por "parou de responder" ou
    # "disse não". Quem PAGOU e saiu não tinha casa nenhuma — e jogar essa
    # pessoa em "parou de responder" faz o motor tratá-la como um lead que
    # sumiu: a IA escreveria "vamos continuar nossa conversa para eu entender o
    # que você procura" para quem treinou dois anos aqui.
    #
    # A própria biblioteca já sabia da diferença. A entrada de reativação diz,
    # com todas as letras: *"verifique o histórico: se a pessoa nunca foi
    # cliente, é primeira oportunidade, não retorno."* Faltava o estado para
    # ela poder olhar.
    #
    # `lost: true` e NÃO terminal, e as duas metades importam:
    #   • `lost` tira da conversão e da carteira em aberto — ex-aluno já foi
    #     contado como ganho no dia em que matriculou, e contar de novo
    #     inflaria o funil com gente que não está em negociação.
    #   • não-terminal mantém o motor alcançando: etapa terminal DESLIGA a
    #     cadência, e foi assim que a carteira fiel da barbearia sumiu da
    #     recompra no segmento cuja tese é recompra.
    - key: ex_aluno
      label: "Ex-aluno"
      lost: true
      # A régua é a `rescue_inactive`, que já existia curada e órfã. Escrever
      # uma segunda seria repetir o defeito de `phases` × `cadence`: a mesma
      # coisa declarada duas vezes, divergindo em silêncio.
      cadence: rescue_inactive
      goal: "Foi aluno e saiu. Nunca abra cobrando a ausência: gere culpa e ele some de vez. Abra por um gancho concreto do histórico dele."
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

# ---------------------------------------------------------------------
# CAMPOS PRÓPRIOS DO SEGMENTO
# Vão para contacts.custom (jsonb). Enum sempre, nunca texto livre:
# texto livre fragmenta o dado (ex.: "TotalPass" e "Totalpass" separados).
# ---------------------------------------------------------------------
contact_fields:
  - key: objetivo
    label: "Objetivo"
    type: enum
    options: [emagrecer, hipertrofia, saude, qualidade_de_vida, socializacao, reabilitacao]
  - key: nivel
    label: "Experiência"
    type: enum
    options: [nunca_treinou, retomando, experiente]
  - key: turno_preferido
    label: "Turno preferido"
    type: enum
    options: [manha, tarde, noite, sabado]

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
# DESLIGADO EM ago/2026, a pedido do fundador — e ele está certo.
# A receita de academia é MENSALIDADE, não serviço executado e repetido. A tela
# de "Atendimentos" pedia para registrar um valor por atendimento, que nesse
# ramo não significa nada: o aluno paga o mês, não a visita. Campo que não
# significa nada não fica vazio — fica preenchido errado, e depois alguém soma.
# Barbearia, salão, oficina e pet continuam com isto ligado, porque lá o
# dinheiro entra por serviço mesmo.
services:
  enabled: false

# ---------------------------------------------------------------------
# VIGÊNCIA DE CONTRATO
# Liga início/vencimento no cadastro e as TRÊS janelas de renovação
# (`lib/renovacao.ts`): 60 dias falando do RESULTADO — sem mencionar
# renovação —, 30 abrindo a continuidade e 7 com a condição concreta.
# Contato único no vencimento chega quando a pessoa já decidiu, e vira
# negociação de preço sob pressão de prazo.
# ---------------------------------------------------------------------
contract:
  enabled: true
  label: "Plano"
  # PARA ONDE VAI QUEM SAIU. A sincronização detecta a ausência na planilha e
  # precisa saber em que etapa colocar a pessoa — e a chave é vocabulário do
  # ramo, então mora aqui e não no núcleo (Lei 1). Sem esta linha o
  # encerramento continua sendo marcado, só não move ninguém de etapa: mover
  # por engano é pior que deixar parado.
  ended_stage: ex_aluno

  # DE ONDE ELE SAI — a etapa de quem tem contrato de pé.
  #
  # ⚠ ELA EXISTE PORQUE A TRAVA DA SINCRONIZAÇÃO MEDIA ERRADO. Sem esta linha,
  # "contrato ativo" era toda pessoa com código do sistema que nunca passou por
  # uma sincronização — e na Be Fitness isso somava 1.434, dos quais **996 já
  # estavam em `ex_aluno` há meses**. A planilha correta, com 304 alunos, era
  # comparada contra 1.434 e disparava "80% sumiram" em toda importação.
  #
  # ⚠ ALARME QUE TOCA SEMPRE É ALARME DESLIGADO. A trava nasceu para impedir
  # baixa em massa por planilha parcial; medindo assim, ela ensinava a pessoa a
  # clicar em "aplicar mesmo assim" sem ler — e no dia da planilha de verdade
  # parcial, ninguém ia parar.
  #
  # ⚠ E ELA TAMBÉM DECIDE QUEM PODE SER MOVIDO. Só sai da etapa quem está NESTA
  # etapa. Quem já está em `perdido`, `recusou` ou `ex_aluno` recebe o carimbo
  # de encerrado e fica onde está — mover gente de etapa por engano é pior que
  # não mover, e transformar quem disse NÃO em candidato a reativação com data
  # de hoje contraria a regra de que a decisão é do cliente.
  active_stage: convertido

  # ⚠ O QUE CADA NOME DE PLANO SIGNIFICA — lido da coluna `Plano` da planilha.
  #
  # A exportação da Be Fitness (20/ago) tem 393 linhas: ~331 são plano de
  # verdade, **46 são "Treino Avulso"** e **16 são "Semana FREE"**. O sistema
  # ignorava a coluna e tratava os três como contrato — o que faz gente de
  # passagem virar "ex-aluno" e receber oferta de retorno sem nunca ter sido
  # cliente. Mesma classe do Gympass: mensagem plausível chegando em quem não
  # deveria receber, no nome da academia.
  #
  # E infla o denominador: 46 pessoas de passagem contadas como carteira fazem
  # a conversão e a retenção mentirem para baixo.
  #
  # A COMPARAÇÃO É POR PEDAÇO DO NOME, não igualdade — a mesma planilha traz
  # "Semana FREE" e "Semana FREE2", porque quem cria plano é a recepção.
  planos:
    # Sessão única: NÃO é contrato e NÃO vira ex-aluno. Quem pagou uma aula não
    # deixou de ser aluno — ele nunca foi.
    # ⚠ As duas formas de gênero: "treino avulso" e "aula avulsa".
    # ⚠ Pode escrever com acento: a comparação tira acento dos DOIS lados antes
    # de casar (`lib/planos.ts`). Este arquivo é lido por gente — português
    # sem acento aqui é sujeira, não requisito técnico.
    avulso: ["treino avulso", "avulso", "avulsa", "diária", "day use"]
    # Experimentação gratuita. PODE virar ex-aluno, e a diferença para o avulso
    # é de intenção: quem faz a semana experimental está avaliando a academia,
    # então se não fechou é lead esfriado — exatamente o público da reativação.
    experimental: ["semana free", "semana grátis", "experimental"]
  # A RENOVAÇÃO, NA VOZ DESTE RAMO (ago/2026)
  #
  # Estes textos moravam no NÚCLEO e nasceram com a academia — "pergunte o que
  # ele já conseguiu que não conseguia" é ótimo para um aluno e constrangedor
  # num contrato de fornecimento. Prosa de venda no núcleo é a Lei 1 vazando,
  # e vazando no lugar mais caro: é o texto que a IA recebe como instrução.
  #
  # A ESTRUTURA continua sendo do núcleo — três janelas com ângulos diferentes
  # e o primeiro toque falando de RESULTADO, nunca de renovação. Isso não é
  # opinião de segmento: é o que separa renovar de cobrar.
  renewal:
    vencido:
      titulo: "Venceu sem contato"
      intencao: "Retome sem cobrar o atraso e sem falar de dívida. Pergunte se ele quer voltar e ofereça a condição concreta que existir no DNA — quem venceu sem conversa quase sempre só não foi lembrado."
    janelas:
      - key: resultado
        dias_antes: 60
        titulo: "Falar do resultado"
        intencao: "NÃO mencione renovação. Pergunte o que ele já consegue fazer e não conseguia quando começou — e registre a resposta. É esse texto que sustenta a conversa daqui a um mês."
      - key: continuidade
        dias_antes: 30
        titulo: "Abrir a continuidade"
        intencao: "Retome com as palavras dele o ganho que ele mesmo contou e projete o próximo ciclo de treino. A renovação entra como continuação do que já está funcionando."
        # ⚠ O CAMINHO PARA QUANDO NINGUÉM REGISTROU O GANHO — e ele é a regra
        # numa base nova, não a exceção.
        #
        # A intenção de cima depende do toque de 60 dias ter acontecido E da
        # resposta ter sido anotada. Na Be Fitness são 257 contatos com data
        # marcada e ZERO com nota. Sem esta linha, a trava anti-invenção fazia
        # a coisa certa com efeito péssimo: o motor recusava escrever para
        # TODO MUNDO, e a recepcionista via "falta fato no DNA" em cada pessoa
        # — indo procurar no DNA um fato que é do ALUNO, não da empresa.
        #
        # A saída não é afrouxar a trava nem inventar o ganho: é fazer agora a
        # pergunta que ficou para trás.
        intencao_sem_historico: "Ninguém registrou o que o treino já entregou para ele, então NÃO afirme ganho nenhum e não invente resultado. Faça agora a pergunta que ficou para trás: o que ele já consegue fazer hoje e não conseguia quando começou. Registre a resposta — e só então fale de continuidade, na conversa seguinte."
      - key: condicao
        dias_antes: 7
        titulo: "Fechar com condição concreta"
        intencao: "Data, valor e forma de pagamento, só com o que existir no DNA. Sem condição concreta o vencimento passa e vira cancelamento por inércia — que na academia é a evasão silenciosa."

# ---------------------------------------------------------------------
# AGENDA — o caso da academia é DIFERENTE dos outros segmentos
#
# Barbearia, clínica e salão agendam porque a cadeira é o recurso escasso:
# duas pessoas não ocupam a mesma hora. Academia é ACESSO LIVRE — não há
# vaga, reserva nem lotação, e o próprio DNA da Be Fitness manda nunca
# usar horário como escassez.
#
# Então por que ligar a agenda aqui? Porque o que se marca não é o
# recurso, é o COMPROMISSO. Pedir "que dia você começa?" e registrar a
# resposta reduz desistência entre o "quero" e o primeiro treino — que é
# onde o lead de academia evapora. O horário é consequência do dia, não
# uma reserva.
#
# Consequência prática: a janela é o horário de FUNCIONAMENTO inteiro
# (`availability_rules` da empresa), não uma grade de atendimento. Todo
# horário aberto é válido, porque nenhum deles está disputado.
# ---------------------------------------------------------------------
#
# `offer_by_turno` é a consequência direta disso. Como a janela é o
# funcionamento inteiro (06:30 às 22:00 na Be Fitness), oferecer a hora
# exata fazia o motor propor 6h30 da manhã para todo mundo — o primeiro
# horário livre do dia. Turno é como a pessoa responde de verdade:
# "quinta de manhã ou quinta à noite?".
scheduling:
  enabled: true
  default_duration_min: 60
  slot_step_min: 60
  min_advance_min: 120
  offer_by_turno: true
  # ⚠ NADA AQUI ESTA DISPUTADO — e esta linha existe por causa de um erro real.
  #
  # Em 20/ago o motor respondeu a uma lead: "Segunda a tarde infelizmente nao
  # temos horario livre". O fundador pegou na hora: *"se estamos abertos, entao
  # tem horario"*. E ele estava certo — o comentario logo acima ja dizia, com
  # todas as letras, que todo horario aberto e valido porque nenhum esta
  # disputado.
  #
  # A culpa era do prompt, que mandava a IA dizer "aquele já está ocupado" para
  # qualquer horário fora da lista sugerida. Numa academia isso é INVENÇÃO de
  # um fato negativo: o sistema não tem grade de atendimento para consultar.
  #
  # E negar horario e pior que errar preco: a lead desiste na hora, ninguem
  # fica sabendo, e o defeito nao aparece em tela nenhuma.
  #
  # Numa clinica ou num salao seria diferente — la o profissional atende um por
  # vez e a lista de livres E exaustiva. Por isso a chave e do SEGMENTO.
  todo_horario_aberto_vale: true

lead_sources:
  - whatsapp
  - instagram
  - facebook
  - presencial
  - indicacao
  - convenio
  - campanha
  - outro

# ---------------------------------------------------------------------
# POR QUE A PESSOA PAROU — a lista fechada de motivos de saída.
#
# ⚠ ELA EXISTE PARA PODER SOMAR. Texto livre viraria acervo que ninguém conta,
# e o que a campanha seguinte precisa é justamente "41 saíram por preço, 12
# mudaram de bairro". A frase da pessoa fica guardada ao lado, em
# `motivo_saida_texto` — a chave soma, a frase abre a conversa.
#
# ⚠ E O `o_que_fazer` NÃO É ENFEITE. Foi o fundador quem separou: *"os que
# estão morando longe, descartamos; os que falta um incentivo precisamos
# encontrar algo que o faça retornar; os que estão em outra academia, temos
# que descobrir o que fariam retornar"*. Motivo sem consequência vira relatório
# bonito que ninguém usa — cada linha aqui diz o que a lista de amanhã faz com
# aquela pessoa.
#
# ⚠ `nao_disse` EXISTE E É O MAIS IMPORTANTE DA LISTA. Sem ele, quem não
# contou o motivo fica indistinguível de quem nunca foi perguntado — e essas
# duas pessoas exigem coisas opostas: uma já respondeu, a outra ainda pode.
churn_reasons:
  - key: mudou_endereco
    label: "Mudou de endereço ou mora longe"
    o_que_fazer: "Fora do alcance. Não insistir — e é o único motivo que tira a pessoa da reativação de vez."
  - key: outra_academia
    label: "Está treinando em outro lugar"
    o_que_fazer: "Não oferecer desconto: descobrir o que a outra tem. Volta quando aquilo falhar, e a anotação é o que avisa."
  - key: preco
    label: "Preço ou dinheiro apertado"
    o_que_fazer: "É o único motivo em que condição resolve. Plano de maior compromisso tem mensalidade menor — e a isenção de adesão fala com este grupo."
  - key: tempo
    label: "Falta de tempo, mudou a rotina"
    o_que_fazer: "Falar de HORÁRIO, não de preço. Musculação é acesso livre dentro do funcionamento — quem parou por rotina não sabe disso. E o movimento mais forte não é defender a agenda: é REDUZIR O TAMANHO DO PEDIDO — propor um treino curto e eficiente para começar, aumentando conforme a rotina abrir. Quem parou por tempo não precisa de mais argumento, precisa de um compromisso menor."
  - key: saude
    label: "Lesão, gravidez ou orientação médica"
    o_que_fazer: "Não vender. Perguntar quando libera e marcar a data — insistir aqui é constrangedor e não converte."
  - key: desmotivou
    label: "Desanimou, não via resultado"
    o_que_fazer: "É acompanhamento, não desconto. Falar do professor presente e da avaliação — o que faltou foi companhia, não plano."
  - key: nao_disse
    label: "Não quis dizer"
    o_que_fazer: "Registrar assim mesmo: quem não contou é diferente de quem nunca foi perguntado, e só o primeiro já teve a chance."

# ---------------------------------------------------------------------
# SEÇÕES DE DNA
# Os FATOS da empresa. O que não estiver aqui a IA não pode afirmar.
# ---------------------------------------------------------------------
dna_sections:
  - key: pricing
    label: "Planos e valores"
    required: true
    fields:
      - { key: range,  type: money_range, required: true, label: "Faixa de valores", help: "A faixa de preço dos seus serviços. Ex.: de R$ 40 a R$ 90" }
      - { key: plans,  type: table, columns: [nome, valor, condicao, fidelidade], label: "Planos e preços", help: "Cada serviço com seu valor. Ex.: Corte — R$ 45 — 40 min" }
      - { key: payment_methods, type: list, label: "Formas de pagamento", help: "Como o cliente pode pagar. Ex.: Pix, débito, crédito em 2x" }
      # A ADESÃO É O QUE A PESSOA PERGUNTA NA HORA DE VOLTAR, e sem este campo
      # o motor não tinha onde ler a resposta: ou escalava, ou o vendedor
      # respondia de cabeça. Numa campanha de reativação é a primeira objeção
      # de quem já foi aluno — e a isenção só vale como argumento se for FATO
      # declarado, nunca simpatia inventada na hora.
      - { key: joining_fee, type: text, label: "Taxa de adesão", help: "Se existe adesão, em que plano ela entra e quem é isento. Ex.: R$ 99 só no plano recorrente; isenta para quem já foi aluno", options: ["Não cobro adesão em nenhum plano", "Só no plano recorrente, e quem já foi aluno é isento", "Só no plano recorrente, sem isenção", "Cobro adesão em todos os planos"] }
  - key: availability
    label: "Horário de funcionamento"
    required: true
    fields:
      - { key: weekly_hours, type: schedule, required: true, label: "Horário de funcionamento", help: "Os dias e horários que você atende. Ex.: Seg a Sex 9h-19h; Sáb 8h-14h" }
  - key: catalog
    label: "Modalidades e grade de aulas"
    required: true
    fields:
      - { key: items, type: table, columns: [nome, dia, hora, publico, observacao], label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: risk_free_entry
    label: "Oferta de entrada sem risco"
    fields:
      - { key: exists,   type: boolean, required: true, label: "Oferece?", help: "Marque se você oferece alguma condição especial para quem vem pela primeira vez" }
      - { key: duration, type: text, label: "Duração", help: "Quanto tempo leva. Ex.: 40 minutos", options: ["40 minutos", "1 hora", "Livre, dentro do horário de funcionamento"] }
      - { key: gift,     type: text, label: "Brinde de boas-vindas", help: "O que você oferece de cortesia. Ex.: Café e água", options: ["Café e água", "Avaliação física de cortesia", "Garrafa ou camiseta da academia", "Não ofereço brinde"] }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address,   type: text, required: true, label: "Endereço", help: "Endereço completo com ponto de referência. Ex.: Rua X, 100 - ao lado do mercado" }
      - { key: whatsapp,  type: text, label: "WhatsApp", help: "O número que o cliente usa para falar com você" }
      - { key: instagram, type: text, label: "Instagram", help: "Seu perfil. Ex.: @suaempresa" }
  - key: differentials
    label: "Diferenciais"
    fields:
      - { key: items, type: list, label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: policies
    label: "Políticas"
    fields:
      - { key: cancellation, type: text, label: "Política de cancelamento", help: "Até quando dá para desmarcar sem custo. Ex.: Até 2h antes, sem cobrança", options: ["Até 2 horas antes, sem cobrança", "Até 4 horas antes, sem cobrança", "Até 24 horas antes, sem cobrança", "Remarcando na hora, sem cobrança"] }
      - { key: partnerships, type: table, columns: [servico, profissional, valor], label: "Parcerias", help: "Parceiros que atuam no seu espaço ou que você indica" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text
    # Entra no contexto marcado como não estruturado.
    # Nunca pode ser fonte de preço, horário ou política.
  - key: reciprocity
    label: "Brindes e cortesias de adesão"
    # A categoria reciprocity precisa de um lar no DNA. Sem esta seção o
    # required_fact reciprocity.gift era caminho órfão e a entrada escalava
    # sempre — mesmo para quem tinha o brinde declarado. O DNA já a assumia.
    fields:
      - { key: gift, type: text, label: "Brinde de boas-vindas", help: "O que você oferece de cortesia. Ex.: Café e água", options: ["Garrafa de água e avaliação física", "Avaliação física de cortesia", "Camiseta da academia", "Não ofereço brinde"] }
  - key: commitment_offer
    label: "Plano que mais compensa"
    # Mesmo caso do reciprocity acima, achado em ago/2026 pelo library_check:
    # três entradas de preço citavam `commitment_offer.best_value` e a seção
    # não existia. Por estar em optional_facts, não escalava — simplesmente
    # nunca era preenchido, e o motor perdia o argumento de fidelidade.
    fields:
      - { key: best_value, type: text, label: "Plano que mais compensa", help: "Qual plano vale mais a pena e por quê. Ex.: no anual sai R$ 129/mês contra R$ 169 do mensal", options: ["O anual, porque a mensalidade cai bastante em relação ao mensal", "O semestral, que equilibra preço e compromisso", "O trimestral, para quem ainda está criando o hábito", "Depende do objetivo do aluno"] }

# ---------------------------------------------------------------------
# AS 12 CATEGORIAS CANÔNICAS
# Toda Skill preenche as mesmas doze. Nenhuma inventa categoria nova.
# ---------------------------------------------------------------------
categories:
  pricing:          "Planos e mensalidades"
  risk_free_entry:  "Semana experimental"
  availability:     "Horários"
  expertise_proof:  "Professores em todos os turnos"
  catalog:          "Musculação, ginástica, pilates, lutas, dança"
  goal_matching:    "Objetivo → modalidade ideal"
  objections:       "Caro, sem tempo, vergonha, comparação"
  commitment_offer: "Plano anual"
  reciprocity:      "Brindes de boas-vindas e de adesão"
  limits_and_ethics: "Saúde, lesões e limites do que prometer"
  retention:        "Aluno desanimado, sem resultado, renovação"
  ecosystem:        "Parceiros no espaço"

# ---------------------------------------------------------------------
# CADÊNCIAS PROATIVAS
# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             oferta_valor
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    fechamento_classico
  reciprocity:         persuasao_cialdini
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # AS QUATRO CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia "retome com um
  # ângulo novo" — a mesma frase para academia e para indústria. Eram 39 das
  # 80 etapas vivas dos 15 segmentos, e quase todas aqui, onde a venda
  # acontece.
  #
  # A régua da academia é CURTA porque o ticket é baixo e a decisão é
  # emocional: quem pesquisou academia hoje entra em outra em uma semana.
  # Nada de "só passando para saber" — cada toque entrega algo novo ou
  # encerra. Três toques e para: insistir além disso em ticket de mensalidade
  # queima o contato para a reativação, que é onde ele volta a valer.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 1, intent: "Refazer a pergunta de um jeito mais fácil de responder — uma só, fechada. Quem não respondeu não recusou: quase sempre travou na pergunta aberta demais." }
      - { offset_days: 4, intent: "Dar algo útil SEM pedir nada em troca: o horário mais vazio para quem está começando, ou como funciona a primeira vez. Reciprocidade antes de qualificação." }
      - { offset_days: 9, intent: "Encerrar com porta aberta e sem culpa — 'deixo por aqui, me chama quando for a hora'. Encerrar bem é o que permite reativar depois." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: descoberta_parada
    applies_to: qualification
    steps:
      - { offset_days: 2, intent: "Devolver o que ele JÁ contou e pedir só o pedaço que falta. Repetir a pergunta que ele ignorou é o jeito mais rápido de virar silêncio definitivo." }
      - { offset_days: 6, intent: "Trocar a pergunta por uma alternativa concreta — dois horários, dois formatos. Escolher é mais fácil que descrever." }
      - { offset_days: 12, intent: "Oferecer a experimental como caminho de menor esforço: ver é mais barato que explicar, e resolve a qualificação sozinho." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: proposta_sem_resposta
    applies_to: proposal
    steps:
      - { offset_days: 2, intent: "Confirmar que chegou e perguntar o que ficou confuso — não se a decisão saiu. Proposta parada quase sempre é dúvida não dita, não recusa." }
      - { offset_days: 5, intent: "Atacar a dúvida mais comum deste ramo sem esperar ele levantar: fidelidade, cancelamento e o que acontece se ele não conseguir vir." }
      - { offset_days: 10, intent: "Perguntar diretamente se faz sentido seguir agora ou se é melhor retomar mais para frente — e aceitar o 'mais para frente' sem insistir." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 2, intent: "Nomear a objeção que ele levantou e devolver com a informação que falta — sem repetir argumento que já não funcionou uma vez." }
      - { offset_days: 5, intent: "Checar se a objeção declarada é a real. Preço costuma ser a educada; a verdadeira é horário, vergonha de começar ou alguém em casa." }
      - { offset_days: 11, intent: "Fechar o ciclo com a alternativa de menor compromisso que existir no DNA — e se ela não existir, ESCALAR em vez de inventar condição." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: trial_followup
    applies_to: trial_followup
    steps:
      - { offset_days: 2, intent: "Realização de valor — o que já conquistou" }
      - { offset_days: 6, intent: "Projeção de futuro e pré-fechamento" }
      - { offset_days: 8, intent: "Conversão com aversão à perda" }
    stop_on: [converted, opted_out, lost]

  # OS 90 DIAS QUE DECIDEM SE O ALUNO FICA.
  #
  # Pedido do fundador, e a evidência do próprio piloto sustenta: a maior perda
  # da academia não é o lead que não fecha — é o aluno que matricula e some. O
  # objetivo de cada toque aqui é COLHER O QUE ELE JÁ CONQUISTOU, não vender
  # nada: quem verbaliza um ganho fica, e quem some no primeiro mês nunca foi
  # perguntado se estava conseguindo vir.
  #
  # Sem promessa de resultado — a `hard_rule` de saúde continua valendo aqui.
  - key: pos_matricula
    applies_to: onboarding
    steps:
      - { offset_days: 7,  intent: "Primeira semana: como foi vir, e o que já mudou na rotina" }
      - { offset_days: 30, intent: "Primeiro mês: reconhecer a frequência e ajustar o que atrapalha" }
      - { offset_days: 60, intent: "Dois meses: perguntar o que ele já consegue fazer e não conseguia" }
      - { offset_days: 90, intent: "Três meses: pedir o retrato do ganho — e a indicação, que só faz sentido depois do resultado" }
    stop_on: [opted_out, lost]

  # ⚠ A RÉGUA DO EX-ALUNO — e ela já existia aqui, sem etapa nenhuma usando.
  #
  # `rescue_inactive` estava escrita e órfã: nenhuma etapa declarava esta
  # cadência, então ela nunca disparou. Ganhou dono em ago/2026, quando
  # `ex_aluno` passou a existir. **Escrever uma segunda régua de reativação
  # teria sido o defeito de `phases` × `cadence` de novo** — a mesma coisa
  # declarada duas vezes, com as duas divergindo em silêncio.
  #
  # OS PRAZOS SÃO MAIS LARGOS QUE OS DA VENDA, e é de propósito. As outras
  # réguas daqui são curtas porque quem pesquisa academia entra em outra numa
  # semana. Quem SAIU não está nesse relógio: ele decidiu parar, e voltar é
  # decisão nova. Régua de 4 e 11 dias em cima de quem saiu é a cobrança de
  # ausência que a entrada curada proíbe na primeira linha.
  #
  # ⚠ `steps_expire: false` — E ESTA LINHA É A QUE MAIS IMPORTA.
  #
  # Por padrão um passo VENCE E EXPIRA: o toque "primeira semana" não pode
  # chegar para quem está há três anos na academia. Isso vale quando o passo
  # está preso a um EVENTO REAL (a matrícula, o início do trial).
  #
  # Reativação não tem evento nenhum: o passo 1 é "abrir por um gancho do
  # histórico dele", e isso é verdade hoje, daqui a um mês ou daqui a um ano.
  # Sem esta linha, importar 1.200 ex-alunos de uma vez faria a régua expirar
  # para a maioria antes de a ração chegar neles — e eles cairiam no aviso
  # genérico de silêncio, jogando fora a curadoria justamente na lista que ela
  # foi escrita para atender.
  - key: rescue_inactive
    applies_to: reactivation
    steps:
      - { offset_days: 0,  intent: "Gancho concreto do histórico DELE — o que treinava, o turno em que vinha. Sem oferta e sem cobrar a ausência: cobrança gera culpa, e culpa gera silêncio." }
      - { offset_days: 7,  intent: "O que MUDOU desde que ele saiu — grade, equipamento, horário, professor. Novidade é motivo para voltar; saudade não é." }
      - { offset_days: 21, intent: "Retorno sem risco, com a condição de entrada que existe no DNA. Se ela não existir, ESCALE em vez de inventar." }
      - { offset_days: 45, intent: "Encerrar com porta aberta e sem culpa — 'deixo por aqui, me chama quando fizer sentido'. Encerrar bem é o que permite tentar de novo lá na frente." }
    stop_on: [replied, converted, opted_out]
    max_attempts: 4
    steps_expire: false

# ---------------------------------------------------------------------
# REGRAS PERMANENTES DO SEGMENTO
# Declarativas e testáveis, não correção de prompt.
# ---------------------------------------------------------------------
hard_rules:
  - "Nunca afirmar horário, valor, modalidade ou serviço que não esteja no DNA."
  - "Nunca prometer resultado de saúde, cura ou emagrecimento garantido."
  - "Nunca dizer 'voltar', 'retornar' ou 'novamente' para quem nunca foi aluno."
  - "Nunca mencionar vaga, reserva ou lotação se o modelo for de acesso livre."
  - "Nunca encerrar com pergunta aberta do tipo 'o que acha?' — usar fechamento por alternativa."
  - "Uma mensagem, um objetivo. Nunca fazer três perguntas seguidas."

kpis:
  - conversion_rate       # convertidos distintos / leads do período
  - trial_rate            # trials distintos / leads do período
  - trial_conversion      # convertidos / trials distintos
  - median_response_time  # mediana, nunca média
