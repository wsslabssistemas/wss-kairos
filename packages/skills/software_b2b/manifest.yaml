cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica - a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # REGUA LONGA, DE PROPÓSITO. Rackham mediu: em ticket alto, pressão DERRUBA
  # conversão. Cada toque precisa trazer informação nova, e o intervalo
  # respeita que do outro lado existe processo interno, não humor.
  # Deste ramo: 67% do B2B prefere se servir sozinho. Cada
  # toque tem que valer sem resposta - se ele só ler, já ganhou alguma coisa.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 3, intent: "Perguntar como a empresa atende hoje, uma coisa só. A primeira mensagem qualifica, não vende." }
      - { offset_days: 8, intent: "Mandar algo que vale mesmo sem resposta - o número que ele consegue conferir sozinho na própria operação." }
      - { offset_days: 18, intent: "Encerrar com porta aberta e sem cobrança. Comprador B2B que se sentiu perseguido não volta nem quando precisa." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: descoberta_parada
    applies_to: qualification
    steps:
      - { offset_days: 3, intent: "Confirmar só volume de atendimento e quem responde hoje - sem isso o preço não tem como estar certo." }
      - { offset_days: 8, intent: "Trazer o padrão que se vê em operacoes do porte dele, e perguntar se bate. Comparar e mais fácil que descrever." }
      - { offset_days: 18, intent: "Perguntar se o assunto segue em pe neste trimestre e registrar a resposta." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: proposta_sem_resposta
    applies_to: proposal
    steps:
      - { offset_days: 3, intent: "Confirmar que chegou e perguntar o que ficou aberto - não se decidiram. Proposta parada em B2B quase sempre e aprovação interna." }
      - { offset_days: 8, intent: "Oferecer o que destrava aprovação: número do teste dele, prazo de implantacao e o que acontece se quiser sair." }
      - { offset_days: 18, intent: "Perguntar em que etapa interna esta e quem mais precisa ver. Ajudar a passar pelo processo vale mais que insistir na decisão." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 3, intent: "Nomear o que trava e responder com o fato que falta - verba, contrato, ou medo da equipe não usar." }
      - { offset_days: 8, intent: "Tratar o risco real de software B2B: adocao. Quem já comprou ferramenta que ninguém usou tem medo disso, não do preço." }
      - { offset_days: 18, intent: "Oferecer o menor começo possível que existir no DNA; se não existir, ESCALAR em vez de inventar condição." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: pos_demo
    applies_to: proposal_followup
    steps:
      - { offset_days: 2, intent: "Confirmar o que ficou claro e o que não ficou" }
      - { offset_days: 5, intent: "Tratar o travamento real (equipe, verba, quem assina)" }
      - { offset_days: 10, intent: "Perguntar o que falta para começar — e aceitar o não" }
    stop_on: [converted, opted_out, lost]

  # A CADÊNCIA QUE DECIDE A VENDA. Trial sem uso não vira assinatura, e o
  # silêncio no teste é o sinal de perda mais confiável do segmento — ele
  # aparece antes de qualquer objeção ser dita.
  - key: acompanhamento_teste
    applies_to: trial_followup
    steps:
      - { offset_days: 1, intent: "Ajudar a responder o PRIMEIRO atendimento de verdade" }
      - { offset_days: 3, intent: "Conferir se o cadastro travou em algum ponto" }
      - { offset_days: 7, intent: "Mostrar o que já aconteceu na conta dele, com número" }
      - { offset_days: 12, intent: "Reta final: o que muda quando o teste acabar" }
    stop_on: [converted, opted_out, lost]

  - key: acompanhamento
    applies_to: onboarding
    steps:
      - { offset_days: 30, intent: "Primeiro mês: o que a conta dele mostra que antes não existia" }
      - { offset_days: 90, intent: "Trimestre: onde ainda vaza, e qual módulo resolve" }
    stop_on: [opted_out, lost]

  - key: retomada
    applies_to: reactivation
    steps:
      - { offset_days: 45, intent: "Voltar com o que mudou no produto sobre o motivo dele ter saído" }
      - { offset_days: 120, intent: "Segundo toque, com caso parecido com o dele" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 3

hard_rules:
  - "Nunca prometer integração, módulo ou recurso que não esteja no DNA. Roadmap não é produto, e prometer roadmap é vender o que não existe."
  - "Nunca prometer resultado comercial do cliente — mais vendas, percentual de conversão, faturamento. Não controlamos o funil dele."
  - "Nunca dizer que a IA atende sozinha ou substitui o vendedor. Ela redige e explica a técnica; quem envia é gente."
  - "Nunca afirmar envio automático por WhatsApp sem o campo de integração confirmar. Hoje a inteligência é nossa e o envio é humano."
  - "Nunca omitir o que o produto NÃO faz quando o cliente pergunta por algo que ele não resolve."
  - "Nunca afirmar prazo de implantação, política de dados ou regra de cancelamento fora do que está no DNA."

