key: software_b2b
name: Software para PME
version: 1.0.0

# =====================================================================
# A Skill com que a WSS Labs vende a WSS Labs.
#
# ELA PASSA NO NOSSO PRÓPRIO CRITÉRIO — o mesmo que descartou imobiliária:
# os fatos que governam a resposta são DA EMPRESA, poucos e estáveis
# (preço, o que cada módulo faz, o que o teste inclui, prazo de
# implantação, o que o produto NÃO faz), e o gargalo é inteiramente de
# conversa: não existe inventário para administrar.
#
# E TEM UMA CONSEQUÊNCIA QUE VALE MAIS QUE O MÓDULO: somos obrigados a
# usar o que vendemos, todo dia, com dinheiro real em jogo. Nenhum outro
# mecanismo encontra tanto defeito tão rápido.
#
# COBERTURA CONFERIDA ANTES DE ESCREVER, contra as 262 entradas das 14
# bibliotecas: `automacao` e `indústria` são B2B, mas de equipamento e
# material. Nenhuma das 262 fala de planilha como concorrente, medo de
# adoção pela equipe, teste grátis, LGPD e posse do dado, implantação,
# "é mais um sistema?" ou "a IA vai responder pelo meu cliente?".
#
# O QUE MUDA TUDO NESTE SEGMENTO: **o concorrente é o jeito de hoje.**
# Não é outro software — é o WhatsApp pessoal, a planilha e a memória do
# dono. Isso inverte a venda: o trabalho não é ganhar de um produto, é
# tornar visível um custo que a pessoa já paga e não enxerga (o orçamento
# que não recebeu segunda mensagem).
# =====================================================================

# B2B frio com dado público é permitido — é a única frente de prospecção
# que a casa aceita, e é exatamente esta.
capabilities: [prospeccao]

vocabulary:
  lead: "interessado"
  conversion: "assinatura"
  churn: "cancelamento"
  catalog_item: "módulo"

discovery_axis: "como a empresa atende HOJE — quem responde, por onde, e o que acontece quando ninguém responde"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Descobrir com quem se está falando e como a empresa atende hoje. A primeira mensagem NÃO vende — qualifica."
    - key: descoberta
      label: "Descoberta"
      cadence: descoberta_parada
      goal: "Volume de atendimento, quem responde, onde o funil vaza e quem decide. Sem isso, o preço não tem como estar certo."
    - key: demonstracao
      label: "Demonstração"
      cadence: pos_demo
      goal: "Mostrar o produto respondendo uma mensagem REAL da empresa dele. Demo genérica não vende software para PME."
      phases:
        - { key: agendada,  label: "Demo agendada",       offset_days: 0 }
        - { key: lembrete,  label: "Confirmar véspera",   offset_days: -1 }
        - { key: pos_demo,  label: "Retorno pós-demo",    offset_days: 2 }
    # O TESTE É A ETAPA QUE DEFINE ESTE SEGMENTO, e é onde a venda morre
    # calada. Software para PME não se perde na proposta: se perde no
    # trial que ninguém usou. Por isso ela tem cadência própria e NÃO é
    # terminal — o motor precisa alcançar quem está testando.
    - key: teste
      label: "Em teste"
      cadence: acompanhamento_teste
      goal: "Fazer a empresa USAR. Trial sem uso não vira assinatura, e o silêncio no trial é o sinal mais confiável de perda."
      phases:
        - { key: dia_1,  label: "Primeiro atendimento",     offset_days: 1 }
        - { key: dia_3,  label: "Passou pelo primeiro uso", offset_days: 3 }
        - { key: dia_7,  label: "Primeira semana",          offset_days: 7 }
        - { key: dia_12, label: "Reta final do teste",      offset_days: 12 }
    - key: proposta
      label: "Proposta"
      cadence: proposta_sem_resposta
      goal: "Preço pelo volume real observado no teste, não pela tabela. O número que ele viu funcionar é o argumento."
    - key: negociacao
      label: "Negociação"
      cadence: negociacao_travada
      goal: "Isolar o que trava — verba, quem assina, medo da equipe não usar — e viabilizar o começo."
    # ASSINANTE É `won` E NÃO É TERMINAL: em software a receita se perde
    # DEPOIS da venda. Cancelamento é o último passo, e ele avisa antes —
    # queda de uso vem semanas antes do pedido.
    - key: assinante
      label: "Assinante"
      won: true
      cadence: acompanhamento
      goal: "Assinou. Daqui em diante o jogo é uso, não venda: quem para de usar cancela, e quem usa indica."
    - key: cancelado
      label: "Cancelado"
      cadence: retomada
      goal: "Saiu. Não é terminal de propósito — quem já usou é o lead mais barato que existe, e o motivo do cancelamento costuma ter conserto."
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisão.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SETOR
# NÃO são fatos da empresa — o motor nunca afirma isto ao cliente; só o
# DNA vale. São o terreno em que esta venda acontece.
# ---------------------------------------------------------------------
benchmarks:
  o_concorrente_e_o_jeito_de_hoje: >-
    Mais de 60% das PMEs brasileiras não usam CRM estruturado. O que
    disputamos não é a preferência entre dois sistemas: é a inércia de um
    jeito que já funciona "mais ou menos" e que não tem custo visível. Por
    isso a venda começa tornando visível o que já se perde, e não listando
    funcionalidade.
  o_buraco_e_o_followup: >-
    Em serviços técnicos, mais de 70% dos orçamentos nunca recebem uma
    segunda mensagem. É o número mais útil desta venda porque o cliente
    reconhece o próprio comportamento nele — e porque é a coisa que o
    produto conserta primeiro.
  o_segundo_sistema_perde: >-
    Regra da própria casa: quando o produto vira o SEGUNDO lugar onde a
    pessoa digita a mesma coisa, ele é abandonado. Se o cliente já tem um
    sistema que resolve a operação dele, a conversa honesta é sobre o que
    falta ali (técnica de venda, follow-up), não sobre substituir.
  o_gargalo_e_o_onboarding: >-
    O produto não morre por falta de recurso: morre no cadastro que
    ninguém terminou. Empresa sem DNA preenchido não tem produto — o motor
    escala em tudo e a pessoa conclui que "a IA não sabe nada". Por isso a
    implantação é assunto de VENDA, não de suporte.
  trial_sem_uso_nao_converte: >-
    O silêncio durante o teste é o sinal de perda mais confiável do
    segmento, e ele acontece antes de qualquer objeção ser dita. Trial
    longo sem acompanhamento é trial que expira sozinho.
  quem_atende_nao_e_quem_decide: >-
    Em micro e pequena empresa o número público costuma ser do dono ou de
    quem fala por ele — o porteiro existe mais em empresa média. Ainda
    assim, não se contorna: pergunta-se, no primeiro contato. Descobrir
    depois da proposta pronta é tarde demais.

contact_fields:
  - key: porte
    label: "Tamanho da equipe"
    type: enum
    options: [mei_ou_sozinho, ate_5, de_6_a_20, mais_de_20, indefinido]
  - key: como_atende_hoje
    label: "Como atende hoje"
    type: enum
    options: [whatsapp_pessoal, planilha, caderno_ou_memoria, ja_tem_crm, outro_sistema, indefinido]
  - key: volume_atendimentos
    label: "Atendimentos por mês"
    type: enum
    options: [ate_50, de_51_a_200, de_201_a_500, mais_de_500, indefinido]
  - key: gargalo
    label: "Onde perde venda hoje"
    type: enum
    options: [demora_para_responder, sem_followup, sem_padrao_de_resposta, sem_visibilidade, equipe_nova, indefinido]

  # QUALIFICAÇÃO DE COMPRA (MEDDIC-lite). B2B com processo de compra, mesmo
  # que curto: em PME o comitê é o sócio, e ele decide junto.
  # Chaves e opções são CANÔNICAS (validadas pelo skill-loader).
  - key: verba
    label: "Como pretende pagar"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Quem decide junto"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem puxa a decisão lá dentro"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

scheduling:
  enabled: true
  default_duration_min: 30
  slot_step_min: 30
  min_advance_min: 120

# A receita é assinatura recorrente, não atendimento executado e repetido.
services:
  enabled: false

# ---------------------------------------------------------------------
# VIGÊNCIA DE CONTRATO
# Liga início/vencimento no cadastro e as TRÊS janelas de renovação
# (`lib/renovacao.ts`): 60 dias falando do RESULTADO — sem mencionar
# renovação —, 30 abrindo a continuidade e 7 com a condição concreta.
# Contato único no vencimento chega quando a pessoa já decidiu, e vira
# negociação de preço sob pressão de prazo.
# ---------------------------------------------------------------------
contract:
  enabled: true
  label: "Assinatura"
  # A RENOVAÇÃO, NA VOZ DESTE RAMO (ago/2026)
  #
  # Estes textos moravam no NÚCLEO e nasceram com a academia — "pergunte o que
  # ele já conseguiu que não conseguia" é ótimo para um aluno e constrangedor
  # num contrato de fornecimento. Prosa de venda no núcleo é a Lei 1 vazando,
  # e vazando no lugar mais caro: é o texto que a IA recebe como instrução.
  #
  # A ESTRUTURA continua sendo do núcleo — três janelas com ângulos diferentes
  # e o primeiro toque falando de RESULTADO, nunca de renovação. Isso não é
  # opinião de segmento: é o que separa renovar de cobrar.
  renewal:
    vencido:
      titulo: "Assinatura venceu sem renovação"
      intencao: "Retome sem cobrança e pergunte o que mudou na operação. Assinatura B2B que vence em silêncio quase sempre é troca de responsável ou corte de orçamento — descobrir qual muda a conversa inteira."
    janelas:
      - key: resultado
        dias_antes: 60
        titulo: "Mostrar o número que ele conseguiu"
        intencao: "NÃO mencione renovação. Traga o número da operação DELE — atendimentos, tempo de resposta, o que a equipe usou — e pergunte se bate com o que ele percebe. Dado próprio é o único argumento que não se discute."
      - key: continuidade
        dias_antes: 30
        titulo: "Abrir o próximo ciclo com quem assina"
        intencao: "Retome o número e descubra se quem assina é a mesma pessoa. Em B2B a renovação morre quando chega só a quem usa; o orçamento está em outra mesa."
      - key: condicao
        dias_antes: 7
        titulo: "Fechar condição e caminho de aprovação"
        intencao: "Valor, prazo e o que a área de compras precisa, com o que existir no DNA. Ajudar a passar pelo processo interno vale mais que insistir na decisão."

lead_sources:
  - whatsapp
  - instagram
  - indicacao
  - prospeccao
  - site
  - evento
  - facebook
  - campanha
  - outro

dna_sections:
  - key: produto
    label: "O produto"
    required: true
    fields:
      - { key: o_que_e, type: text, required: true, label: "O que é, em uma frase", help: "Como você explica o produto para quem nunca ouviu falar. Sem jargão", options: ["Um sistema que responde o cliente com técnica de venda do seu ramo", "Uma ferramenta que organiza o atendimento e cobra o follow-up", "Um assistente que ajuda o vendedor a responder melhor", "Um sistema de acompanhamento comercial para PME"] }
      - { key: para_quem, type: text, required: true, label: "Para quem serve", help: "Que tipo de empresa tira proveito, e a partir de que tamanho", options: ["Pequena e média empresa que atende por WhatsApp", "Empresa a partir de um vendedor", "Empresa com equipe comercial de 2 a 10 pessoas", "Qualquer negócio que perca venda por falta de follow-up"] }
      - { key: modulos, type: table, required: true, columns: [modulo, o_que_faz, incluso], label: "Módulos", help: "Cada módulo, o que ele faz e se está incluso ou é à parte" }
      - { key: o_que_nao_faz, type: list, required: true, label: "O que o produto NÃO faz", help: "A lista mais importante do cadastro. Sem ela o motor não consegue recusar, e prometer o que não existe é o jeito mais rápido de perder um cliente pagante" }
  - key: pricing
    label: "Preço e cobrança"
    required: true
    fields:
      - { key: modelo, type: text, required: true, label: "Como cobra", help: "Por atendimento, por empresa, por usuário. Escreva do jeito que o cliente entende", options: ["Por atendimento respondido, não por usuário", "Mensalidade fixa por empresa", "Por usuário", "Mensalidade com faixa de uso incluída"] }
      - { key: range, type: money_range, required: true, label: "Faixa de mensalidade", help: "A faixa real, do menor ao maior plano" }
      - { key: o_que_conta, type: text, required: true, label: "O que conta como atendimento", help: "A definição exata. É o que evita briga na primeira fatura", options: ["Cada resposta gerada com IA", "Cada conversa atendida", "Cada mensagem enviada", "Uso ilimitado dentro do plano"] }
      - { key: modulos_a_parte, type: text, label: "Módulos cobrados à parte", help: "Quais custam além da mensalidade e quanto", options: ["Não tenho módulos à parte", "Alguns módulos são cobrados à parte", "Tudo incluso no plano", "Depende do plano contratado"] }
      - { key: formas_pagamento, type: list, label: "Formas de pagamento", help: "Como o cliente pode pagar" }
      - { key: implantacao_custa, type: text, label: "Implantação custa?", help: "Tem taxa de implantação ou setup? Quanto", options: ["Sem taxa de implantação", "Taxa de implantação cobrada uma vez", "Implantação incluída no primeiro pagamento", "Depende do porte da empresa"] }
  - key: teste
    label: "Teste grátis"
    required: true
    fields:
      - { key: oferece, type: boolean, required: true, label: "Oferece teste?", help: "Marque se existe período de teste" }
      - { key: duracao, type: text, required: true, label: "Duração", help: "Quantos dias dura o teste", options: ["30 minutos", "45 minutos", "1 hora", "Varia por serviço"] }
      - { key: o_que_inclui, type: text, required: true, label: "O que inclui", help: "Tudo liberado ou parte? Quais módulos entram no teste", options: ["Tudo liberado durante o teste", "O núcleo liberado; módulos à parte não entram", "Parte dos módulos, para demonstração", "Tudo liberado, com limite de uso"] }
      - { key: precisa_cartao, type: boolean, label: "Pede cartão?", help: "Marque se o teste exige cartão de crédito" }
      - { key: o_que_acontece_depois, type: text, required: true, label: "O que acontece ao fim do teste", help: "O acesso para, vira plano pago, ou continua limitado? Diga na venda, não no dia", options: ["A geração com IA para; os dados continuam e o modo manual segue", "O acesso fecha, e os dados ficam guardados", "Vira plano pago automaticamente", "Continua limitado, sem prazo"] }
  - key: implantacao
    label: "Implantação"
    required: true
    fields:
      - { key: prazo, type: text, required: true, label: "Prazo até estar usando", help: "Quanto tempo entre o sim e o primeiro atendimento respondido pelo sistema", options: ["No mesmo dia", "Em até 3 dias", "Em até 1 semana", "Depende de a empresa preencher os próprios dados"] }
      - { key: o_que_o_cliente_faz, type: text, required: true, label: "O que a empresa precisa fazer", help: "O trabalho que é DELE. Esconder isso é o que faz o cadastro parar pela metade", options: ["Preencher os fatos da empresa: preços, prazos e políticas", "Preencher os dados e importar a base de contatos", "Só importar os contatos", "Nada — fazemos tudo"] }
      - { key: quem_faz, type: text, label: "Quem faz", help: "Você faz junto, ele faz sozinho, ou tem alguém dedicado", options: ["Faço junto, numa chamada", "O cliente faz sozinho, com o guia", "Tenho alguém dedicado à implantação", "Faço junto no início e ele segue sozinho"] }
      - { key: treinamento, type: text, label: "Treinamento da equipe", help: "Como a equipe aprende a usar, e quanto tempo leva", options: ["Tutorial dentro do sistema", "Uma chamada de apresentação com a equipe", "Curso próprio dentro do produto", "Material escrito e vídeos"] }
  - key: dados
    label: "Dados, LGPD e saída"
    required: true
    fields:
      - { key: onde_ficam, type: text, required: true, label: "Onde ficam os dados", help: "Provedor, país e o que isso significa na prática", options: ["Banco gerenciado, com isolamento por empresa", "Servidor no Brasil", "Servidor fora do Brasil, com conformidade declarada", "Nuvem, com backup diário"] }
      - { key: quem_ve, type: text, required: true, label: "Quem consegue ver", help: "Quem, dentro da sua empresa, tem acesso ao dado do cliente — e em que situação", options: ["Só quem a própria empresa autoriza", "Nossa equipe vê consumo e custo, não o conteúdo", "Nossa equipe acessa só a pedido, para suporte", "Ninguém da nossa equipe acessa"] }
      - { key: exportacao, type: text, required: true, label: "Consegue levar embora?", help: "O cliente exporta os dados dele? Em que formato e quando", options: ["O cliente exporta os dados em planilha, quando quiser", "Exportação sob pedido, em até alguns dias", "Exportação completa no cancelamento", "Não há exportação"] }
      - { key: se_cancelar, type: text, required: true, label: "O que acontece se cancelar", help: "Por quanto tempo o dado fica, o que é apagado e como se pede", options: ["Os dados ficam guardados por um período e depois são apagados", "Apago tudo assim que o cliente pedir", "Os dados ficam disponíveis para exportação por um prazo", "Guardo apenas o exigido por lei"] }
  - key: contrato
    label: "Contrato"
    fields:
      - { key: fidelidade, type: text, label: "Fidelidade", help: "Prende por quanto tempo? Escreva 'não tem' se não houver", options: ["Não tem fidelidade", "Contrato de 12 meses", "Desconto para quem assina 12 meses", "Mensal, cancela quando quiser"] }
      - { key: cancelamento, type: text, label: "Como cancela", help: "O caminho real do cancelamento e o aviso prévio", options: ["Até 2 horas antes, sem cobrança", "Até 24 horas antes, sem cobrança", "Até 48 horas antes, sem cobrança", "Remarcando na hora, sem cobrança"] }
      - { key: reajuste, type: text, label: "Reajuste", help: "Quando e por qual índice", options: ["Reajuste anual pelo IPCA", "Reajuste anual, avisado com antecedência", "Sem reajuste no primeiro ano", "Preço fixo enquanto durar o contrato"] }
  - key: integracoes
    label: "Integrações"
    fields:
      - { key: quais, type: list, label: "O que integra hoje", help: "Só o que já funciona. Roadmap não entra aqui" }
      - { key: whatsapp, type: text, label: "WhatsApp", help: "Como funciona hoje, com honestidade: envio automático ou copiar e colar" }
      - { key: importacao, type: text, label: "Importar dados existentes", help: "O que dá para trazer de planilha ou de outro sistema, e o que não dá", options: ["Importo contatos de planilha", "Importo contatos e histórico de planilha", "Importo de outro sistema, quando há exportação", "Não importo — o cliente começa do zero"] }
      - { key: o_que_nao_integra, type: list, label: "O que NÃO integra", help: "Os pedidos que você recebe e não atende. Dizer cedo economiza a venda errada" }
  - key: prova
    label: "Prova"
    fields:
      - { key: tempo_de_mercado, type: text, label: "Tempo de mercado", help: "Há quanto tempo existe e quantas empresas usam", options: ["Menos de 2 anos", "2 a 5 anos", "5 a 10 anos", "10 a 20 anos", "Mais de 20 anos"] }
      - { key: casos, type: text, label: "Casos", help: "O que empresas concretas conseguiram, com autorização. Número medido, nunca estimado", options: ["Tenho casos com número medido e autorização", "Tenho casos, mas ainda sem autorização para citar", "Estou com o primeiro cliente", "Ainda não tenho casos"] }
      - { key: segmentos_atendidos, type: list, label: "Segmentos atendidos", help: "Os ramos que já têm biblioteca pronta" }

  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

categories:
  pricing:            "Mensalidade, o que conta como atendimento e implantação"
  risk_free_entry:    "Teste grátis: o que inclui e o que acontece depois"
  availability:       "Prazo de implantação e agenda de demonstração"
  expertise_proof:    "Quem somos, quem já usa e o que é medido"
  catalog:            "Módulos e o que cada um faz"
  goal_matching:      "Como a empresa atende hoje → o que resolve o gargalo dela"
  objections:         "Já tenho sistema, a equipe não vai usar, está caro, é mais um sistema"
  commitment_offer:   "Contrato, fidelidade, cancelamento e o adiamento"
  reciprocity:        "Indicação entre donos e implantação cortesia"
  limits_and_ethics:  "LGPD, posse do dado e o que o produto NÃO faz"
  retention:          "Quem parou de usar, quem cancelou e o próximo módulo"
  ecosystem:          "Integrações, WhatsApp e importação"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA
#
# `objections` é `challenger` e NÃO `negociacao_voss` como em quase todo
# lugar — é o único segmento da casa em que isso acontece, e o motivo é o
# `benchmarks.o_concorrente_e_o_jeito_de_hoje`: aqui não há um preço a
# negociar, há um custo invisível a tornar visível. Voss desarma quem já
# tem posição; Challenger é para quem ainda não sabe que tem problema.
#
# `commitment_offer` é `indecisao_jolt`: dono de PME que concordou e não
# assina não discorda do produto — ele tem medo de mais um sistema
# abandonado. Repetir o argumento é o movimento que piora o desfecho.
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          challenger
