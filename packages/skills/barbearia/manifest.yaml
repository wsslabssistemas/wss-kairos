key: barbearia
name: Barbearia
version: 1.0.0

# Modulos do segmento. B2C local nao faz prospeccao fria de pessoas (LGPD).
capabilities: []

# =====================================================================
# A PROVA DA TESE DO COS
#
# Compare este arquivo com o da academia. Mesma estrutura, mesmas 12
# categorias, mesmo motor. Muda só o conteúdo.
#
# Se lançar uma barbearia exigir UMA linha de código nova, a promessa
# de "um cérebro, várias especializações" está quebrada.
# =====================================================================

vocabulary:
  lead: "cliente em potencial"
  conversion: "primeiro agendamento"
  churn: "cliente que parou de voltar"
  catalog_item: "serviço"

discovery_axis: "ocasião e frequência (rotina, evento, manutenção)"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Descobrir o que a pessoa procura e para quando."
    - key: descoberta
      label: "Descoberta"
      cadence: descoberta_parada
      goal: "Entender serviço desejado, urgência e preferência de profissional."
    - key: proposta
      label: "Proposta"
      cadence: proposta_sem_resposta
      goal: "Indicar serviço e horário disponível."
    - key: agendado
      label: "Agendado"
      cadence: appointment_confirm
      goal: "Confirmar presença e reduzir falta."
      phases:
        - { key: confirmado,  label: "Confirmado",   offset_days: 0 }
        - { key: lembrete,    label: "Lembrete",     offset_days: 1 }
        - { key: pos_servico, label: "Pós-serviço",  offset_days: 1 }
    - key: recorrente
      label: "Cliente recorrente"
      terminal: true
      # Aqui a conquista É a recorrência. Sem `won`, o funil não mostrava
      # conversão nenhuma e a carteira ficava fora da lista de recompra.
      won: true
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisao.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

# ---------------------------------------------------------------------
# CAMPOS PRÓPRIOS DO SEGMENTO
# O negócio é RECORRÊNCIA: o cliente fiel volta a cada ~21 dias e rende
# 17 a 24 visitas por ano. Por isso os campos abaixo existem — eles são o
# que permite calcular QUANDO chamar de volta, e não esperar o cliente
# lembrar sozinho. Barbearia com retorno programado retém muito mais.
# ---------------------------------------------------------------------
contact_fields:
  - key: servico_preferido
    label: "Serviço preferido"
    type: enum
    options: [corte, barba, corte_e_barba, coloracao, tratamento, infantil]
  # Define o intervalo do retorno. Degradê curto pede 2 semanas; corte médio
  # com barba, 3 a 4 semanas.
  - key: frequencia
    label: "Frequência"
    type: enum
    options: [semanal, quinzenal, tres_semanas, mensal, bimestral, esporadico]
  - key: dia_preferido
    label: "Dia que costuma vir"
    type: enum
    options: [segunda, terca, quarta, quinta, sexta, sabado, sem_preferencia]
  - key: turno_preferido
    label: "Turno preferido"
    type: enum
    options: [manha, tarde, noite, sem_preferencia]
  - key: profissional_preferido
    label: "Barbeiro preferido"
    type: enum
    options: [sem_preferencia, definido]
  # Por que ele viria mais vezes — a alavanca de frequência de cada cliente.
  - key: gatilho_retorno
    label: "O que o traria mais vezes"
    type: enum
    options:
      [horario_facil, preco_pacote, barba_junto, atendimento_rapido,
       ambiente, produto_domicilio, indefinido]

# ---------------------------------------------------------------------
# RECORRÊNCIA
# O núcleo sabe calcular "quando chamar de volta"; QUAIS campos usar e
# quantos dias cada frequência vale é dado do segmento (Lei 1).
# Referência de mercado: fiel volta a cada ~21 dias; o lembrete funciona
# quando sai alguns dias ANTES do ciclo fechar.
# ---------------------------------------------------------------------
recurrence:
  # O QUE DIZER NO TOQUE DE RECOMPRA, na voz deste ramo. Estava no núcleo,
  # servindo igual para o corte de 21 dias e para a reposição de estoque —
  # hábito pessoal de um lado, ruptura de prateleira do outro.
  intent: "Está no ponto do próximo corte. Ofereça dia e horário concretos com o profissional de preferência dele — recompra de barbearia se perde para a agenda, não para o preço."
  frequency_field: frequencia
  preferred_day_field: dia_preferido
  remind_before_days: 3
  intervals_days:
    semanal: 7
    quinzenal: 15
    tres_semanas: 21
    mensal: 30
    bimestral: 60
  default_days: 21

# ---------------------------------------------------------------------
# REFERÊNCIAS DO SEGMENTO (pesquisa de mercado, jul/2026)
# Servem de parâmetro para o gestor comparar a própria operação. NÃO são
# fatos da empresa — o motor nunca afirma isto ao cliente, só o DNA vale.
# ---------------------------------------------------------------------
benchmarks:
  visitas_ano_cliente_fiel: "17 a 24"
  intervalo_medio_dias: 21
  ticket_medio_faixa: "R$ 50 a R$ 80"
  atendimentos_dia_por_cadeira: "10 a 15"
  duracao_servico_min: "30 a 45"
  faturamento_mes_por_cadeira: "R$ 13.000 a R$ 20.000"
  comissao_profissional: "40% a 50%"
  raio_captacao_km: "3 a 5"
  observacao_gargalo: >-
    O maior gargalo é a ociosidade: cada furo de 45 min na agenda é receita que
    não volta. Lembrete automático (e sinal antecipado) reduz drasticamente a
    falta.

# ---------------------------------------------------------------------
# AGENDAMENTO
# O motor só consegue fechar horário se souber o que está livre. Aqui o
# segmento declara que trabalha com hora marcada e quanto dura o serviço.
# Pesquisa do ramo: serviço leva 30 a 45 min.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 40
  slot_step_min: 30
  min_advance_min: 60

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
services:
  enabled: true
  label: "Atendimentos"
  item_label: "Serviço"

lead_sources:
  - whatsapp
  - instagram
  - presencial
  - indicacao
  - google
  - campanha
  - site
  - facebook
  - outro

dna_sections:
  - key: pricing
    label: "Tabela de serviços"
    required: true
    fields:
      - { key: range, type: money_range, required: true, label: "Faixa de valores", help: "A faixa de preço dos seus serviços. Ex.: de R$ 40 a R$ 90" }
      - { key: plans, type: table, columns: [servico, valor, duracao], label: "Planos e preços", help: "Cada serviço com seu valor. Ex.: Corte — R$ 45 — 40 min" }
      - { key: payment_methods, type: list, label: "Formas de pagamento", help: "Como o cliente pode pagar. Ex.: Pix, débito, crédito em 2x" }
  - key: availability
    label: "Horário e agenda"
    required: true
    fields:
      - { key: weekly_hours,  type: schedule, required: true, label: "Horário de funcionamento", help: "Os dias e horários que você atende. Ex.: Seg a Sex 9h-19h; Sáb 8h-14h" }
      - { key: booking_rule,  type: text, label: "Como agendar", help: "Precisa marcar antes ou atende por ordem de chegada? Ex.: Só com hora marcada", options: ["Só com hora marcada", "Ordem de chegada", "Hora marcada, e encaixo quem chega", "Hora marcada no pico, chegada livre no resto"] }
  - key: catalog
    label: "Serviços oferecidos"
    required: true
    fields:
      - { key: items, type: table, columns: [nome, duracao, profissional, observacao], label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: risk_free_entry
    label: "Oferta de entrada"
    fields:
      - { key: exists, type: boolean, required: true, label: "Oferece?", help: "Marque se você oferece alguma condição especial para quem vem pela primeira vez" }
      - { key: offer,  type: text, label: "Qual é a oferta", help: "Descreva a condição de primeira visita. Ex.: Primeiro corte com 20% de desconto", options: ["Desconto no primeiro corte", "Um serviço de cortesia junto do primeiro corte", "Não tenho condição de primeira visita", "Cortesia simples de boas-vindas, sem desconto"] }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address,   type: text, required: true, label: "Endereço", help: "Endereço completo com ponto de referência. Ex.: Rua X, 100 - ao lado do mercado" }
      - { key: whatsapp,  type: text, label: "WhatsApp", help: "O número que o cliente usa para falar com você" }
      - { key: instagram, type: text, label: "Instagram", help: "Seu perfil. Ex.: @suaempresa" }
  - key: differentials
    label: "Diferenciais"
    fields:
      - { key: items, type: list, label: "Itens", help: "Liste o que você oferece. O sistema só pode falar do que estiver aqui" }
  - key: policies
    label: "Políticas"
    fields:
      - { key: no_show,      type: text, label: "Política de falta", help: "O que acontece quando o cliente falta sem avisar. Ex.: Cobramos 50% na próxima", options: ["Cobro parte do valor na falta sem aviso", "Não cobro, mas o próximo horário fica sujeito a disponibilidade", "Duas faltas sem aviso e passo a exigir sinal", "Não tenho política formal de falta"] }
      - { key: cancellation, type: text, label: "Política de cancelamento", help: "Até quando dá para desmarcar sem custo. Ex.: Até 2h antes, sem cobrança", options: ["Até 2 horas antes, sem cobrança", "Até o dia anterior, sem cobrança", "Remarcando na hora, sem cobrança", "Cobro parte quando a falta é sem aviso"] }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

# As mesmas 12 categorias canônicas, outro conteúdo
categories:
  pricing:          "Tabela de serviços"
  risk_free_entry:  "Primeira visita promocional"
  availability:     "Agenda e horários"
  expertise_proof:  "Barbeiro especialista e portfólio"
  catalog:          "Corte, barba, coloração, tratamentos"
  goal_matching:    "Tipo de cabelo e ocasião → serviço ideal"
  objections:       "Caro, sem tempo, receio de mudar de barbeiro"
  commitment_offer: "Pacote de sessões / plano de assinatura"
  reciprocity:      "Brinde, bebida cortesia, desconto na indicação"
  limits_and_ethics: "Não prometer resultado de coloração ou tratamento"
  retention:        "Cliente que não volta há X semanas"
  ecosystem:        "Produtos revendidos e parceiros"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             oferta_valor
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    fechamento_classico
  reciprocity:         persuasao_cialdini
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência declarada, o núcleo escrevia a
  # própria frase genérica — a mesma para todo ramo. Eram 39 das 80 etapas
  # vivas dos 15 segmentos, e quase todas aqui, onde a venda acontece.
  #
  # A régua abaixo é deste ramo: ciclo curto e decisão de impulso. Quem
  # perguntou de corte hoje cortou em outro lugar em uma semana — insistir
  # depois disso não recupera, só irrita.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 1, intent: "Oferecer horário concreto em vez de perguntar de novo. Quem chamou barbearia quer marcar, não conversar — a pergunta aberta é o que trava." }
      - { offset_days: 3, intent: "Dar a alternativa que ele não pediu: outro dia, outro profissional, ou o horário vazio que ninguém disputa." }
      - { offset_days: 7, intent: "Encerrar leve, com a porta aberta para quando precisar. Depois de uma semana ele já cortou em outro lugar." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: descoberta_parada
    applies_to: qualification
    steps:
      - { offset_days: 1, intent: "Fechar a escolha em duas opções concretas de serviço e horário. Descrever o que quer é mais difícil que escolher." }
      - { offset_days: 3, intent: "Perguntar pela ocasião — casamento, entrevista, viagem. A data dele resolve a agenda melhor que qualquer pergunta técnica." }
      - { offset_days: 7, intent: "Encerrar sem cobrança, deixando o canal aberto." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: proposta_sem_resposta
    applies_to: proposal
    steps:
      - { offset_days: 1, intent: "Confirmar o horário oferecido antes que ele caia. Vaga é perecível e dizer isso é fato, não pressão." }
      - { offset_days: 3, intent: "Oferecer o horário alternativo mais próximo do que ele pediu." }
      - { offset_days: 7, intent: "Encerrar e registrar a preferência para a recompra — é ela que traz o cliente de barbearia de volta." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  # Falta é o maior problema do segmento — cadência própria
  - key: appointment_confirm
    applies_to: trial_followup
    steps:
      - { offset_days: -1, intent: "Confirmação com fechamento por alternativa" }
      - { offset_days: 1,  intent: "Pós-serviço: satisfação e reagendamento" }
    stop_on: [converted, opted_out]

  - key: rescue_lapsed
    applies_to: reactivation
    steps:
      - { offset_days: 0, intent: "Lembrete de manutenção baseado na frequência habitual" }
      - { offset_days: 7, intent: "Oferta de retorno com horário específico" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 2

hard_rules:
  - "Nunca afirmar horário, valor ou serviço que não esteja no DNA."
  - "Nunca confirmar disponibilidade de agenda sem consultar o fato no DNA."
  - "Nunca prometer resultado exato de coloração ou tratamento capilar."
  - "Nunca encerrar com pergunta aberta — oferecer dois horários concretos."
  - "Uma mensagem, um objetivo."

kpis:
  - conversion_rate
  - no_show_rate
  - return_rate_30d
  - median_response_time
