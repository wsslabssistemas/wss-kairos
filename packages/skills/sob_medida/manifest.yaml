key: sob_medida
name: Projetos Sob Medida (marcenaria, vidraçaria, serralheria, esquadrias)
version: 1.0.0

# =====================================================================
# O SEGMENTO MAIS ARCAICO DO PAÍS EM TÉCNICA DE VENDAS.
#
# Diagnóstico (pesquisa jul/2026): o cliente pede orçamento, o profissional
# vai ao local, mede e manda um PDF por WhatsApp — e SILENCIA. Estima-se
# que mais de 70% dos orçamentos deste setor nunca recebem uma segunda
# mensagem. Não se perde por preço; perde-se por silêncio.
#
# Dois gargalos, não um:
#   1. ANTES: visita técnica gratuita para quem só pesquisava preço é
#      prejuízo puro (combustível, tempo, conhecimento). Qualificar antes
#      de pegar o carro é dinheiro.
#   2. DEPOIS: orçamento é VENDA, não arquivo. Quem apresenta e faz
#      cadência vence quem manda PDF e espera.
#
# Por isso a jornada tem uma etapa de qualificação ANTES da visita, e a
# etapa do orçamento carrega a cadência mais importante do manifesto.
# =====================================================================

capabilities:
  - prospeccao
  - licitacoes

vocabulary:
  lead: "cliente em potencial"
  conversion: "projeto fechado"
  churn: "orçamento perdido"
  catalog_item: "serviço"

discovery_axis: "o que a pessoa quer resolver no ambiente (espaço, estética, segurança, economia) e para quando"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Entender o que a pessoa precisa. Nunca dar preço por metro sem ver."
    - key: qualificacao
      label: "Qualificação"
      goal: "Descobrir escopo, prazo, orçamento e se a obra existe de verdade — antes de marcar a visita."
      cadence: qualificar
    - key: visita
      label: "Visita técnica e medição"
      goal: "Medir certo e usar a visita para vender: é ali que a consultoria acontece."
      cadence: pre_visita
      phases:
        - { key: agendada,   label: "Visita agendada",   offset_days: 0 }
        - { key: confirmar,  label: "Confirmar véspera", offset_days: -1 }
        - { key: realizada,  label: "Visita realizada",  offset_days: 1 }
    - key: orcamento
      label: "Orçamento apresentado"
      goal: "Apresentar (não só enviar) e conduzir a decisão. Aqui é onde a maioria some."
      cadence: pos_orcamento
      phases:
        - { key: entrega,   label: "Orçamento entregue", offset_days: 0 }
        - { key: duvidas,   label: "Tirar dúvidas",      offset_days: 3 }
        - { key: condicao,  label: "Condição/ajuste",    offset_days: 7 }
        - { key: decisao,   label: "Buscar decisão",     offset_days: 15 }
    - key: negociacao
      label: "Negociação"
      cadence: negociacao_travada
      goal: "Isolar a objeção real (valor, prazo, concorrente, escopo) e viabilizar."
    - key: fechado
      label: "Projeto fechado"
      terminal: true
      won: true
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # `perdido` = perdeu_silencio, `recusou` = perdeu_decisão.
    - key: perdido
      label: "Parou de responder"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

contact_fields:
  - key: tipo_servico
    label: "O que ele precisa"
    type: enum
    # `energia_solar` saiu daqui em ago/2026: virou Skill própria. Manter a
    # opção dava a impressão de cobertura que a biblioteca não tinha — nenhuma
    # das 16 entradas deste segmento falava de solar.
    options:
      [moveis_planejados, esquadrias, vidro_temperado, box_banheiro, guarda_corpo,
       portao_automatico, marmore_granito, climatizacao, forro_drywall, outro]
  - key: ambiente
    label: "Onde"
    type: enum
    options: [cozinha, dormitorio, banheiro, sala, escritorio, area_externa, fachada, imovel_todo, outro]
  - key: fase_da_obra
    label: "Fase da obra"
    type: enum
    options: [ainda_projetando, obra_em_andamento, obra_pronta, reforma, so_pesquisando]
  - key: prazo
    label: "Para quando precisa"
    type: enum
    options: [urgente, ate_30_dias, 1_a_3_meses, sem_prazo_definido]
  - key: quem_decide
    label: "Quem decide"
    type: enum
    options: [o_proprio, casal, arquiteto, construtora, sindico_condominio, empresa]
  - key: origem_indicacao
    label: "Indicado por"
    type: enum
    options: [ninguem, arquiteto, engenheiro, construtora, cliente_antigo, outro_profissional]

  # ---------------------------------------------------------------------
  # QUALIFICACAO DE COMPRA (MEDDIC-lite) - item 3 do M3.
  # As quatro perguntas que dizem se o negocio existe de verdade. O campo
  # `decisor` diz QUEM e o contato; estes dizem como a compra anda.
  # Chaves e opcoes sao CANONICAS (validadas pelo skill-loader): sem isso a
  # dimensao não se compara entre segmentos, que e a unica razao de existir.
  # Só o label e do ramo.
  # ---------------------------------------------------------------------
  - key: verba
    label: "Verba do cliente"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Quem decide junto"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem puxa a decisão em casa"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

# ---------------------------------------------------------------------
# AGENDAMENTO
# A visita técnica é o gargalo: agendar bem evita deslocamento perdido.
# Bloco maior porque inclui deslocamento e medição.
# ---------------------------------------------------------------------
scheduling:
  enabled: true
  default_duration_min: 90
  slot_step_min: 60
  min_advance_min: 240

# ---------------------------------------------------------------------
# REGISTRO DE ATENDIMENTO COM VALOR
# Só faz sentido onde a receita vem de serviço executado e repetido.
# Em venda de contrato/pedido (B2B), o dinheiro é acompanhado por
# proposta e pedido — não por 'atendimento'. Por isso é dado, não código.
# ---------------------------------------------------------------------
services:
  enabled: false

lead_sources:
  - whatsapp
  - instagram
  - google
  - indicacao
  - arquiteto
  - construtora
  - site
  - prospeccao
  - licitacao
  - facebook
  - campanha
  - outro

# ---------------------------------------------------------------------
# POR QUE O CLIENTE NÃO FECHOU
#
# Lista fechada, do MANIFESTO — é o que permite SOMAR. `fora_da_campanha` tira
# da reativação automática, e `abordagem` é o texto que chega em quem redige.
#
# ⚠ AQUI O CLIENTE NÃO COMPRA O PRODUTO, COMPRA UMA OBRA — e obra tem
# calendário próprio, quase sempre atrasado. O motivo mais comum de "sumir" não
# é preço nem concorrente: é a obra dele ter parado. Tratar isso como perda faz
# a empresa desistir de um pedido que só estava esperando o piso ficar pronto.
churn_reasons:
  - key: obra_atrasada
    label: "A obra dele atrasou ou parou"
    o_que_fazer: "Não é perda, é calendário. Pergunte para quando ficou e REGISTRE a data — quem está com a obra parada não decide móvel nenhum, e insistir agora vira ruído. Voltar na data certa é a diferença entre o pedido e o silêncio."
    pausa_dias: 60
    abordagem: "Na data que ele indicou, retome pelo ponto da obra: 'você tinha me falado que o piso ficaria pronto por volta de [mês] — como está por aí?'. O projeto entra depois."
  - key: orcamento_acima
    label: "Orçamento acima do que ele esperava"
    o_que_fazer: "É o único motivo em que condição resolve, e o caminho é ESCOPO, não desconto: fazer por ambientes, começar pelo que trava a mudança (cozinha, armário do quarto) e deixar o resto para depois. Cortar preço mantendo o projeto inteiro desvaloriza o próximo orçamento."
  - key: outro_fornecedor
    label: "Fechou com outro"
    o_que_fazer: "Descubra o que pesou — prazo, projeto, acabamento, condição. Em sob medida o PRAZO decide mais que o preço: quem se muda em março não espera entrega em maio. E anote: obra tem ambientes que ficam para depois, e o segundo ambiente pode ser seu."
    pausa_dias: 120
    abordagem: "Depois de quatro meses, procure sem cobrar a escolha: 'lembrei do seu projeto — ficou algum ambiente para uma segunda etapa?'."
  - key: mudou_o_projeto
    label: "Mudou o projeto ou a ideia"
    o_que_fazer: "Peça para entender o que mudou e ofereça refazer a proposta — projeto que muda é sinal de cliente ativo, não de cliente perdido. Só não refaça sem perguntar: proposta nova em cima de ideia velha volta errada."
  - key: desistiu_do_imovel
    label: "Desistiu do imóvel ou da mudança"
    o_que_fazer: "Fora do alcance para este projeto. Pergunte se a mudança foi adiada ou cancelada — as duas palavras parecem iguais e significam coisas opostas."
    fora_da_campanha: true
  - key: sem_retorno
    label: "Sumiu depois do orçamento, sem dizer o motivo"
    o_que_fazer: "O mais comum do ramo. Faça UMA pergunta fechada e fácil: 'só para eu não te incomodar à toa — o projeto ficou para mais adiante, ou vocês seguiram com outra empresa?'. Escolher entre duas opções custa menos que confessar."
  - key: nao_disse
    label: "Não quis dizer"
    o_que_fazer: "Registre assim mesmo: quem não contou é diferente de quem nunca foi perguntado."

dna_sections:
  - key: catalog
    label: "O que você faz"
    required: true
    fields:
      - { key: items, type: table, columns: [servico, material, observacao], required: true, label: "Serviços e materiais", help: "Liste o que você executa. O sistema só pode falar do que estiver aqui" }
      - { key: nao_faz, type: list, label: "O que você NÃO faz", help: "Serviços que costumam pedir e você não atende. Evita promessa errada" }
  - key: pricing
    label: "Valores e pagamento"
    required: true
    fields:
      - { key: range, type: money_range, label: "Faixa de investimento", help: "A faixa típica dos seus projetos. Ex.: de R$ 3 mil a R$ 40 mil" }
      - { key: como_cobra, type: text, required: true, label: "Como você cobra", help: "Por metro, por peça, por projeto fechado? Ex.: por metro linear, após medição", options: ["Por metro linear, após a medição", "Projeto fechado, com o valor definido na proposta", "Por peça", "Por metro quadrado de material"] }
      - { key: parcelamento, type: text, required: true, label: "Formas de pagamento", help: "Ex.: 30% na assinatura, 40% na produção, 30% na entrega", options: ["PIX, débito e crédito à vista", "PIX, débito e crédito em até 3x sem juros", "PIX, débito e crédito em até 6x sem juros", "PIX e dinheiro, com desconto à vista"] }
      - { key: financiamento, type: text, label: "Financiamento", help: "Trabalha com financiamento ou parceiro de crédito? Qual?", options: ["Não trabalho com financiamento", "Parcelo direto, sem banco", "Tenho parceiro de crédito", "Aceito financiamento que o cliente trouxer"] }
  - key: availability
    label: "Prazos e agenda"
    required: true
    fields:
      - { key: prazo_visita, type: text, required: true, label: "Prazo para a visita", help: "Em quanto tempo você consegue ir medir. Ex.: em até 3 dias úteis", options: ["Em até 2 dias úteis", "Em até 3 dias úteis", "Em até 1 semana", "Depende da distância"] }
      - { key: prazo_orcamento, type: text, required: true, label: "Prazo do orçamento", help: "Quanto tempo depois da visita você entrega. Ex.: em até 48h", options: ["Em até 48 horas após a visita", "Em até 3 dias úteis", "Em até 1 semana", "Depende do tamanho do projeto"] }
      - { key: prazo_entrega, type: text, required: true, label: "Prazo de execução", help: "Da aprovação até a entrega. Ex.: 25 dias úteis para móveis", options: ["No mesmo dia", "Em até 3 dias úteis", "Em até 1 semana", "15 dias úteis após aprovação", "Varia por item"] }
      - { key: weekly_hours, type: schedule, label: "Horário de atendimento", help: "Ex.: Seg a Sex 8h-18h; Sáb 8h-12h" }
  - key: risk_free_entry
    label: "Visita técnica"
    required: true
    fields:
      - { key: visita_gratuita, type: boolean, required: true, label: "A visita é gratuita?", help: "Marque se você não cobra pela visita de medição" }
      - { key: valor_visita, type: text, label: "Valor da visita", help: "Se cobra, quanto e se abate no fechamento. Ex.: R$ 150, abatido no contrato", options: ["A visita é gratuita", "Cobro a visita e abato no fechamento", "Cobro a visita, sem abatimento", "Gratuita dentro da minha região"] }
      - { key: raio_atendimento, type: text, required: true, label: "Onde você atende", help: "Sua região. Ex.: Porto Alegre e até 40 km", options: ["Minha cidade e região", "Até 40 km da minha base", "Todo o estado", "Atendo fora com custo de deslocamento"] }
      - { key: o_que_leva, type: text, label: "O que acontece na visita", help: "Ex.: medimos, fotografamos e apresentamos materiais na hora", options: ["Medimos, fotografamos e mostramos os materiais na hora", "Medimos e enviamos o projeto depois", "Medimos e já apresentamos uma prévia do projeto", "Conversa de escopo primeiro, medição depois"] }
  - key: expertise_proof
    label: "Experiência e garantia"
    required: true
    fields:
      - { key: tempo_de_casa, type: text, required: true, label: "Tempo de mercado", help: "Há quanto tempo você atua. Ex.: 15 anos", options: ["Menos de 2 anos", "2 a 5 anos", "5 a 10 anos", "10 a 20 anos", "Mais de 20 anos"] }
      - { key: obras_referencia, type: list, label: "Trabalhos de referência", help: "Projetos que você pode citar ou mostrar" }
      - { key: garantia, type: text, required: true, label: "Garantia", help: "O que você garante e por quanto tempo. Ex.: 5 anos em ferragens", options: ["Retoque grátis em até 7 dias", "Retoque grátis em até 15 dias", "90 dias, como manda a lei", "1 ano no serviço executado"] }
      - { key: equipe, type: text, label: "Equipe", help: "Quem executa: equipe própria ou terceirizada?", options: ["Equipe própria", "Equipe própria para o principal e parceiros para o resto", "Trabalho sozinho", "Equipe terceirizada, coordenada por mim"] }
  - key: differentials
    label: "Diferenciais"
    fields:
      - { key: items, type: list, label: "Seus diferenciais", help: "Por que escolher você e não o mais barato. Seja concreto" }
      - { key: marcas, type: list, label: "Marcas e fornecedores", help: "Materiais e marcas que você usa e que são referência" }
      - { key: projeto_3d, type: boolean, label: "Faz projeto em 3D?", help: "Marque se você apresenta o projeto em 3D antes de fechar" }
  - key: policies
    label: "Regras do serviço"
    fields:
      - { key: alteracao_escopo, type: text, label: "Mudança no projeto", help: "O que acontece se o cliente mudar depois de aprovado", options: ["Refaço o orçamento e o prazo antes de seguir", "Aceito mudança até o início da produção", "Mudança após aprovação tem custo adicional", "Avalio caso a caso"] }
      - { key: cancelamento, type: text, label: "Cancelamento", help: "Regra de cancelamento e devolução de sinal", options: ["Até 2 horas antes, sem cobrança", "Até 24 horas antes, sem cobrança", "Até 48 horas antes, sem cobrança", "Remarcando na hora, sem cobrança"] }
      - { key: assistencia, type: text, label: "Assistência", help: "Como funciona o atendimento pós-entrega", options: ["Atendo chamado de ajuste dentro da garantia", "Revisão de ajuste alguns meses após a entrega", "Atendimento sob demanda, cobrado", "Não tenho processo formal"] }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address, type: text, label: "Endereço", help: "Onde fica sua loja/oficina, se recebe cliente" }
      - { key: whatsapp, type: text, label: "WhatsApp", help: "O número que o cliente usa para falar com você" }
      - { key: instagram, type: text, label: "Instagram", help: "Onde o cliente vê seus trabalhos. Ex.: @suaempresa" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

categories:
  pricing:            "Como você cobra, faixa de investimento e parcelamento"
  risk_free_entry:    "Visita técnica e medição como porta de entrada"
  availability:       "Prazo de visita, de orçamento e de execução"
  expertise_proof:    "Tempo de mercado, obras de referência e garantia"
  catalog:            "Serviços, materiais e o que você não faz"
  goal_matching:      "O que a pessoa quer resolver → solução indicada"
  objections:         "Caro, achei mais barato, vou pensar, vou ver com meu marido"
  commitment_offer:   "Projeto fechado, condição de pagamento e financiamento"
  reciprocity:        "Visita, projeto 3D e consultoria de materiais"
  limits_and_ethics:  "Não prometer preço sem medir nem prazo sem conferir agenda"
  retention:          "Cliente antigo: manutenção, ampliação e novo ambiente"
  ecosystem:          "Arquitetos, construtoras e indicação profissional"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA — qual escola de venda governa cada situação
# NESTE segmento. Não existe "a melhor técnica": existe a técnica certa para
# o tamanho da decisão. Rackham provou que fechamento por pressão levanta a
# conversão em ticket baixo e a DERRUBA em ticket alto — por isso barbearia
# e indústria não podem responder com a mesma escola.
# A entrada da biblioteca pode sobrescrever (`school`); sem override, vale isto.
# Escolas válidas: docs/blueprint/COS_Escolas_de_Venda.md
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     consultiva_spin
  availability:        consultiva_spin
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    cadencia_blount
  reciprocity:         cadencia_blount
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência, o núcleo escrevia a própria frase
  # genérica - a mesma para todo ramo. Eram 39 das 80 etapas vivas.
  #
  # REGUA LONGA, DE PROPÓSITO. Rackham mediu: em ticket alto, pressão DERRUBA
  # conversão. Cada toque precisa trazer informação nova, e o intervalo
  # respeita que do outro lado existe processo interno, não humor.
  # Deste ramo: medida no local vem antes de preço, e o
  # concorrente que da número por telefone e o que ele vai comparar.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 2, intent: "Pedir o ambiente e a medida aproximada, e explicar em uma linha por que preço por metro sem ver engana os dois lados." }
      - { offset_days: 6, intent: "Oferecer a visita de medição como passo curto e sem compromisso - e ela que transforma curiosidade em projeto." }
      - { offset_days: 14, intent: "Encerrar com porta aberta. Reforma tem tempo próprio e voltar em três meses e normal neste ramo." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: negociacao_travada
    applies_to: negotiation
    steps:
      - { offset_days: 3, intent: "Nomear o que ele levantou e responder com o fato que falta - prazo de produção, material, o que esta e o que não esta no escopo." }
      - { offset_days: 8, intent: "Checar se a comparação e com o mesmo escopo. Orçamento mais barato quase sempre e escopo menor, e mostrar isso e informação, não ataque." }
      - { offset_days: 16, intent: "Perguntar se e para agora ou para depois da obra, e aceitar 'depois' sem insistir - insistir aqui perde a indicação junto." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  # Antes de pegar o carro: visita para curioso é prejuízo.
  - key: qualificar
    applies_to: cold_outreach
    steps:
      - { offset_days: 1, intent: "Confirmar escopo e prazo antes de agendar a visita" }
      - { offset_days: 4, intent: "Retomar quem não respondeu, sem cobrar" }
    stop_on: [replied, converted, opted_out]
    max_attempts: 2

  - key: pre_visita
    applies_to: trial_followup
    steps:
      - { offset_days: -1, intent: "Confirmar a visita na véspera e evitar deslocamento perdido" }
      - { offset_days: 1,  intent: "Agradecer a visita e informar quando o orçamento chega" }
    stop_on: [converted, opted_out]

  # A cadência mais importante: 3 toques em 15 dias, ÂNGULO DIFERENTE em cada.
  - key: pos_orcamento
    applies_to: proposal_followup
    steps:
      - { offset_days: 3,  intent: "Tirar dúvida sobre o projeto, sem cobrar decisão" }
      - { offset_days: 7,  intent: "Apresentar condição de pagamento que viabiliza" }
      - { offset_days: 15, intent: "Propor ajuste de escopo ou etapa inicial menor" }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: reativacao
    applies_to: reactivation
    steps:
      - { offset_days: 0,   intent: "Retomar cliente antigo com gancho de manutenção ou novo ambiente" }
      - { offset_days: 180, intent: "Oferecer revisão ou ampliação do que já foi feito" }
    stop_on: [replied, converted, opted_out]

hard_rules:
  - "NUNCA dar preço fechado sem medir. Valor por mensagem sem visita gera retrabalho e perda de margem."
  - "Não prometer prazo de execução sem conferir a agenda de produção."
  - "Não afirmar material, marca ou garantia que não esteja no DNA."
  - "Não desqualificar o orçamento do concorrente — mostrar o que está incluso no seu."

kpis:
