key: pet
name: Pet (banho e tosa, creche, hotel e day care)
version: 1.0.0

# =====================================================================
# POR QUE ESTE SEGMENTO EXISTE — e por que não é barbearia com cachorro.
#
# A dica veio do fundador: "hoje temos pets com creche e hotel". É
# exatamente isso que separa este segmento de tudo que já existe.
#
# Banho e tosa, sozinho, seria quase barbearia: agenda, recompra por dias,
# vínculo com o profissional. Creche e hotel são OUTRO NEGÓCIO, e trazem
# quatro coisas que nenhuma das 12 Skills anteriores tem:
#
# 1. HOSPEDAGEM SE VENDE POR PERÍODO, NÃO POR HORÁRIO. Entrada e saída,
#    diárias, e um limite físico de vagas. É estoque de leito, não de
#    cadeira — e na alta temporada (feriado, férias, fim de ano) ele
#    esgota com antecedência, como a data da casa de festas.
#
# 2. CRECHE SE VENDE POR PLANO MENSAL, com frequência declarada (2x, 3x,
#    5x por semana). É receita recorrente contratada, mais parecida com
#    academia do que com banho e tosa — e a evasão se parece com a de
#    academia também.
#
# 3. EXISTE UMA PORTA DE ENTRADA OBRIGATÓRIA QUE NÃO É COMERCIAL: a
#    AVALIAÇÃO COMPORTAMENTAL. Cão que não se adapta ao grupo não entra —
#    e aceitar sem avaliar é como o salão fazer química sem ver o
#    histórico do fio: o dano acontece com outro cliente junto.
#    Some-se a isso a exigência de carteira de vacina em dia, que é regra
#    sanitária e não preferência.
#
# 4. QUEM DECIDE NÃO É QUEM USA, e a emoção é o produto. O tutor deixa um
#    membro da família com desconhecidos. O relatório do dia — foto,
#    vídeo, como ele passou — não é mimo: é a entrega do serviço, e é o
#    que faz a mensalidade se sustentar.
#
# CONTEXTO: o Brasil é o 3º maior mercado pet do mundo, com mais de 240
# milhões de animais. E um alerta que vale escrever: cerca de 29% das
# empresas do setor fecham em até dois anos, quase sempre por gestão
# financeira e controle — não por falta de cliente.
#
# ATENÇÃO AO LIMITE: veterinário NÃO está coberto aqui. Consulta, exame e
# cirurgia são `clinica`, que já existe. Se um dia houver Skill de clínica
# veterinária, ela nasce de `clinica`, não daqui.
# =====================================================================

capabilities: []

vocabulary:
  lead: "tutor"
  conversion: "cliente ativo"
  churn: "tutor que parou de trazer"
  catalog_item: "serviço"

discovery_axis: "que animal é (porte, idade, temperamento), do que o tutor precisa (rotina, viagem, socialização) e com que frequência"

journey:
  allow_skip: true
  allow_regression: true
  stages:
    - key: contato
      label: "Primeiro contato"
      cadence: primeiro_contato
      goal: "Descobrir o animal e a necessidade. Porte e temperamento mudam preço, vaga e viabilidade."
    - key: avaliacao
      label: "Avaliação e adaptação"
      goal: "Dia de teste para creche e hotel. Cão que não se adapta ao grupo não entra — e isso protege todo mundo."
      cadence: pos_avaliacao
      phases:
        - { key: marcada,   label: "Avaliação marcada",  offset_days: 0 }
        - { key: realizada, label: "Avaliação feita",    offset_days: 1 }
    - key: agendado
      label: "Serviço agendado"
      goal: "Banho, tosa ou primeira diária marcada, com vacina conferida."
      cadence: confirmacao
      phases:
        - { key: marcado,   label: "Agendado",            offset_days: 0 }
        - { key: confirmar, label: "Confirmar véspera",   offset_days: -1 }
    - key: ativo
      label: "Cliente ativo"
      goal: "Frequência estabelecida: banho no ciclo, plano de creche ou diárias recorrentes."
      cadence: pos_servico
    - key: fiel
      label: "Cliente fiel"
      # Terminal E `won`, como barbearia e salão: é o tutor conquistado, e
      # é de onde sai a recompra por ciclo.
      terminal: true
      won: true
      goal: "Rotina firmada. Daqui em diante o jogo é frequência, alta temporada e indicação."
    # PERDIDO DEIXOU DE SER TERMINAL (ago/2026, decisão do fundador).
    #
    # O piloto real mediu: 459 desfechos de "perdeu por SILÊNCIO" contra 59 de
    # "perdeu por DECISÃO". Quase 8 para 1. Etapa terminal desliga o motor —
    # sem follow-up e sem reativação —, então marcar como perdido quem apenas
    # parou de responder apagava a pessoa para sempre. Sumir não é dizer não.
    #
    # As duas etapas agora espelham a enum canônica de desfecho do `0044`:
    # a de silêncio é `lost` e alcançável; a de recusa é terminal.
    - key: perdido
      label: "Parou de trazer"
      lost: true
      goal: "Sumiu sem dizer não. Não recebe recompra — recebe REATIVAÇÃO, com ângulo novo, depois de 60 a 90 dias."
    - key: recusou
      label: "Disse não"
      terminal: true
      lost: true
      goal: "Recusou de forma explícita. Aqui a conversa encerra de verdade."

contact_fields:
  - key: nome_animal
    label: "Nome do animal"
    type: text
  - key: especie
    label: "Espécie"
    type: enum
    options: [cao, gato, outro]
  - key: porte
    label: "Porte"
    type: enum
    options: [mini, pequeno, medio, grande, gigante]
  - key: raca_pelagem
    label: "Raça / pelagem"
    type: text
  - key: idade
    label: "Idade"
    type: enum
    options: [filhote, adulto, idoso]
  - key: servico_principal
    label: "O que o tutor procura"
    type: enum
    options:
      [banho_tosa, creche_diaria, creche_plano, hotel, day_care, adestramento,
       taxi_dog, leva_e_traz, outro]
  # CAMPO DE SEGURANÇA, não de preferência — como o histórico químico no
  # salão. Cão reativo em grupo machuca outro animal, e a responsabilidade
  # é da casa. Sem avaliação não entra.
  - key: temperamento
    label: "Como ele é com outros animais"
    type: enum
    options: [sociavel, reservado, reativo, nao_sei, ainda_nao_avaliado]
  - key: vacinas
    label: "Vacinas em dia"
    type: enum
    options: [sim_comprovado, sim_sem_comprovante, vencidas, nao_sei]
  - key: castrado
    label: "Castrado"
    type: enum
    options: [sim, nao, nao_sei]
  - key: restricao_saude
    label: "Restrição de saúde ou medicação"
    type: text
  - key: frequencia
    label: "Frequência pretendida"
    type: enum
    options: [1x_semana, 2x_semana, 3x_semana, 5x_semana, quinzenal, mensal, so_quando_viaja, indefinida]

  # QUALIFICAÇÃO DE COMPRA (MEDDIC-lite). Chaves e opções canônicas.
  # Faz sentido no plano mensal e na hospedagem longa, que são compromisso
  # de valor e costumam ser decididos por duas pessoas na casa.
  - key: verba
    label: "Como pretende pagar"
    type: enum
    options: [sem_verba, verba_prevista, verba_aprovada, busca_financiamento, indefinido]
  - key: processo_decisao
    label: "Quem decide junto"
    type: enum
    options: [decide_sozinho, duas_pessoas, comite_ou_diretoria, licitacao, indefinido]
  - key: criterio_decisao
    label: "O que vai pesar na escolha"
    type: enum
    options: [preco, prazo, qualidade_tecnica, atendimento, risco_ou_garantia, indefinido]
  - key: defensor_interno
    label: "Quem puxa a decisão em casa"
    type: enum
    options: [sim_identificado, sim_mas_sem_forca, nao_ha, indefinido]

scheduling:
  enabled: true
  default_duration_min: 90
  slot_step_min: 30
  min_advance_min: 120

services:
  enabled: true
  label: "Atendimentos realizados"
  item_label: "serviço"

# Banho tem ciclo próprio por pelagem; creche é frequência semanal; hotel
# é por viagem. O campo do contato manda; isto é o padrão do banho.
recurrence:
  # O QUE DIZER NO TOQUE DE RECOMPRA, na voz deste ramo. Estava no núcleo,
  # servindo igual para o corte de 21 dias e para a reposição de estoque —
  # hábito pessoal de um lado, ruptura de prateleira do outro.
  intent: "O pelo já está pedindo o próximo banho ou tosa. Ofereça a janela concreta para o porte dele e lembre do que foi combinado da última vez — tosa tem ritmo, e o tutor conta com quem lembra."
  enabled: true
  default_interval_days: 21
  field: frequencia

lead_sources:
  - whatsapp
  - instagram
  - google
  - indicacao
  - passou_na_frente
  - veterinario_parceiro
  - vizinhanca
  - site
  - facebook
  - campanha
  - outro

dna_sections:
  - key: catalog
    label: "Serviços e estrutura"
    required: true
    fields:
      - { key: items, type: table, columns: [servico, duracao, observacao], required: true, label: "Serviços que vocês fazem", help: "O sistema só fala do que estiver aqui" }
      - { key: nao_faz, type: list, label: "O que vocês NÃO fazem", help: "Ex.: não atendemos gato, não fazemos tosa de raça específica, não aceitamos cão reativo" }
      - { key: estrutura, type: list, label: "O que a casa tem", help: "Área externa, piscina, câmeras, ar-condicionado, separação por porte" }
      - { key: capacidade, type: text, label: "Capacidade", help: "Quantos animais por dia na creche e quantas vagas no hotel. É o que esgota na alta temporada", options: ["Até 10 animais por dia", "De 10 a 25 por dia", "De 25 a 50 por dia", "Mais de 50 por dia"] }
  - key: pricing
    label: "Valores"
    required: true
    fields:
      # PORTE E PELAGEM mudam o preço do banho como comprimento muda o da
      # química. Régua, não número solto.
      - { key: banho_por_porte, type: text, required: true, label: "Preço do banho por porte", help: "A régua. Ex.: mini R$ 55, pequeno R$ 65, médio R$ 85, grande R$ 110. Pelagem longa tem acréscimo", options: ["Faixa por porte: mini, pequeno, médio e grande", "Faixa por porte e por tipo de pelagem", "Valor único, independente do porte", "Orçamento por avaliação do animal"] }
      - { key: plano_creche, type: text, label: "Planos de creche", help: "Por frequência semanal. Ex.: 2x R$ 380/mês, 3x R$ 520, 5x R$ 750", options: ["Planos por frequência semanal: 2x, 3x e 5x", "Plano mensal com frequência livre", "Diária avulsa, sem plano", "Planos mensais e diária avulsa"] }
      - { key: diaria_hotel, type: text, label: "Diária do hotel", help: "Por porte, e se a diária conta por pernoite ou por período de 24h", options: ["Diária por porte, contada por pernoite", "Diária por porte, contada por período de 24h", "Diária única, independente do porte", "Não trabalho com hotel"] }
      - { key: alta_temporada, type: text, label: "Alta temporada", help: "Se tem acréscimo em feriado e férias, e quanto. Dizer antes evita conflito", options: ["Acréscimo em feriados e férias", "Mesmo preço o ano inteiro", "Acréscimo só no fim de ano", "Acréscimo e estadia mínima em alta temporada"] }
      - { key: parcelamento, type: text, required: true, label: "Formas de pagamento", help: "Ex.: PIX, cartão, e como funciona a cobrança do plano mensal", options: ["PIX, débito e crédito à vista", "PIX, débito e crédito em até 3x sem juros", "PIX, débito e crédito em até 6x sem juros", "PIX e dinheiro, com desconto à vista"] }
  - key: availability
    label: "Agenda e vagas"
    required: true
    fields:
      - { key: weekly_hours, type: schedule, required: true, label: "Horário de funcionamento", help: "Inclua o horário de entrega e retirada, que é o que mais gera dúvida" }
      - { key: antecedencia_hotel, type: text, required: true, label: "Antecedência do hotel", help: "Com quanto tempo lota em feriado e férias. Ex.: fim de ano fecha com 60 dias", options: ["Fim de ano fecha com 2 meses", "Feriados fecham com 1 mês", "Costuma ter vaga na semana", "Depende muito da época"] }
      - { key: prazo_banho, type: text, label: "Tempo do banho e tosa", help: "Quanto o animal fica na casa. Ex.: 2 a 3 horas, ou por agendamento com hora marcada", options: ["2 a 3 horas", "3 a 4 horas", "Meio período", "Agendamento com hora marcada de entrada e saída"] }
  - key: risk_free_entry
    label: "Avaliação e adaptação"
    required: true
    fields:
      - { key: avaliacao_obrigatoria, type: boolean, required: true, label: "A avaliação comportamental é obrigatória?", help: "Para creche e hotel. É o que protege os outros animais e a sua responsabilidade" }
      - { key: como_funciona, type: text, required: true, label: "Como funciona o dia de teste", help: "Duração, o que vocês observam e o que acontece se o cão não se adaptar", options: ["Uma aula ou sessão de experiência, sem compromisso", "Avaliação primeiro, e a partir dela montamos a proposta", "Conversa de diagnóstico e depois a experiência prática", "Agenda direta, sem etapa de avaliação"] }
      - { key: primeira_vez, type: text, label: "Condição de primeira vez", help: "Se existe. Ex.: dia de experimentação de creche sem custo", options: ["Não tenho condição especial de primeira vez", "Primeira avaliação sem custo", "Desconto na primeira visita", "Cortesia simples de boas-vindas, sem desconto no serviço"] }
  - key: policies
    label: "Regras da casa"
    required: true
    fields:
      # Vacina é regra sanitária, não preferência. Fica destacada.
      - { key: vacinas_exigidas, type: text, required: true, label: "Vacinas exigidas", help: "Quais, e com que antecedência. Ex.: V8/V10, antirrábica e gripe canina, com no mínimo 15 dias", options: ["V8 ou V10, antirrábica e gripe canina, em dia", "V8 ou V10 e antirrábica, em dia", "Carteira de vacinação completa e vermífugo em dia", "Exijo a carteira e avalio caso a caso"] }
      - { key: cancelamento, type: text, required: true, label: "Cancelamento e falta", help: "Prazo para desmarcar. No hotel, a reserva de alta temporada costuma ter regra própria", options: ["Até 2 horas antes, sem cobrança", "Até 24 horas antes, sem cobrança", "Até 48 horas antes, sem cobrança", "Remarcando na hora, sem cobrança"] }
      - { key: emergencia, type: text, required: true, label: "Se acontecer alguma coisa", help: "Qual veterinário vocês acionam, quem autoriza e quem paga. É a pergunta que o tutor tem medo de fazer", options: ["Levo ao veterinário parceiro e aviso o tutor na hora", "Aviso o tutor primeiro e sigo a orientação dele", "Tenho veterinário na casa", "Levo ao veterinário do próprio tutor, se ele indicar"] }
      - { key: nao_aceita, type: text, label: "Quando vocês recusam", help: "Cão reativo, fêmea no cio, animal doente, vacina vencida. Recusar bem escrito é confiança", options: ["Animal doente, vacina vencida, fêmea no cio ou cão reativo", "Vacina vencida ou animal com sinal de doença", "Cão reativo com outros animais", "Avalio caso a caso no dia de teste"] }
  - key: expertise_proof
    label: "Equipe e cuidado"
    required: true
    fields:
      - { key: tempo_de_casa, type: text, required: true, label: "Tempo de casa", help: "Ex.: 7 anos no bairro", options: ["Menos de 2 anos", "2 a 5 anos", "5 a 10 anos", "10 a 20 anos", "Mais de 20 anos"] }
      - { key: equipe, type: text, label: "Quem cuida", help: "Quantas pessoas, formação, e quantos animais por cuidador na creche", options: ["Equipe própria", "Equipe própria para o principal e parceiros para o resto", "Trabalho sozinho", "Equipe terceirizada, coordenada por mim"] }
      - { key: monitoramento, type: text, label: "Câmeras e relatório", help: "Se o tutor acompanha, como e com que frequência. É a entrega emocional do serviço", options: ["Câmeras que o tutor acompanha pelo aplicativo", "Fotos e vídeos no grupo ou no privado", "Relatório do dia por mensagem", "Sem monitoramento à distância"] }
      - { key: parceria_vet, type: text, label: "Veterinário de apoio", help: "Com quem vocês trabalham em caso de intercorrência", options: ["Clínica veterinária parceira, próxima", "Veterinário que atende na casa quando preciso", "Uso o veterinário indicado pelo tutor", "Não tenho parceria formal"] }
  - key: retention
    label: "Frequência e retorno"
    required: true
    fields:
      - { key: intervalo_banho, type: text, required: true, label: "Intervalo de banho recomendado", help: "Por pelagem. Ex.: pelo curto a cada 21 dias; pelo longo a cada 15", options: ["Pelo curto a cada 21 dias; pelo longo a cada 15", "A cada 15 dias", "A cada 30 dias", "Depende da pelagem e da rotina do animal"] }
      - { key: lembrete, type: text, label: "Como vocês chamam de volta", help: "Ex.: mensagem 3 dias antes do ciclo com dois horários", options: ["Mensagem 3 dias antes do ciclo, com dois horários oferecidos", "Mensagem 1 semana antes, perguntando o melhor dia", "Mensagem no dia em que costuma dar o intervalo", "Hoje não faço isso de forma organizada"] }
  - key: ecosystem
    label: "Produtos e parcerias"
    fields:
      - { key: revenda, type: list, label: "O que vocês vendem", help: "Ração, antipulgas, brinquedo, acessório" }
      - { key: parceiros, type: list, label: "Parcerias", help: "Veterinário, adestrador, pet sitter, transporte" }
      - { key: indicacao, type: text, label: "Programa de indicação", help: "O que o tutor ganha por trazer alguém", options: ["Quem indica ganha desconto no próximo atendimento", "Quem indica e quem é indicado ganham desconto", "Quem indica ganha um serviço de cortesia", "Não tenho programa de indicação"] }
  - key: location_contact
    label: "Endereço e contatos"
    required: true
    fields:
      - { key: address, type: text, label: "Endereço", help: "Onde fica" }
      - { key: whatsapp, type: text, label: "WhatsApp", help: "O número que o tutor usa" }
      - { key: instagram, type: text, label: "Instagram", help: "Onde ele vê os animais. Ex.: @seupet" }
  - key: free_notes
    label: "Outras informações importantes"
    type: rich_text

categories:
  pricing:            "Banho por porte e pelagem, plano de creche, diária e alta temporada"
  risk_free_entry:    "Avaliação comportamental e dia de adaptação"
  availability:       "Horário, vaga de creche e reserva de hotel em alta temporada"
  expertise_proof:    "Equipe, quantos animais por cuidador, câmera e veterinário de apoio"
  catalog:            "Serviços, estrutura da casa e o que não fazem"
  goal_matching:      "O que o tutor precisa (rotina, viagem, socialização) → serviço certo"
  objections:         "Tá caro, tenho medo de deixar, faço em casa"
  commitment_offer:   "Plano mensal, pacote de banhos e reserva de hotel"
  reciprocity:        "Dia de experimentação, relatório do dia e orientação de cuidado"
  limits_and_ethics:  "Vacina, cão que não se adapta e o que acontece se algo der errado"
  retention:          "Ciclo do banho, frequência da creche e o tutor que sumiu"
  ecosystem:          "Veterinário, adestrador, ração e indicação"

# ---------------------------------------------------------------------
# ORQUESTRADOR DE ESTRATÉGIA.
#
# A diferença deste segmento: existe MEDO no meio de uma compra de ticket
# baixo. Deixar um animal com desconhecidos é decisão emocional, e por isso
# `objections` e `commitment_offer` NÃO vão para fechamento por pressão,
# apesar do ticket — vão para Voss e JOLT, como na clínica.
# Já `availability` vai para fechamento clássico, porque vaga de hotel em
# feriado é escassez real e verificável, como a data da casa de festas.
# ---------------------------------------------------------------------
strategy_map:
  pricing:             consultiva_spin
  risk_free_entry:     persuasao_cialdini
  availability:        fechamento_classico
  expertise_proof:     persuasao_cialdini
  catalog:             consultiva_spin
  goal_matching:       consultiva_spin
  objections:          negociacao_voss
  commitment_offer:    oferta_valor
  reciprocity:         persuasao_cialdini
  limits_and_ethics:   relacionamento_carnegie
  retention:           cadencia_blount
  ecosystem:           relacionamento_carnegie

cadences:
  # -------------------------------------------------------------------
  # CADÊNCIAS DO MIOLO DA VENDA (ago/2026)
  #
  # Estas etapas eram MUDAS: sem cadência declarada, o núcleo escrevia a
  # própria frase genérica — a mesma para todo ramo. Eram 39 das 80 etapas
  # vivas dos 15 segmentos, e quase todas aqui, onde a venda acontece.
  #
  # A régua abaixo é deste ramo: porte e temperamento mudam preço, vaga e
  # viabilidade — sem eles não existe resposta, e é por isso que a régua
  # persegue o DADO, não a venda.
  # -------------------------------------------------------------------
  - key: primeiro_contato
    applies_to: prospecting
    steps:
      - { offset_days: 1, intent: "Pedir só porte e raça, uma pergunta fechada. Sem isso não há preço nem vaga possível, e perguntar tudo de uma vez faz o tutor sumir." }
      - { offset_days: 3, intent: "Oferecer a janela de agenda mais fácil para o porte dele, mostrando que a resposta depende do animal e não de tabela." }
      - { offset_days: 7, intent: "Encerrar com porta aberta — banho e tosa volta sozinho quando o pelo pede." }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 3

  - key: pos_avaliacao
    applies_to: proposal_followup
    steps:
      - { offset_days: 1, intent: "Contar como o animal se saiu no dia de teste, com foto — é o que vende a creche" }
      - { offset_days: 4, intent: "Oferecer o plano com a frequência que fez sentido para a rotina dele" }
    stop_on: [replied, converted, opted_out, lost]
    max_attempts: 2

  - key: confirmacao
    applies_to: trial_followup
    steps:
      - { offset_days: -1, intent: "Confirmar a véspera e lembrar da carteira de vacina" }
      - { offset_days: 1,  intent: "Retomar quem faltou, sem cobrança, oferecendo novo horário" }
    stop_on: [converted, opted_out]

  - key: pos_servico
    applies_to: trial_followup
    steps:
      - { offset_days: 1,  intent: "Mandar como ele passou e perguntar se ficou tudo bem em casa" }
      - { offset_days: 15, intent: "Sugerir o próximo banho pelo ciclo da pelagem dele" }
    stop_on: [opted_out]

  # ALTA TEMPORADA: vaga de hotel em feriado e férias esgota, e quem avisa
  # antes vende a temporada inteira. É a cadência que mais rende aqui.
  - key: alta_temporada
    applies_to: reactivation
    steps:
      - { offset_days: -60, intent: "Avisar que a temporada está abrindo e oferecer reserva antes de lotar" }
      - { offset_days: -30, intent: "Retomar com as datas que ainda restam" }
    stop_on: [replied, converted, opted_out]

  - key: reativacao
    applies_to: reactivation
    steps:
      - { offset_days: 0,  intent: "Perguntar pelo animal, não pelo serviço — quem sumiu costuma ter um motivo" }
      - { offset_days: 20, intent: "Oferecer horário do ciclo dele, sem cobrança pela ausência" }
